<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granja Porcina - Gestión (v1)</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#223055;--text:#eef3ff;--muted:#a8b3cf;--acc:#7dd3fc;--bad:#ff6b6b;--ok:#34d399;--warn:#fbbf24;}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#070b14,var(--bg));color:var(--text)}
  header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;flex-wrap:wrap}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{width:36px;height:36px;border-radius:12px;background:conic-gradient(from 180deg,var(--acc),#a78bfa,var(--acc));display:grid;place-items:center;color:#071023;font-weight:900}
  .title{display:flex;flex-direction:column;line-height:1.05}
  .title b{font-size:13.5px} .title span{font-size:12px;color:var(--muted)}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:650;font-size:12.5px}
  nav button.active{border-color:rgba(125,211,252,.6);background:rgba(125,211,252,.12)}
  .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .search{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 10px;border-radius:12px;min-width:min(420px,80vw);outline:none}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:650;font-size:12.5px}
  .btn.primary{border-color:rgba(125,211,252,.6);background:rgba(125,211,252,.14)}
  .btn.danger{border-color:rgba(255,107,107,.7);background:rgba(255,107,107,.12)}
  main{padding:0}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
  .card{grid-column:span 12;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:16px;overflow:hidden}
  .hd{padding:12px 12px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .hd h2{margin:0;font-size:14px} .hd p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .bd{padding:12px}
  .kpis{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
  .kpi{grid-column:span 3;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px;background:linear-gradient(135deg,rgba(125,211,252,.10),rgba(167,139,250,.08))}
  .kpi small{color:var(--muted)} .kpi b{display:block;font-size:20px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}
  th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
  th{text-align:left;color:var(--muted);font-size:11.5px;letter-spacing:.2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:sticky;top:0;background:rgba(11,18,32,.96)}
  tr:hover td{background:rgba(255,255,255,.02)}
  .wrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:14px}
  .tag{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-size:11px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tag.ok{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12)}
  .tag.bad{border-color:rgba(255,107,107,.7);background:rgba(255,107,107,.12)}
  .tag.warn{border-color:rgba(251,191,36,.7);background:rgba(251,191,36,.12)}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  dialog{border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(11,18,32,.96);color:var(--text);width:min(900px,calc(100vw - 24px))}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  form.grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
  .f6{grid-column:span 6} .f4{grid-column:span 4} .f3{grid-column:span 3} .f12{grid-column:span 12}
  label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  input,select,textarea{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.02);color:var(--text);padding:9px 10px;border-radius:12px;outline:none}
  textarea{min-height:86px;resize:vertical}
  .dlgHd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .dlgHd b{font-size:14px} .dlgHd span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  .dlgBd{padding:12px;max-height:65vh;overflow:auto}
  .dlgFt{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .toast{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;z-index:20}
  .toast .t{border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(11,18,32,.96);padding:10px 12px;width:min(420px,calc(100vw - 24px))}
  .t.ok{border-color:rgba(52,211,153,.6)} .t.bad{border-color:rgba(255,107,107,.7)} .t.warn{border-color:rgba(251,191,36,.7)}
  @media (max-width:900px){ .kpi{grid-column:span 6} table{min-width:720px} .search{min-width:min(300px,86vw)} }
  @media (max-width:520px){ .kpi{grid-column:span 12} .f6,.f4,.f3{grid-column:span 12} nav{gap:6px} }


/* =========================================================
   TEMA PROFESIONAL — VERDE & BLANCO (override total)
   Insertado al final para dominar estilos anteriores.
   ========================================================= */
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --panel2:#f2fbf5;
  --text:#0b1220;                 /* casi negro para legibilidad */
  --muted:#4b5563;
  --accent:#16a34a;               /* verde principal */
  --accent2:#065f46;              /* verde profundo */
  --danger:#b91c1c;               /* rojo sutil SOLO para eliminar/acciones críticas */
  --ok:#16a34a;
  --warn:#0f766e;
  --line:rgba(15,23,42,.12);
  --shadow: 0 10px 28px rgba(2,6,23,.10);
}

/* Fondo general */
body{
  background:
    radial-gradient(1000px 620px at 6% -10%, rgba(34,197,94,.18), transparent 55%),
    radial-gradient(900px 520px at 95% 0%, rgba(6,95,70,.12), transparent 55%),
    linear-gradient(180deg, #ffffff, #f4fbf6);
  color: var(--text);
}

/* Sidebar */
.sidebar{
  background: rgba(255,255,255,.78) !important;
  border-right: 1px solid var(--line) !important;
}
.brand{
  background: rgba(255,255,255,.96) !important;
  border-color: var(--line) !important;
}
.logo{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  color:#ffffff !important;
}
.footer-mini{
  border-top: 1px dashed rgba(15,23,42,.14) !important;
}
.footer-mini .chip{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  color: rgba(15,23,42,.75) !important;
}

/* Navegación */
.nav button{
  background: rgba(255,255,255,.80) !important;
  border-color: var(--line) !important;
  color: var(--text) !important;
}
.nav button:hover{
  background: rgba(34,197,94,.08) !important;
  border-color: rgba(34,197,94,.40) !important;
}
.nav button.active{
  background: linear-gradient(135deg, rgba(34,197,94,.22), rgba(6,95,70,.10)) !important;
  border-color: rgba(34,197,94,.55) !important;
}

/* Buscador y paneles */
.search{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  box-shadow: var(--shadow) !important;
}
.search input{ color: var(--text) !important; }

/* Tarjetas */
.card{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  box-shadow: var(--shadow) !important;
}
.card .hd{
  border-bottom: 1px solid rgba(15,23,42,.06) !important;
  background: linear-gradient(180deg, rgba(34,197,94,.06), rgba(255,255,255,0)) !important;
}

/* KPI */
.kpi{
  border-color: rgba(15,23,42,.10) !important;
  background: linear-gradient(135deg, rgba(34,197,94,.16), rgba(6,95,70,.06)) !important;
}
.kpi:before{
  background: radial-gradient(circle at 30% 30%, rgba(34,197,94,.18), transparent 65%) !important;
  opacity:.95 !important;
}

/* Botones */
.btn{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  color: var(--text) !important;
}
.btn:hover{
  background: rgba(34,197,94,.08) !important;
  border-color: rgba(34,197,94,.40) !important;
}
.btn.primary{
  background: linear-gradient(135deg, rgba(34,197,94,.24), rgba(6,95,70,.10)) !important;
  border-color: rgba(34,197,94,.60) !important;
}
.btn.ok{
  background: rgba(34,197,94,.12) !important;
  border-color: rgba(34,197,94,.48) !important;
}
.btn.danger{
  background: rgba(185,28,28,.08) !important;
  border-color: rgba(185,28,28,.32) !important;
}

/* Inputs */
input, select, textarea{
  background: rgba(255,255,255,.98) !important;
  border-color: rgba(15,23,42,.16) !important;
  color: var(--text) !important;
}
input:focus, select:focus, textarea:focus{
  border-color: rgba(34,197,94,.60) !important;
  box-shadow: 0 0 0 3px rgba(34,197,94,.18) !important;
}

/* Pills y tags */
.pill{
  border-color: rgba(34,197,94,.28) !important;
  background: rgba(34,197,94,.08) !important;
  color: rgba(6,95,70,.92) !important;
}
.tag{
  border-color: rgba(15,23,42,.12) !important;
  background: rgba(255,255,255,.84) !important;
  color: rgba(15,23,42,.86) !important;
}
.tag.ok{
  border-color: rgba(34,197,94,.42) !important;
  background: rgba(34,197,94,.12) !important;
}
.tag.warn{
  border-color: rgba(6,95,70,.40) !important;
  background: rgba(6,95,70,.10) !important;
}
.tag.info{
  border-color: rgba(34,197,94,.30) !important;
  background: rgba(34,197,94,.08) !important;
}
/* "bad" debe seguir siendo visible (ventas pendientes, etc.) */
.tag.bad{
  border-color: rgba(185,28,28,.42) !important;
  background: rgba(185,28,28,.10) !important;
}

/* Tablas */
.tablewrap{
  border-color: rgba(15,23,42,.10) !important;
}
th{
  background: rgba(248,250,249,.98) !important;
  color: rgba(15,23,42,.62) !important;
  border-bottom-color: rgba(15,23,42,.06) !important;
}
td{
  border-bottom-color: rgba(15,23,42,.06) !important;
}
tr:hover td{
  background: rgba(34,197,94,.05) !important;
}

/* Modal & Toast */
.modal{
  background: rgba(255,255,255,.97) !important;
  border-color: rgba(15,23,42,.14) !important;
}
.modal .mh{
  border-bottom: 1px solid rgba(15,23,42,.08) !important;
}
.modal .mf{
  border-top: 1px solid rgba(15,23,42,.08) !important;
}
.x{
  background: rgba(255,255,255,.92) !important;
  border-color: rgba(15,23,42,.14) !important;
  color: rgba(15,23,42,.90) !important;
}
.x:hover{ border-color: rgba(34,197,94,.50) !important; }

.toast .t{
  background: rgba(255,255,255,.96) !important;
  border-color: rgba(15,23,42,.14) !important;
}
.toast .t.ok{ border-color: rgba(34,197,94,.50) !important; }
.toast .t.warn{ border-color: rgba(6,95,70,.40) !important; }
.toast .t.bad{ border-color: rgba(185,28,28,.50) !important; }

/* Asegura textos "muted" */
.muted{ color: var(--muted) !important; }



/* =========================================================
   PATCH: Verde & Blanco 100% (todo combina)
   - Elimina rojos/azules residuales
   - Backdrops y estados "bad/danger" también en verde
   ========================================================= */
:root{
  --accent:#16a34a !important;
  --accent2:#065f46 !important;
  --danger: var(--accent2) !important; /* ahora todo en verde */
  --ok: var(--accent) !important;
  --warn: var(--accent2) !important;
}

/* Overlay del modal en verde (no negro) */
.modal-backdrop{
  background: rgba(6,95,70,.38) !important;
}

/* Todo lo "danger/bad" pasa a verde */
.btn.danger{
  background: rgba(6,95,70,.12) !important;
  border-color: rgba(6,95,70,.45) !important;
  color: var(--text) !important;
}
.btn.danger:hover{
  background: rgba(6,95,70,.16) !important;
  border-color: rgba(6,95,70,.55) !important;
}

.tag.bad{
  border-color: rgba(6,95,70,.45) !important;
  background: rgba(6,95,70,.12) !important;
  color: rgba(15,23,42,.86) !important;
}
.toast .t.bad{
  border-color: rgba(6,95,70,.55) !important;
}

/* Asegura que cualquier borde "line" use el mismo tono */
.card, .brand, .search, .tablewrap, .nav button, .btn, input, select, textarea,
.footer-mini .chip, .x, .modal, .toast .t{
  border-color: var(--line) !important;
}

/* Asegura que fondos de paneles/quebres sean blancos */
.sidebar, .brand, .search, .card, .btn, .pill, .tag, input, select, textarea,
.modal, .toast .t{
  background-clip: padding-box !important;
}

/* Estados visuales coherentes */
.nav button:hover,
.btn:hover{
  box-shadow: 0 10px 26px rgba(2,6,23,.08) !important;
}

/* Mantén texto siempre oscuro (evita restos claros) */
*{ color-scheme: light; }



/* =========================================================
   PATCH v3 — Verde & Blanco (Header + Dialog + Variables)
   Corrige: barra superior oscura, botones del nav, modal oscuro
   ========================================================= */
:root{
  /* Variables usadas por el CSS original */
  --acc: var(--accent) !important;     /* antes azul */
  --bad: var(--accent2) !important;    /* antes rojo */
  --bg:#ffffff !important;
  --panel:#ffffff !important;
  --text:#0b1220 !important;
  --muted:#475569 !important;
  --line:rgba(15,23,42,.12) !important;
}

/* Barra superior (antes oscura) */
header{
  background: rgba(255,255,255,.86) !important;
  border-bottom: 1px solid var(--line) !important;
  box-shadow: 0 10px 26px rgba(2,6,23,.08) !important;
  backdrop-filter: blur(12px) saturate(1.1) !important;
}

/* Navegación superior (nav sin clase) */
header nav button{
  background: rgba(255,255,255,.92) !important;
  border: 1px solid var(--line) !important;
  color: var(--text) !important;
}
header nav button:hover{
  background: rgba(34,197,94,.10) !important;
  border-color: rgba(34,197,94,.40) !important;
}
header nav button.active{
  background: rgba(34,197,94,.14) !important;
  border-color: rgba(34,197,94,.55) !important;
}

/* Input de búsqueda (en header) */
input.search{
  background: rgba(255,255,255,.96) !important;
  border: 1px solid var(--line) !important;
  color: var(--text) !important;
}
input.search::placeholder{ color: rgba(15,23,42,.55) !important; }
input.search:focus{
  border-color: rgba(34,197,94,.60) !important;
  box-shadow: 0 0 0 3px rgba(34,197,94,.18) !important;
}

/* Botón principal más "pro": verde sólido */
.btn.primary{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  border-color: rgba(6,95,70,.65) !important;
  color: #ffffff !important;
}
.btn.primary:hover{
  filter: brightness(1.02) !important;
}

/* Dialog (modal nativo) — antes oscuro */
dialog{
  background: rgba(255,255,255,.98) !important;
  border: 1px solid rgba(15,23,42,.14) !important;
  box-shadow: 0 18px 45px rgba(2,6,23,.18) !important;
}
dialog::backdrop{
  background: rgba(6,95,70,.34) !important;
}

.dlgHd{
  border-bottom: 1px solid rgba(15,23,42,.08) !important;
  background: linear-gradient(180deg, rgba(34,197,94,.06), rgba(255,255,255,0)) !important;
}
.dlgFt{
  border-top: 1px solid rgba(15,23,42,.08) !important;
}



/* =========================================================
   PATCH v4 — Header Verde bonito (con contraste)
   ========================================================= */
header{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  border-bottom: 1px solid rgba(255,255,255,.18) !important;
  box-shadow: 0 14px 36px rgba(2,6,23,.18) !important;
  backdrop-filter: blur(10px) saturate(1.2) !important;
}

/* Texto en header */
header, header *{
  color: #ffffff !important;
}

/* Textos secundarios */
header .muted, header small, header .sub, header .subtitle, header .meta{
  color: rgba(255,255,255,.82) !important;
}

/* Logo dentro del header (si existe) */
header .logo{
  background: rgba(255,255,255,.95) !important;
  color: rgba(6,95,70,.98) !important;
  box-shadow: 0 10px 22px rgba(2,6,23,.14) !important;
}

/* Navegación superior */
header nav button{
  background: rgba(255,255,255,.14) !important;
  border: 1px solid rgba(255,255,255,.22) !important;
  color: #ffffff !important;
}
header nav button:hover{
  background: rgba(255,255,255,.22) !important;
  border-color: rgba(255,255,255,.30) !important;
}
header nav button.active{
  background: rgba(255,255,255,.26) !important;
  border-color: rgba(255,255,255,.36) !important;
  box-shadow: 0 10px 24px rgba(2,6,23,.14) !important;
}

/* Buscador del header */
input.search{
  background: rgba(255,255,255,.16) !important;
  border: 1px solid rgba(255,255,255,.28) !important;
  color: #ffffff !important;
}
input.search::placeholder{ color: rgba(255,255,255,.75) !important; }
input.search:focus{
  background: rgba(255,255,255,.20) !important;
  border-color: rgba(255,255,255,.38) !important;
  box-shadow: 0 0 0 3px rgba(255,255,255,.16) !important;
}

/* Botones en header (rápido/nueva venta) si usan .btn */
header .btn{
  background: rgba(255,255,255,.14) !important;
  border: 1px solid rgba(255,255,255,.22) !important;
  color: #ffffff !important;
}
header .btn:hover{
  background: rgba(255,255,255,.22) !important;
  border-color: rgba(255,255,255,.30) !important;
}

/* Para íconos/svg dentro del header */
header svg, header svg *{
  fill: currentColor !important;
  stroke: currentColor !important;
}



/* =========================================================
   PATCH v5 — Arreglo de Brand (logo + nombre) en header
   - Quita el bloque claro detrás del nombre
   - Alinea y mejora contraste/jerarquía
   ========================================================= */
header .brand{
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  gap: 12px !important;
  align-items: center !important;
}

/* Logo como "badge" blanco */
header .brand .logo{
  width: 38px !important;
  height: 38px !important;
  border-radius: 14px !important;
  background: rgba(255,255,255,.96) !important;
  color: rgba(6,95,70,.98) !important;
  border: 1px solid rgba(255,255,255,.32) !important;
  box-shadow: 0 10px 22px rgba(2,6,23,.14) !important;
}

/* Texto del nombre (bien visible) */
header .brand .title{
  display:flex !important;
  flex-direction: column !important;
  line-height: 1.08 !important;
}
header .brand .title b{
  font-size: 15px !important;
  font-weight: 900 !important;
  letter-spacing: .2px !important;
  text-shadow: 0 1px 0 rgba(2,6,23,.12) !important;
}
header .brand .title span{
  font-size: 12px !important;
  color: rgba(255,255,255,.85) !important;
}

/* Evita que el brand tome un ancho raro en pantallas grandes */
header .bar{
  align-items: center !important;
}
header .brand{
  max-width: 320px !important;
}
header .brand .title{
  max-width: 260px !important;
}
header .brand .title b,
header .brand .title span{
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

/* En pantallas pequeñas: permite que baje el texto sin romper */
@media (max-width: 520px){
  header .brand{
    max-width: 100% !important;
  }
  header .brand .title{
    max-width: 100% !important;
  }
  header .brand .title b,
  header .brand .title span{
    white-space: normal !important;
  }
}



/* =========================================================
   UX: tarjetas de ayuda, pasos y estados vacíos
   ========================================================= */
.helpCard{
  border:1px solid rgba(15,23,42,.12);
  background: linear-gradient(135deg, rgba(34,197,94,.10), rgba(255,255,255,.88));
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 12px 30px rgba(2,6,23,.08);
  margin: 10px 0 14px;
}
.helpHd{
  display:flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.helpHd b{ font-size: 14px; }
.helpHd .muted{ margin-top:4px; }
.steps{
  display:grid;
  gap:10px;
}
.step{
  display:flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border-radius: 14px;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(15,23,42,.10);
}
.step .left{ display:flex; gap:10px; align-items:flex-start; }
.step .ico{
  width: 26px; height: 26px;
  border-radius: 10px;
  display:grid; place-items:center;
  background: rgba(34,197,94,.14);
  border:1px solid rgba(34,197,94,.28);
  flex: 0 0 auto;
  font-size: 14px;
}
.step.done .ico{
  background: rgba(34,197,94,.20);
  border-color: rgba(34,197,94,.40);
}
.step .txt b{ display:block; font-size: 13px; }
.step .txt .muted{ font-size: 12px; }
.step .right{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

.emptyBig{
  padding: 16px;
  border-radius: 18px;
  border: 1px dashed rgba(15,23,42,.18);
  background: rgba(255,255,255,.78);
  margin-top: 10px;
}
.emptyBig b{ font-size: 14px; display:block; margin-bottom:4px; }
.emptyBig .muted{ font-size: 12.5px; }
.emptyBig .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
kbd{
  font-family: var(--mono);
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.12);
  color: #fff;
}



/* =========================================================
   PATCH v14 — Centrar modales (dialog) y mejorar scroll
   ========================================================= */
dialog, dialog#dlg{
  position: fixed !important;
  inset: 0 !important;
  margin: auto !important;                 /* <- centra (antes quedaba arriba/izq) */
  max-height: calc(100vh - 24px) !important;
  overflow: auto !important;
}

/* Asegura look consistente (por si algún rule quedó corrupto) */
dialog, dialog#dlg{
  background: rgba(255,255,255,.98) !important;
  border: 1px solid rgba(15,23,42,.14) !important;
  border-radius: 18px !important;
  box-shadow: 0 18px 45px rgba(2,6,23,.18) !important;
  color: var(--text) !important;
}

/* Backdrop más suave */
dialog::backdrop{
  background: rgba(6,95,70,.34) !important;
}

/* En móvil: usa casi toda la pantalla pero sigue centrado */
@media (max-width: 520px){
  dialog, dialog#dlg{
    width: calc(100vw - 18px) !important;
    max-height: calc(100vh - 18px) !important;
    border-radius: 16px !important;
  }
}



/* =========================================================
   PATCH v15 — Menú lateral (izquierda)
   ========================================================= */
.layout{
  display:flex;
  gap:14px;
  padding:14px;
  align-items:flex-start;
}
.sidebar{
  width:260px;
  flex:0 0 260px;
  position: sticky;
  top: 86px; /* debajo del header */
  height: calc(100vh - 100px);
  overflow:auto;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.85);
  box-shadow: 0 12px 30px rgba(2,6,23,.08);
}
.sideHead{
  padding: 12px 12px 8px;
  border-bottom: 1px solid rgba(15,23,42,.10);
}
.sideTitle{
  font-weight: 900;
  color: var(--text);
  letter-spacing: .2px;
  margin-bottom: 2px;
}
.sideNav{
  padding: 10px;
  display:flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar nav button{
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(15,23,42,.10);
  background: rgba(255,255,255,.92);
  color: var(--text);
  cursor:pointer;
  font-weight: 750;
}
.sidebar nav button:hover{
  border-color: rgba(34,197,94,.30);
  box-shadow: 0 10px 22px rgba(2,6,23,.08);
}
.sidebar nav button.active{
  border-color: rgba(34,197,94,.45);
  background: rgba(34,197,94,.12);
}
main.content{ padding: 0; min-width: 0; }

/* En pantallas pequeñas, el menú se vuelve una barra debajo del header */
@media (max-width: 900px){
  .layout{ flex-direction: column; }
  .sidebar{
    width: 100%;
    flex: 0 0 auto;
    position: static;
    height: auto;
  }
  .sideNav{
    flex-direction: row;
    flex-wrap: wrap;
  }
  .sidebar nav button{
    width: auto;
  }
}



/* =========================================================
   PATCH v19 — Diálogo pequeño para alertas encima de otros modales
   ========================================================= */
dialog.dlgMini{
  width: min(520px, calc(100vw - 24px)) !important;
}
dialog.dlgMini .dlgBd{
  padding-top: 12px !important;
}
dialog.dlgMini .dlgFt{
  display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;
}
dialog.dlgMini .alertBox{
  border:1px solid rgba(239,68,68,.25);
  background: rgba(239,68,68,.08);
  padding: 12px;
  border-radius: 14px;
}
dialog.dlgMini .alertBox.ok{
  border-color: rgba(34,197,94,.25);
  background: rgba(34,197,94,.10);
}


/* filas críticas (tareas vencidas) */
.rowBad{background: rgba(239,68,68,.06) !important;}

<script>
(() => {
  "use strict";
  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
  const KEY = "granja_porcina_v1_compact";
  
  const storage = (()=> {
    const testKey="__st";
    try{
      localStorage.setItem(testKey,"1");
      localStorage.removeItem(testKey);
      return Object.assign(localStorage,{_mode:"localStorage"});
    }catch(e1){
      try{
        sessionStorage.setItem(testKey,"1");
        sessionStorage.removeItem(testKey);
        return Object.assign(sessionStorage,{_mode:"sessionStorage"});
      }catch(e2){
        const mem={};
        return {
          _mode:"memory",
          getItem:(k)=> (k in mem ? mem[k] : null),
          setItem:(k,v)=>{ mem[k]=String(v); },
          removeItem:(k)=>{ delete mem[k]; },
          clear:()=>{ for(const k in mem) delete mem[k]; }
        };
      }
    }
  })();

const uid = (p="id") => p + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  const today = () => new Date().toISOString().slice(0,10);
  const num = (v) => {
    let s = String(v??"").trim();
    if(!s) return 0;
    s = s.replace(/[^0-9.,-]/g,"");
    s = s.replace(/(?!^)-/g,""); // solo un "-"
    // Patrones de miles: 1.234 o 1.234.567 / 1,234,567
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){
      s = s.replace(/\./g,"");
    } else if(/^-?\d{1,3}(,\d{3})+$/.test(s)){
      s = s.replace(/,/g,"");
    } else if(s.includes(".") && s.includes(",")){
      // "." miles y "," decimal
      s = s.replace(/\./g,"").replace(",",".");
    } else {
      const dots = (s.match(/\./g)||[]).length;
      const commas = (s.match(/,/g)||[]).length;
      if(dots>1 && commas===0) s = s.replace(/\./g,"");
      else if(commas>1 && dots===0) s = s.replace(/,/g,"");
      else if(commas===1 && dots===0) s = s.replace(",",".");
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  };
  const addDays = (iso, d) => { const x = new Date(iso+"T00:00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
  const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/(1000*60*60*24));
  const esc = (s) => String(s??"").replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
  const fmtCOP = (n) => { n=num(n); try { return n.toLocaleString("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}); } catch { return "COP "+Math.round(n).toString(); } };

  const fmtNum = (n, dec=0) => {
    n = num(n);
    if(!Number.isFinite(n)) n = 0;
    const sign = n<0 ? "-" : "";
    n = Math.abs(n);
    const p = Math.pow(10, Math.max(0, dec|0));
    const r = Math.round(n*p)/p;
    const i = Math.trunc(r);
    const frac = Math.round((r - i) * p);
    const intStr = i.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    if(dec<=0) return sign + intStr;
    if(frac<=0) return sign + intStr;
    const fracStr = frac.toString().padStart(dec, "0");
    return sign + intStr + "," + fracStr;
  };

  // Helper para KPIs reutilizables
  const kpi = (label, value, kindOrSub="", sub="") => {
    const kinds = ["ok","warn","bad","info"];
    const kind = kinds.includes(kindOrSub) ? kindOrSub : "";
    const subtitle = kind ? (sub||"") : (kindOrSub||sub||"");
    return `<div class="kpi${kind?(" "+kind):""}">
      <small>${esc(label)}</small>
      <b>${value}</b>
      <div class="muted mono">${esc(subtitle||"")}</div>
    </div>`;
  };



  // ------- Máscara de números (dinero y cantidades) con puntuación mientras escribes -------
  const numberFormatStr = (v, decimals=0) => {
    let s = String(v??"");
    if(!s) return "";
    s = s.replace(/[^\d.,]/g,"");
    if(!s) return "";
    let dec = "";
    if(decimals>0){
      const lastComma = s.lastIndexOf(",");
      const lastDot   = s.lastIndexOf(".");
      const lastSep   = Math.max(lastComma, lastDot);
      if(lastSep>-1){
        const after = s.slice(lastSep+1).replace(/[^\d]/g,"");
        const before = s.slice(0,lastSep);
        // Heurística: si después hay 1-2 dígitos => decimal; si hay 3 => miles
        if(after.length>0 && after.length<=decimals && after.length!==3){
          dec = after.slice(0, decimals);
          s = before;
        } else if(after.length>0 && after.length<3){
          dec = after.slice(0, decimals);
          s = before;
        } // else: tratar como miles
      }
    }
    const intDigits = s.replace(/[^\d]/g,"");
    const intFormatted = intDigits ? intDigits.replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";
    if(dec) return (intFormatted || "0") + "," + dec;
    return intFormatted;
  };

  // Compatibilidad: dinero = entero COP
  const moneyFormatStr = (v) => numberFormatStr(v, 0);

  const moneyKeys = new Set([
    "unitprice","unitcost","totalcost","paidamount","amount","total",
    "invtotal","payamount","cxpamount","invunit","invpaidnow","price","cost","valor","monto"
  ]);
  const qtyHints = ["qty","cantidad","count","stock","units","unidades","born","deaths","alive","current","peso","weight","litters"];

  const getMaskInfo = (el) => {
    if(!el || el.tagName!=="INPUT") return null;
    const t = (el.getAttribute("type")||"").toLowerCase();
    if(t==="range" || t==="date" || t==="checkbox" || t==="radio" || t==="color") return null;

    const name = (el.name||"").toLowerCase();
    const id = (el.id||"").toLowerCase();

    // Prioridad: dinero
    const isMoney = moneyKeys.has(name) || moneyKeys.has(id) || el.dataset.money==="1";
    // Cantidades: inputs numéricos o que contengan pistas
    const isQty = (!isMoney) && (el.dataset.qty==="1" || t==="number" || qtyHints.some(h=>name.includes(h)||id.includes(h)));

    if(!isMoney && !isQty) return null;

    // Decimales para cantidades solo si el step lo sugiere (ej: 0.1, 0.01)
    let decimals = 0;
    if(isQty){
      const step = (el.getAttribute("step")||"").toString();
      if(step.includes(".") && step !== "1"){
        decimals = Math.min(4, (step.split(".")[1]||"").length);
      } else if(step.includes(",") && step !== "1"){
        decimals = Math.min(4, (step.split(",")[1]||"").length);
      }
    }
    return {kind: isMoney ? "money" : "qty", decimals};
  };

  const setMoney = (el, n) => { if(el) el.value = moneyFormatStr(Math.max(0, Math.round(num(n)))); };
  const setQty   = (el, n) => { if(el) el.value = numberFormatStr(num(n), 0); };

  function bindMoneyInputs(root=document){
    const scope = root?.querySelectorAll ? root : document;
    scope.querySelectorAll("input").forEach(el=>{
      const info = getMaskInfo(el);
      if(!info) return;

      // Evita duplicar listeners
      if(el.dataset.moneyBound==="1"){
        el.value = info.kind==="money" ? moneyFormatStr(el.value) : numberFormatStr(el.value, info.decimals);
        return;
      }
      el.dataset.moneyBound="1";

      // Cambia a texto para permitir puntos
      try { el.type = "text"; } catch {}
      el.inputMode = "numeric";
      el.autocomplete = "off";
      el.spellcheck = false;

      // Formatea inicial
      el.value = info.kind==="money" ? moneyFormatStr(el.value) : numberFormatStr(el.value, info.decimals);

      el.addEventListener("input", ()=>{
        el.value = info.kind==="money" ? moneyFormatStr(el.value) : numberFormatStr(el.value, info.decimals);
        // caret al final (simple y estable)
        try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
      });

      el.addEventListener("blur", ()=>{
        el.value = info.kind==="money" ? moneyFormatStr(el.value) : numberFormatStr(el.value, info.decimals);
      });
    });
  }



  // ------- Costeo / inversión por cerda y por camada -------
  const moveCost = (m) => {
    const it = get.inv(m.itemId);
    const uc = num(m.unitCost) || num(it?.unitCost) || 0;
    const q = Math.abs(num(m.qty));
    return q * uc;
  };
  const invested = {
    sow: (sowId) => (state.stockMovements||[])
      .filter(m=>m.type==="salida" && m.linkedType==="sow" && m.linkedId===sowId)
      .reduce((s,m)=>s+moveCost(m),0),
    batch: (batchId) => (state.stockMovements||[])
      .filter(m=>m.type==="salida" && m.linkedType==="batch" && m.linkedId===batchId)
      .reduce((s,m)=>s+moveCost(m),0),
    list: (type, id, limit=8) => (state.stockMovements||[])
      .filter(m=>m.type==="salida" && m.linkedType===type && m.linkedId===id)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      .slice(0, limit)
  };

  // ------- Utilidad / ganancias (lechones) -------
  function profitStatsForBatch(batchId){
    const sales = (state.sales||[]).filter(s=>s.batchId===batchId);
    const qtySold = sales.reduce((a,s)=>a+Math.max(0,num(s.qty)),0);
    const sold = sales.reduce((a,s)=>a+Math.max(0,num(s.total)),0);
    const collected = sales.reduce((a,s)=>a+Math.max(0,num(s.paidAmount)),0);
    const pending = Math.max(0, sold - collected);
    const cost = Math.max(0, invested.batch(batchId));
    const profitEst = sold - cost;
    return {sales, qtySold, sold, collected, pending, cost, profitEst};
  }

  function profitStatsForSow(sowId){
    const batches = (state.batches||[]).filter(b=>b.sowId===sowId);
    const per = batches
      .map(b=>{
        const st = profitStatsForBatch(b.id);
        return {
          batch: b,
          qtySold: st.qtySold,
          sold: st.sold,
          collected: st.collected,
          pending: st.pending,
          cost: st.cost,
          profitEst: st.sold - st.cost
        };
      })
      .sort((a,b)=>(b.batch.birthDate||"").localeCompare(a.batch.birthDate||""));

    const qtySold = per.reduce((a,x)=>a+x.qtySold,0);
    const sold = per.reduce((a,x)=>a+x.sold,0);
    const collected = per.reduce((a,x)=>a+x.collected,0);
    const pending = Math.max(0, sold - collected);

    const costS = Math.max(0, invested.sow(sowId));
    const costB = per.reduce((a,x)=>a+x.cost,0);
    const profitEst = sold - (costS + costB);

    return {per, qtySold, sold, collected, pending, costS, costB, profitEst};
  }



    function supplyHistoryHTML(type, id, limit=60){
    const title = type==="sow" ? "Historial de suministros (cerda)" : "Historial de suministros (camada)";
    const total = type==="sow" ? invested.sow(id) : invested.batch(id);

        <td class="mono">${esc(q)} ${esc(it?.unit||"")}</td>

            <span class="tag info">Total: <span class="mono">${fmtCOP(total)}</span></span>
            <button class="btn primary" type="button" data-supply="${type}" data-supplyid="${id}">➖ Registrar suministro</button>

          </table></div>
          ${note}
        </div>
      </div>
    `;
  }

  // ------- Ganancias / utilidad por camada y por cerda -------
  function salesStatsForBatch(batchId){
    const sales = (state.sales||[]).filter(s=>s.batchId===batchId);
    const sold = sales.reduce((sum,s)=>sum+num(s.total),0);
    const collected = sales.reduce((sum,s)=>sum+num(s.paidAmount),0);
    const pending = Math.max(0, sold - collected);
    const qtySold = sales.reduce((sum,s)=>sum+num(s.qty),0);
    return {sales, sold, collected, pending, qtySold};



  }

  function profitHistoryHTML(type, id){
    if(type==="batch"){
      const b = get.batch(id); if(!b) return "";
      const st = profitStatsForBatch(id);
      const profitTag = st.profitEst>=0 ? `<span class="tag ok">Utilidad: <span class="mono">${fmtCOP(st.profitEst)}</span></span>`

      return `

              ${profitTag}
              <span class="tag info">Inversión: <span class="mono">${fmtCOP(st.cost)}</span></span>
            </div>
          </div>
          <div class="bd">
            <div class="kpis">
              <div class="kpi"><small>Lechones vendidos</small><b class="mono">${esc(st.qtySold||0)}</b></div>
              <div class="kpi"><small>Total vendido</small><b class="mono">${fmtCOP(st.sold)}</b></div>
              <div class="kpi"><small>Cobrado</small><b class="mono">${fmtCOP(st.collected)}</b></div>
              <div class="kpi"><small>Pendiente</small><b class="mono">${fmtCOP(st.pending)}</b></div>
            </div>
            <div class="wrap"><table>
              <thead><tr><th>Fecha</th><th>Cliente</th><th>Cant.</th><th>Total</th><th>Cobrado</th><th>Pendiente</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="6" class="muted">Aún no hay ventas registradas para esta camada.</td></tr>`}</tbody>
            </table></div>
            <div class="emptyBig">
              <b>Utilidad estimada</b>
              <div class="muted">Total vendido − inversión de insumos (salidas relacionadas a la camada).</div>
              <div style="margin-top:6px"><b class="mono">${fmtCOP(st.profitEst)}</b></div>
            </div>
          </div>
        </div>
      `;
    }

    // type==="sow"
    const s = get.sow(id); if(!s) return "";
    const st = profitStatsForSow(id);
    const profitTag = st.profitEst>=0 ? `<span class="tag ok">Utilidad: <span class="mono">${fmtCOP(st.profitEst)}</span></span>`
                                      : `<span class="tag bad">Pérdida: <span class="mono">${fmtCOP(st.profitEst)}</span></span>`;
    const rows = st.per.slice(0,30).map(x=>{
      const b=x.batch;
      const tag = (x.profitEst>=0) ? `<span class="tag ok">+${fmtCOP(x.profitEst)}</span>` : `<span class="tag bad">${fmtCOP(x.profitEst)}</span>`;
      return `<tr>
        <td class="mono">${esc(b.birthDate||"—")}</td>
        <td><b>${esc(b.code||("Lote "+b.id.slice(-6)))}</b><div class="muted">Disponibles: ${esc(b.countCurrent||0)}</div></td>
        <td class="mono">${esc(x.qtySold||0)}</td>
        <td class="mono">${esc(fmtCOP(x.sold))}</td>
        <td class="mono">${esc(fmtCOP(x.collected))}</td>
        <td class="mono">${esc(fmtCOP(x.pending))}</td>
        <td class="mono">${esc(fmtCOP(x.cost))}</td>
        <td>${tag}</td>
        <td><button class="btn" data-act="viewBatch" data-id="${b.id}">Ver</button></td>
      </tr>`;
    }).join("");

    return `
      <div class="card">
        <div class="hd">
          <div><h2>Ganancias por camadas</h2><p>Lo que produce esta cerda</p></div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            ${profitTag}
            <span class="tag info">Inv. cerda: <span class="mono">${fmtCOP(st.costS)}</span></span>
            <span class="tag info">Inv. camadas: <span class="mono">${fmtCOP(st.costB)}</span></span>
          </div>
        </div>
        <div class="bd">
          <div class="kpis">
            <div class="kpi"><small>Lechones vendidos</small><b class="mono">${esc(st.qtySold||0)}</b></div>
            <div class="kpi"><small>Total vendido</small><b class="mono">${fmtCOP(st.sold)}</b></div>
            <div class="kpi"><small>Cobrado</small><b class="mono">${fmtCOP(st.collected)}</b></div>
            <div class="kpi"><small>Pendiente</small><b class="mono">${fmtCOP(st.pending)}</b></div>

          <div class="wrap"><table>
            <thead><tr><th>Nacimiento</th><th>Camada</th><th>Vend.</th><th>Total</th><th>Cobrado</th><th>Pend.</th><th>Inv.</th><th>Utilidad</th><th></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="9" class="muted">Aún no hay camadas o ventas para esta cerda.</td></tr>`}</tbody>
          </table></div>

          <div class="emptyBig">

          </div>
        </div>
      </div>
    `;
  }

const defaults = () => ({
    settings:{farmName:"Granja Porcina",currency:"COP",gestationDays:114,serviceMethods:["inseminación","monta","otro"],requireLogin:true,authUser:"admin",authPass:"1234"},
    sows:[], breedings:[], farrowings:[], batches:[],
    inventory:[], stockMovements:[],
    clients:[], sales:[], payments:[],
    meat:{stockKg:0,headsForSale:0,movements:[]}, meatSales:[], meatPayments:[],
    transactions:[], payables:[], tasks:[]
  });

  let state = load();

  // ------- Login / Auth (universal) -------
  const AUTH_KEY = KEY + "_session";
  const authStore = (()=> {
    const testKey="__as";
    try{
      sessionStorage.setItem(testKey,"1");
      sessionStorage.removeItem(testKey);
      return Object.assign(sessionStorage,{_mode:"sessionStorage"});
    }catch(e){
      return Object.assign(storage,{_mode:storage._mode||"storage"});
    }
  })();
  const isAuthed = ()=>{ try{ return authStore.getItem(AUTH_KEY)==="1"; }catch{ return false; } };
  const setAuthed = (v)=>{ try{ v?authStore.setItem(AUTH_KEY,"1"):authStore.removeItem(AUTH_KEY);}catch{} };
  const clearAuthed = ()=>{ try{ authStore.removeItem(AUTH_KEY);}catch{} };

  function requireAuth(){ return state.settings.requireLogin!==false; }

  function showLogin(){
    const ls=$("#loginScreen"); const root=$("#appRoot");
    if(ls){
      ls.classList.remove("is-hidden");
      ls.setAttribute("aria-hidden","false");
      try{ ls.removeAttribute("inert"); }catch(e){}
    }
    if(root) root.style.display="none";
    const u=$("#loginUser"); const p=$("#loginPass");
    if(u) u.value=(state.settings.authUser||"admin");
    if(p) p.value="";
    // Título/ícono del login (toma el nombre de la granja)
    try{
      const name = (state && state.settings && state.settings.farmName) ? String(state.settings.farmName) : "Sistema";
      const t = $("#loginAppName"); if(t) t.textContent = name;
      const ic = $("#loginIcon");
      if(ic){
        const parts = name.trim().split(/\s+/).filter(Boolean).slice(0,2);
        const initials = parts.map(p=>p[0].toUpperCase()).join("") || "GP";
        ic.textContent = initials;
      }
    }catch(e){}

    setTimeout(()=>{ try{ (p||u).focus(); }catch{} }, 60);
    const lo=$("#logoutBtn"); if(lo) lo.style.display="none";
  }
  function showApp(){
    const ls=$("#loginScreen"); const root=$("#appRoot");
    const u=$("#loginUser"); const p=$("#loginPass");
    try{ u && u.blur && u.blur(); }catch(e){}
    try{ p && p.blur && p.blur(); }catch(e){}
    if(ls){
      ls.classList.add("is-hidden");
      ls.setAttribute("aria-hidden","true");
      try{ ls.setAttribute("inert",""); }catch(e){}
    }
    if(root) root.style.display="block";
    const q=$("#q");
    setTimeout(()=>{ try{ q && q.focus && q.focus(); }catch(e){} }, 60);
    const lo=$("#logoutBtn"); if(lo) lo.style.display=requireAuth()?"inline-flex":"none";
  }
  function enforceAuth(){
    if(requireAuth() && !isAuthed()) showLogin();
    else showApp();
  }
  function attemptLogin(){
    const uEl=$("#loginUser");
    const pEl=$("#loginPass");
    const u=((uEl && uEl.value)||"").toString().trim();
    const p=((pEl && pEl.value)||"").toString();
    const su=(state.settings.authUser||"admin").toString();
    const sp=(state.settings.authPass||"1234").toString();

  // ------- Auditoría / normalización del estado (evita errores) -------
  
  // ------- Migración (compatibilidad con versiones anteriores) -------
  function migrateLegacy(){
    // batches / camadas
    (state.batches||[]).forEach(b=>{
      if(b.birthDate==null && b.date!=null) b.birthDate = b.date;
      if(b.countInitial==null){
        if(b.countBornAlive!=null) b.countInitial = num(b.countBornAlive);
        else if(b.bornAlive!=null) b.countInitial = num(b.bornAlive);
        else if(b.alive!=null) b.countInitial = num(b.alive);
      }
      if(b.countCurrent==null){
        if(b.countInitial!=null) b.countCurrent = num(b.countInitial);
      }
      if(b.status==null || b.status===""){
        b.status = num(b.countCurrent)>0 ? "disponible" : "cerrado";
      }
    });

    // farrowings / partos
    (state.farrowings||[]).forEach(f=>{
      if(f.date==null && f.farrowingDate!=null) f.date = f.farrowingDate;
      if(f.bornAlive==null && f.bornTotal!=null){
        f.bornAlive = Math.max(0, num(f.bornTotal) - num(f.stillborn||0));
      }
    });

    // inventory
    (state.inventory||[]).forEach(i=>{
      if(i.unitCost==null && i.costUnit!=null) i.unitCost = num(i.costUnit);
      if(i.minQty==null && i.min!=null) i.minQty = num(i.min);
    });

    // sales
    (state.sales||[]).forEach(s=>{
      if(s.unitPrice==null && s.price!=null) s.unitPrice = num(s.price);
      if(s.paidAmount==null && s.paid!=null) s.paidAmount = num(s.paid);
      if(s.status==null || s.status===""){
        const total=num(s.total);
        const paid=num(s.paidAmount);
        const pending=Math.max(0,total-paid);
        s.status = pending<=0 ? "pagado" : (paid>0 ? "parcial" : "credito");
      }
    });
  }

function normalizeState(){
    migrateLegacy();
    state.sows = state.sows || [];
    state.breedings = state.breedings || [];
    state.farrowings = state.farrowings || [];
    state.batches = state.batches || [];
    state.inventory = state.inventory || [];
    state.stockMovements = state.stockMovements || [];
    state.clients = state.clients || [];
    state.sales = state.sales || [];
    state.payments = state.payments || [];
    state.meat = state.meat || {stockKg:0,headsForSale:0,movements:[]};
    state.meatSales = state.meatSales || [];
    state.meatPayments = state.meatPayments || [];
    state.transactions = state.transactions || [];
    state.payables = state.payables || [];
    state.tasks = state.tasks || [];
    state.settings = state.settings || defaults().settings;
    state.settings.serviceMethods = state.settings.serviceMethods || ["inseminación","monta","otro"];
  }

  function auditState(){
    normalizeState();

    // Reconciliar abonos: sale.paidAmount = suma de payments (si existen)
    const paySumBySale = new Map();
    (state.payments||[]).forEach(p=>{
      const sid = (p.saleId||"").toString();
      if(!sid) return;
      const a = num(p.amount);
      paySumBySale.set(sid, (paySumBySale.get(sid)||0) + a);
    });

    const hasGet = (typeof get !== "undefined");
    // Ajustes / métodos de servicio
    state.settings = state.settings || defaults().settings;
    const baseMethods = ["inseminación","monta","otro"];
    state.settings.serviceMethods = (state.settings.serviceMethods || baseMethods)
      .map(x=>String(x??"").trim()).filter(Boolean);
    // asegurar base y evitar duplicados (case-insensitive)
    const uniq=[];
    [...state.settings.serviceMethods, ...baseMethods].forEach(x=>{
      const k=x.toLowerCase();
      if(!uniq.some(u=>u.toLowerCase()===k)) uniq.push(x);
    });
    state.settings.serviceMethods = uniq;


    state.inventory.forEach(i=>{
      i.qty = Math.max(0, num(i.qty));
      i.minQty = Math.max(0, num(i.minQty));
      i.unitCost = Math.max(0, num(i.unitCost));
    });

    state.batches.forEach(b=>{
      // Compatibilidad: algunas versiones usan countInitial, otras countBornAlive
      const born = (b.countInitial!=null ? b.countInitial : b.countBornAlive);
      b.countInitial = Math.max(0, num(born));
      b.countBornAlive = b.countInitial; // alias interno
      b.countCurrent = Math.max(0, num(b.countCurrent));
      if(b.countCurrent > b.countInitial) b.countCurrent = b.countInitial;

      // Estado: no forzar "cerrado" por defecto si falta información
      if(!b.status) b.status = "disponible";
      // Auto-cerrar solo cuando hay cantidad inicial registrada y ya no queda stock
      if(b.countInitial>0 && b.countCurrent<=0 && (b.status==="disponible" || !b.status)) b.status = "cerrado";
    });

    state.sales.forEach(s=>{
      s.qty = Math.max(0, num(s.qty));
      s.unitPrice = Math.max(0, num(s.unitPrice));
      s.total = Math.max(0, num(s.total) || (s.qty*s.unitPrice));
      s.paidAmount = Math.max(0, Math.min(s.total, num(s.paidAmount)));
      if(!s.status) s.status = (s.paidAmount>=s.total ? "pagado" : (s.paidAmount>0 ? "parcial" : "credito"));
      if(!s.sowId && s.batchId && hasGet){
        const b=get.batch(s.batchId);
        if(b?.sowId) s.sowId = b.sowId;
      }

      // Reconciliar con historial de pagos (si hay registros)
      if(paySumBySale.has(s.id)){
        const ps = paySumBySale.get(s.id)||0;
        s.paidAmount = Math.min(num(s.total), Math.max(0, ps));
      }
      const pending2 = Math.max(0, num(s.total) - num(s.paidAmount));
      s.status = pending2<=0 ? "pagado" : (num(s.paidAmount)>0 ? "parcial" : "credito");
    });

    (state.payables||[]).forEach(p=>{
      p.total = Math.max(0, num(p.total));
      p.paid = Math.max(0, Math.min(p.total, num(p.paid)));
      if(p.paid >= p.total - 0.0001) p.status = "cerrado";
      if(!p.status) p.status = (p.paid >= p.total - 0.0001) ? "cerrado" : "abierto";
    });

    state.tasks.forEach(t=>{
      if(t.done===undefined) t.done = false;
      if(!t.priority) t.priority = "media";
    });

    state.stockMovements.forEach(m=>{
      m.qty = Math.max(0, num(m.qty));
      if((m.unitCost===undefined || m.unitCost===null) && hasGet){
        const it=get.inv(m.itemId);
        m.unitCost = num(it?.unitCost) || 0;
      }else{
        m.unitCost = Math.max(0, num(m.unitCost));
      }
    });

    // Carne / ventas por kilos
    state.meat = state.meat || {stockKg:0,headsForSale:0,movements:[]};
    state.meat.stockKg = Math.max(0, num(state.meat.stockKg));
    state.meat.headsForSale = Math.max(0, num(state.meat.headsForSale));
    state.meat.movements = state.meat.movements || [];

    state.meatSales = state.meatSales || [];
    state.meatPayments = state.meatPayments || [];

    state.meatSales.forEach(s=>{
      s.qty = Math.max(0, num(s.qty)); // kg
      s.unitPrice = Math.max(0, num(s.unitPrice)); // COP/kg
      s.total = Math.max(0, num(s.total) || (s.qty*s.unitPrice));
      s.paidAmount = Math.max(0, Math.min(s.total, num(s.paidAmount)));
      if(!s.status) s.status = (s.paidAmount>=s.total ? "pagado" : (s.paidAmount>0 ? "parcial" : "credito"));
    });

  }

  function getWarnings(){
    normalizeState();
    const list=[];
    const todayS=today();

    const tags=state.sows.map(s=>(s.tag||"").trim()).filter(Boolean);
    const dup=[...new Set(tags.filter((t,i)=>tags.indexOf(t)!==i))];
    if(dup.length){
      list.push({level:"bad", title:"Tags duplicados", detail:`Corrige: ${dup.slice(0,6).join(", ")}${dup.length>6?"…":""}`, tab:"sows"});
    }

    const low = state.inventory.filter(i=>num(i.qty) <= num(i.minQty) && (i.name||"").trim());
    if(low.length){
      list.push({level:"warn", title:"Stock bajo", detail:`${low.length} insumo(s) por debajo del mínimo.`, tab:"inv"});
    }

    const expSoon = state.inventory
      .filter(i=>i.expiration)
      .map(i=>({i, d: daysBetween(todayS, i.expiration)}))
      .filter(x=>x.d!==null && x.d>=0 && x.d<=30);
    if(expSoon.length){
      list.push({level:"warn", title:"Vencimientos próximos", detail:`${expSoon.length} insumo(s) vencen en ≤ 30 días.`, tab:"inv"});
    }

    const pending = state.tasks.filter(t=>!t.done && t.dueDate);
    const overdue = pending.filter(t=>daysBetween(t.dueDate, todayS)>0);
    const dueSoon = pending.filter(t=>{ const d=daysBetween(todayS, t.dueDate); return d!==null && d>=0 && d<=7; });
    if(overdue.length) list.push({level:"bad", title:"Tareas vencidas", detail:`${overdue.length} tarea(s) atrasadas.`, tab:"tasks"});
    if(dueSoon.length) list.push({level:"warn", title:"Tareas por vencer", detail:`${dueSoon.length} tarea(s) en los próximos 7 días.`, tab:"tasks"});

    const openP = (state.payables||[]).filter(p=>(p.status||"abierto")!=="cerrado");
    const payOver = openP.filter(p=>p.dueDate && daysBetween(p.dueDate, todayS)>0);
    if(payOver.length) list.push({level:"warn", title:"Cuentas por pagar vencidas", detail:`${payOver.length} compra(s) con vencimiento pasado.`, tab:"finance"});

    const badB = state.batches.filter(b=>num(b.countCurrent)<=0 && (b.status||"")!=="cerrado");
    if(badB.length) list.push({level:"info", title:"Camadas por cerrar", detail:`${badB.length} camada(s) sin stock pero abiertas.`, tab:"batches"});

    
    // Ventas huérfanas (camada/cerda eliminada)
    const batchIds = new Set(state.batches.map(b=>b.id));
    const sowIds = new Set(state.sows.map(s=>s.id));
    const orphanSales = state.sales.filter(s=>!batchIds.has(s.batchId) || !sowIds.has(s.sowId));
    if(orphanSales.length){
      list.push({level:"warn", title:"Ventas con referencias faltantes", detail:`${orphanSales.length} venta(s) apuntan a cerda/camada que ya no existe.`, tab:"sales"});
    }

    // Camadas con sobreventa
    const oversold = state.batches.filter(b=>{
      const soldQty = (state.sales||[]).filter(s=>s.batchId===b.id).reduce((a,s)=>a+num(s.qty),0);
      const born = num(b.countInitial)||num(b.countBornAlive)||0;
      return born>0 && soldQty>born+0.0001;
    });
    if(oversold.length){
      list.push({level:"bad", title:"Camadas sobrevendidas", detail:`${oversold.length} camada(s) tienen ventas mayores al nacidos vivos. Revisa registros.`, tab:"batches"});
    }

    // Cerdas con gestación vencida sin parto
    const gestDays = num(state.settings.gestationDays)||114;
    const closed=new Set(state.farrowings.map(f=>f.breedingId).filter(Boolean));
    const overduePreg = state.breedings.filter(b=>{
      if(!b.sowId||!b.date) return false;
      if(closed.has(b.id)) return false;
      return daysBetween(addDays(b.date, gestDays), todayS) > 0;
    });
    if(overduePreg.length){
      list.push({level:"warn", title:"Gestaciones vencidas", detail:`${overduePreg.length} servicio(s) ya pasaron la fecha estimada de parto.`, tab:"breed"});
    }

return list;
  }

  function renderWarningsPanel(){

  function pregnantBreedings(){
    const closed=new Set(state.farrowings.map(f=>f.breedingId).filter(Boolean));

  }
  function pigletsAvailable(){ return state.batches.filter(b=>(b.status||"disponible")!=="cerrado").reduce((s,b)=>s+num(b.countCurrent),0); }
  function lowStock(){ return state.inventory.filter(i=>num(i.qty)<=num(i.minQty||0)); }
  function receivables(){
    return state.sales.map(s=>({s,pending:Math.max(0,num(s.total)-num(s.paidAmount))})).filter(x=>x.pending>0);
  }
  function sumMonth(type){
    const m=today().slice(0,7);
    return state.transactions.filter(t=>t.type===type && String(t.date||"").slice(0,7)===m).reduce((s,t)=>s+num(t.amount),0);

  function saveSow(id){
    const f=$("#sowForm"); const fd=new FormData(f);
    const tag=(fd.get("tag")||"").toString().trim();
    if(!tag){ toast("bad","Falta Tag","El Tag es obligatorio."); return; }
    const dup=state.sows.find(x=>x.tag?.toLowerCase()===tag.toLowerCase() && x.id!==id);
    if(dup){ toast("bad","Duplicado","Ya existe ese Tag."); return; }
    const payload={
      id:id||uid("sow"), tag,
      name:(fd.get("name")||"").toString().trim(),
      breed:(fd.get("breed")||"").toString().trim(),
      dob:(fd.get("dob")||"").toString(),
      status:(fd.get("status")||"activa").toString(),
      notes:(fd.get("notes")||"").toString().trim()
    };
    if(id) state.sows=state.sows.map(x=>x.id===id?payload:x);
    else state.sows.push(payload);
    save(); dlg.close(); toast("ok","Guardado","Cerda guardada."); render();

  function delSow(id){
    const s=get.sow(id); if(!s) return;
    openModal({
      title:"Eliminar cerda",
      sub:"Puedes mantener historial o purgar todo.",
      body:`<div class="muted">Eliminar: <b>${esc(s.tag||s.name||"—")}</b></div>
      <div style="margin-top:10px">
        <label>Modo</label>
        <select id="delMode">
          <option value="keep">Mantener historial (recomendado)</option>
          <option value="purge">Borrar TODO asociado</option>
        </select>
      </div>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn danger" id="okDel">Eliminar</button>`,
      onMount: ()=>{
        $("#okDel").onclick=()=>{
          const mode=$("#delMode").value;
          state.sows=state.sows.filter(x=>x.id!==id);
          if(mode==="purge"){
            const brIds=new Set(state.breedings.filter(b=>b.sowId===id).map(b=>b.id));
            state.breedings=state.breedings.filter(b=>b.sowId!==id);
            state.farrowings=state.farrowings.filter(f=>f.sowId!==id);
            const batchIds=new Set(state.batches.filter(b=>b.sowId===id).map(b=>b.id));
            state.batches=state.batches.filter(b=>b.sowId!==id);
            state.sales=state.sales.filter(s=>!batchIds.has(s.batchId));
            const saleIds=new Set(state.sales.map(s=>s.id));
            state.payments=state.payments.filter(p=>saleIds.has(p.saleId));
            state.tasks=state.tasks.filter(t=>!(t.relatedType==="breeding"&&brIds.has(t.relatedId)));
          } else {
            state.breedings.forEach(b=>{ if(b.sowId===id) b.sowId=""; });
            state.farrowings.forEach(f=>{ if(f.sowId===id) f.sowId=""; });
            state.batches.forEach(b=>{ if(b.sowId===id) b.sowId=""; });
          }
          save(); dlg.close(); toast("ok","Eliminado","Cerda eliminada."); render();
        };
      }
    });
  }

  function breedingForm(b,preset={}){
    if(!state.sows.length) return `<div class="muted">Primero crea una cerda.</div>`;
    b=b||{sowId:preset.sowId||"",date:today(),method:"inseminación",expectedFarrowing:"",notes:""};
    if(!b.expectedFarrowing && b.date) b.expectedFarrowing=addDays(b.date, num(state.settings.gestationDays)||114);

    const sowOps = state.sows.slice().sort((a,b)=>(a.tag||"").localeCompare(b.tag||""))

        </select>

  function openBreeding(id,preset={}){
    if(!state.sows.length){ toast("warn","Sin cerdas","Primero crea una cerda."); openSow(); return; }
    const b=id?get.breeding(id):null;
    openModal({
      title: id?"Editar servicio":"Registrar servicio",
      sub:"Crea una gestación y calcula fecha de parto estimada.",
      body: breedingForm(b,preset),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const f=$("#breedingForm");
        const date=f.querySelector('input[name="date"]');
        const due=f.querySelector('input[name="expectedFarrowing"]');
        date.onchange=()=>{ if(date.value) due.value=addDays(date.value, num(state.settings.gestationDays)||114); };
        // Permitir agregar nuevos métodos de servicio
        const sel = f.querySelector("#breedingMethod");
        const newI = f.querySelector("#breedingNewMethod");
        const addB = f.querySelector("#breedingAddMethod");
        const base = ["inseminación","monta","otro"];
        const refreshMethods = (selected)=>{
          state.settings = state.settings || defaults().settings;
          let arr = (state.settings.serviceMethods || []).map(x=>String(x??"").trim()).filter(Boolean);
          const uniq=[];
          [...arr, ...base].forEach(x=>{
            const k=x.toLowerCase();
            if(!uniq.some(u=>u.toLowerCase()===k)) uniq.push(x);
          });
          state.settings.serviceMethods = uniq;
          if(sel){
            sel.innerHTML = uniq.map(x=>`<option value="${x}">${x}</option>`).join("");
            if(selected) sel.value = selected;
          }
        };
        refreshMethods(sel?.value || "");
        if(addB && newI && sel){
          addB.onclick=()=>{
            const v = (newI.value||"").trim();
            if(!v){ openAlert({title:"Faltan datos", message:"Escribe el nombre del nuevo método/servicio.", kind:"bad"}); return; }
            // agregar (sin duplicados)
            state.settings.serviceMethods = state.settings.serviceMethods || [];
            if(!state.settings.serviceMethods.some(x=>String(x).toLowerCase()===v.toLowerCase())){
              state.settings.serviceMethods.push(v);
            }
            refreshMethods(v);
            sel.value = v;
            newI.value = "";
            save();
            toast("ok","Agregado",`Método: ${v}`);
          };
          newI.addEventListener("keydown",(e)=>{
            if(e.key==="Enter"){ e.preventDefault(); addB.click(); }
          });
        }

        $("#save").onclick=()=>saveBreeding(id);
      }
    });
  }

    const f=$("#breedingForm"); const fd=new FormData(f);

    const date=(fd.get("date")||"").toString();

    };

      state.tasks.push({id:uid("tsk"),title:`Chequeo preñez — ${get.sow(sowId)?.tag||"cerda"}`,dueDate:addDays(date,25),priority:"media",status:"pendiente",relatedType:"breeding",relatedId:payload.id,notes:"Sugerido 21–28 días."});

  function delBreeding(id){
    const b=get.breeding(id); if(!b) return;
    const has=state.farrowings.some(f=>f.breedingId===id);
    if(has){ toast("bad","No permitido","Este servicio ya tiene parto."); return; }

  function saveFarrowing(id){
    const f=$("#farForm"); const fd=new FormData(f);
    const sowId=(fd.get("sowId")||"").toString();
    const date=(fd.get("date")||"").toString();
    if(!sowId||!date){ toast("bad","Faltan datos","Cerda y fecha son obligatorios."); return; }
    const breedingId=(fd.get("breedingId")||"").toString();
    if(breedingId){
      const dup=state.farrowings.find(x=>x.breedingId===breedingId && x.id!==id);
      if(dup){ toast("bad","Duplicado","Ese servicio ya tiene parto."); return; }
    }
    const payload={
      id:id||uid("far"),
      breedingId:breedingId||"",
      sowId, date,
      bornTotal:num(fd.get("bornTotal")),
      bornAlive:num(fd.get("bornAlive")),
      stillborn:num(fd.get("stillborn")),
      mummified:num(fd.get("mummified")),
      notes:(fd.get("notes")||"").toString().trim()
    };
    if(id) state.farrowings=state.farrowings.map(x=>x.id===id?payload:x);
    else {
      state.farrowings.push(payload);
      state.tasks.push({id:uid("tsk"),title:`Destete sugerido — ${get.sow(sowId)?.tag||"cerda"}`,dueDate:addDays(date,28),priority:"media",status:"pendiente",relatedType:"batch",relatedId:"",notes:"Ajusta 21–35 días según manejo."});
    }

    // batch linked
    let batch=state.batches.find(b=>b.farrowingId===payload.id);
    const init=Math.max(0, payload.bornAlive);
    if(!batch){
      batch={id:uid("bat"),sowId,farrowingId:payload.id,birthDate:date,weaningDate:addDays(date,28),countInitial:init,countCurrent:init,status:"disponible",notes:""};
      state.batches.push(batch);
    } else {
      batch.sowId=sowId; batch.birthDate=date; batch.weaningDate=batch.weaningDate||addDays(date,28);
      batch.countInitial=init; batch.countCurrent=Math.min(num(batch.countCurrent), init);
    }
    // link destete task
    const t=state.tasks.find(x=>x.relatedType==="batch" && x.relatedId==="" && x.title.startsWith("Destete sugerido"));
    if(t) t.relatedId=batch.id;

    save(); dlg.close(); toast("ok","Guardado","Parto registrado."); render();
  }

  function openBatch(id, pre={}){
    if(!state.sows.length){ toast("warn","Sin cerdas","Primero crea una cerda."); openSow(); return; }

    const mode = (pre&&pre.mode)?pre.mode:"manual";

    openModal({
      title: id ? "Editar camada" : (mode==="birth" ? "Registrar parto" : "Camada manual"),
      sub: id ? "" : (mode==="birth" ? "Registra un parto creando la camada (mismo formulario de camada manual)." : "Útil si registras lotes sin usar el módulo de parto."),
      body: batchForm(b) + (id ? profitHistoryHTML("batch", id) + supplyHistoryHTML("batch", id) : ""),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{

        const birth=f.querySelector('input[name="birthDate"]');

        birth.onchange=()=>{ if(birth.value && !wean.value) wean.value=addDays(birth.value,28); };

        dlgBody.querySelectorAll("button[data-supply]").forEach(b=>{
          b.onclick=()=>{ const t=b.dataset.supply; const did=b.dataset.supplyid; dlg.close(); openSupplyFor(t, did); };
        });
        $("#save").onclick=()=>{
          const fd=new FormData(f);
          const sowId=(fd.get("sowId")||"").toString();
          const birthDate=(fd.get("birthDate")||"").toString();
          if(!sowId||!birthDate){ toast("bad","Faltan datos","Cerda y nacimiento son obligatorios."); return; }
          const ci = num(fd.get("countInitial"));
          const ccRaw = (fd.get("countCurrent")||"").toString().trim();
          const cc = ccRaw==="" ? ci : num(ccRaw);

          const payload={
            id:id||uid("bat"),
            sowId, farrowingId:b?.farrowingId||"",
            birthDate,
            weaningDate:(fd.get("weaningDate")||"").toString(),
            countInitial:ci,
            countBornAlive:ci,
            countCurrent:Math.min(cc, ci),
            status:(fd.get("status")||"disponible").toString(),
            notes:(fd.get("notes")||"").toString().trim()
          };
          if(id) state.batches=state.batches.map(x=>x.id===id?payload:x);
          else state.batches.push(payload);
          save(); dlg.close(); toast("ok","Guardado","Camada guardada."); render();
        };
      }
    });

      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="ok">Aplicar</button>`,
      onMount: ()=>{
        $("#ok").onclick=()=>{
          const fd=new FormData($("#adjForm"));
          const type=(fd.get("type")||"mortalidad").toString();
          const qty=num(fd.get("qty"));
          if(qty<=0){ toast("bad","Cantidad inválida","Debe ser > 0."); return; }
          const before=num(b.countCurrent);
          let after=before;
          if(type==="mortalidad") after=Math.max(0, before-qty);
          else after=Math.max(0, qty);
          b.countCurrent=after;
          if(after===0) b.status="cerrado";
          state.stockMovements.push({id:uid("mov"),itemId:"",type:"ajuste",date:(fd.get("date")||today()).toString(),qty:(type==="mortalidad"?-qty:(after-before)),unitCost:0,linkedType:"batch",linkedId:b.id,notes:`Camada ${type}. ${(fd.get("notes")||"").toString().trim()}`.trim()});
          save(); dlg.close(); toast("ok","Aplicado",`${before} → ${after}`); render();
        };
      }
    });
  }

  function openInvItem(id){
    const i=id?get.inv(id):null;
    openModal({
      title:id?"Editar insumo":"Nuevo insumo",
      sub:"Define mínimo para alertas.",
      body:invForm(i, !id),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const f = $("#invForm");
        const reg = $("#invRegPurchase");
        const qtyI = $("#invQty");
        const totalI = $("#invTotal");
        const ucI = $("#invUnitCost");
        const stI = $("#invPayStatus");
        const paidI = $("#invPaidNow");
        const dueI = $("#invDue");
        const methodI = $("#invMethod");

        function clampPaid(){
          const total=num(totalI?.value);
          if(stI?.value==="pagado"){
            setMoney(paidI, Math.max(0,total));
            paidI.disabled = true;
            dueI.value = "";
            dueI.disabled = true;
          } else if(stI?.value==="credito"){
            setMoney(paidI, 0);
            paidI.disabled = true;
            dueI.disabled = false;
          } else {
            paidI.disabled = false;
            dueI.disabled = false;
            const p=num(paidI.value);
            if(p>total) setMoney(paidI, Math.max(0,total));
          }
        }

        function recalcUnit(){
          if(!reg || !reg.checked) return;
          const q=num(qtyI?.value);
          const total=num(totalI?.value);
          if(q>0 && total>0){
            const uc = total / q;
            setMoney(ucI, Math.round(uc));
          }
          clampPaid();
        }
        if(reg){ reg.onchange=()=>{ clampPaid(); }; }
        if(totalI){ totalI.oninput=recalcUnit; }
        if(qtyI){ qtyI.oninput=recalcUnit; }
        if(stI){ stI.onchange=clampPaid; }
        if(paidI){ paidI.oninput=clampPaid; }
        clampPaid();

        $("#save").onclick=()=>{
          const fd=new FormData($("#invForm"));
          const name=(fd.get("name")||"").toString().trim();
          if(!name){ toast("bad","Falta nombre","Obligatorio."); return; }
          const payload={
            id:id||uid("inv"),
            name,
            category:(fd.get("category")||"alimento").toString(),
            unit:(fd.get("unit")||"und").toString().trim()||"und",
            qty:num(fd.get("qty")),
            minQty:num(fd.get("minQty")),
            unitCost:num($("#invUnitCost")?.value),
            supplier:(fd.get("supplier")||"").toString().trim(),
            expiration:(fd.get("expiration")||"").toString(),
            notes:(fd.get("notes")||"").toString().trim()
          };
          if(id) state.inventory=state.inventory.map(x=>x.id===id?payload:x);
          else state.inventory.push(payload);

          // Compra inicial opcional → movimiento + finanzas + cuentas por pagar
          if(!id){
            const reg=$("#invRegPurchase");
            const q=num($("#invQty")?.value);
            const total=num($("#invTotal")?.value);
            if(reg?.checked && total<=0){ openAlert({title:"Falta el total", message:"Si vas a registrar la compra en Finanzas, ingresa el Total compra (COP).", kind:"bad"}); return; }
            const date=(fd.get("pDate")||today()).toString();
            const status=($("#invPayStatus")?.value||"pagado").toString();
            const method=($("#invMethod")?.value||"efectivo").toString();
            const due=($("#invDue")?.value||"").toString();
            let paidNow=num($("#invPaidNow")?.value);

            if(reg?.checked && q>0){
              // Movimiento de entrada inicial (historial)
              state.stockMovements.push({
                id:uid("mov"),
                itemId:payload.id,
                type:"entrada",
                date,
                qty:q,
                unitCost:payload.unitCost||0,
                linkedType:"",
                linkedId:"",
                totalCost: total,
                payStatus: status,
                paidNow: Math.max(0, Math.min(total, paidNow)),
                method,
                supplier: payload.supplier||"",
                dueDate: due,
                notes: ("Compra inicial" + (payload.notes?(" • "+payload.notes):"")).trim()
              });
            }

            if(reg?.checked && total>0){
              // Ajusta pagado según estado
              if(status==="pagado") paidNow = total;
              if(status==="credito") paidNow = 0;
              paidNow = Math.max(0, Math.min(total, paidNow));

              // Gasto en finanzas SOLO por lo pagado hoy (caja)
              if(paidNow>0){
                state.transactions.push({
                  id:uid("tx"),
                  date,
                  type:"gasto",
                  category:"Inventario / compra",
                  amount: paidNow,
                  method,
                  refType:"inventory",
                  refId: payload.id,
                  notes:`Compra: ${payload.name}`
                });
              }

              // Si queda pendiente, crear cuenta por pagar
              const remain = Math.max(0, total - paidNow);
              if(remain>0){
                state.payables.push({
                  id:uid("pay"),
                  date,
                  category:"Inventario / compra",
                  supplier: payload.supplier||"",
                  refType:"inventory",
                  refId: payload.id,
                  itemName: payload.name,
                  total,
                  paid: paidNow,
                  dueDate: due,
                  method,
                  status:"abierto",
                  notes:`Compra: ${payload.name}`
                });
              }
            }
          }

          save(); dlg.close(); toast("ok","Guardado","Insumo guardado."); render();
        };
      }
    });
  }
