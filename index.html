          else if(qa.value==="inv") { openInvItem(); toast("warn","Tip","Guarda el insumo desde el formulario para evitar duplicados."); }
          else if(qa.value==="expense") { 
            const fd=new FormData($("#txForm"));
            const amount=num(fd.get("amount"));
            if(amount<=0){ toast("bad","Valor inválido","Debe ser >0."); return; }
            state.transactions.push({id:uid("tx"),date:(fd.get("date")||today()).toString(),type:"gasto",line:(fd.get("line")||"general").toString(),category:(fd.get("category")||"Operación").toString(),amount,method:(fd.get("method")||"efectivo").toString(),refType:"manual",refId:"",notes:(fd.get("notes")||"").toString()});
            save(); dlg.close(); toast("ok","Guardado","Gasto registrado."); render();
          }
          else if(qa.value==="task"){
            const fd=new FormData($("#taskForm"));
            const title=(fd.get("title")||"").toString().trim();
            if(!title){ toast("bad","Falta título","Obligatorio."); return; }
            state.tasks.push({id:uid("tsk"),title,dueDate:(fd.get("dueDate")||"").toString(),priority:(fd.get("priority")||"media").toString(),status:(fd.get("status")||"pendiente").toString(),relatedType:(fd.get("relatedType")||"").toString(),relatedId:(fd.get("relatedId")||"").toString(),notes:(fd.get("notes")||"").toString().trim()});
            save(); dlg.close(); toast("ok","Guardado","Tarea creada."); render();
          }
        };
      }
    });
  };

  
$("#newSale").onclick=()=>openSale();
  const fbBtn=$("#fbStatusBtn"); if(fbBtn) fbBtn.onclick=()=>{ try{ window.__ensureFirebaseConnection && window.__ensureFirebaseConnection(); }catch(e){} };
  const hb=$("#helpBtn"); if(hb) hb.onclick=()=>openHelp();

  // ------- Init -------
  mountLogin();
  renderNav();
  render();
  enforceAuth();
  if(storage._mode==="memory"){
    toast("warn","Almacenamiento bloqueado","Este navegador está bloqueando el almacenamiento. Los datos NO se guardarán hasta permitir almacenamiento/sitio.");
  }
  save(); // ensures pills update
  if(!requireAuth() || isAuthed()) setTimeout(()=>maybeOnboard(), 80);

  // ==============================
  // Firebase: aplicar estado remoto
  // ==============================
  window.applyRemoteState = function(remoteState, meta){
    try{
      if(!remoteState) return;
      window.__APPLYING_REMOTE__ = true;
      state = remoteState;
      normalizeState();
      auditState();
      // Guardar local para offline
      try{ storage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      // Re-render + badges
      render();
      if(typeof renderNavBadges==="function") renderNavBadges();
    }catch(e){
      console.warn("[Firebase] applyRemoteState error:", e);
    }finally{
      // libera el flag
      setTimeout(()=>{ window.__APPLYING_REMOTE__ = false; }, 0);
    }
  };

  // Si Firebase cargó antes de que la app estuviera lista:
  try{
    if(window.__BOOTSTRAP_STATE__){
      window.applyRemoteState(window.__BOOTSTRAP_STATE__, {source:"cloud_boot_deferred"});
      window.__BOOTSTRAP_STATE__ = null;
    }else if(window.__REMOTE_STATE__){
      window.applyRemoteState(window.__REMOTE_STATE__, {source:"cloud_live_deferred"});
      window.__REMOTE_STATE__ = null;
    }
  }catch(e){}

  // Si NO había estado en la nube, empuja el estado local (una sola vez)
  window.onFirebaseReady = function(info){
    try{
      if(!info || info.hadCloud) return;
      if(window.__PUSHED_LOCAL_ONCE__) return;
      window.__PUSHED_LOCAL_ONCE__ = true;

      if(window.firebaseCloud && window.firebaseCloud.ready){
        window.__setFBStatus && window.__setFBStatus(false,"subiendo estado…");
        window.firebaseCloud.saveNow(state)
          .then(()=>{
            console.log("[Firebase] Estado local subido a la nube (primera vez)");
            window.__setFBStatus && window.__setFBStatus(true);
          })
          .catch((e)=>{
            console.warn("[Firebase] Primer push error:", e);
            window.__setFBStatus && window.__setFBStatus(false,"desconectado");
          });
      }
    }catch(e){}
  };

  // Si Firebase ya estaba listo antes de definir onFirebaseReady:
  try{
    if(window.__FIREBASE_INFO__ && typeof window.onFirebaseReady==="function"){
      window.onFirebaseReady(window.__FIREBASE_INFO__);
    }
  }catch(e){}


})();
</script>
