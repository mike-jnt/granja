  function syncSanitaryProtocolTasks(){
    state.tasks = state.tasks || [];
    const existing = new Map();
    state.tasks.forEach(t=>{
      if(t && t.autoKind === "sanitary_protocol" && t.protocolTaskKey) existing.set(String(t.protocolTaskKey), t);
    });
    const nextAuto = [];
    const expected = new Set();
    const closedBreedings = new Set((state.farrowings||[]).map(f=>String(f.breedingId||"")).filter(Boolean));

    function upsertAutoTask(spec){
      expected.add(spec.key);
      let t = existing.get(spec.key);
      if(!t){
        t = {id:uid("tsk"), autoKind:"sanitary_protocol", protocolTaskKey:spec.key, status:"pendiente", priority:spec.priority||"media"};
      }
      t.title = spec.title;
      t.dueDate = spec.dueDate;
      t.priority = spec.priority || t.priority || "media";
      t.relatedType = spec.relatedType || "";
      t.relatedId = spec.relatedId || "";
      t.notes = spec.notes || "";
      t.protocolGroup = spec.group || "";
      nextAuto.push(t);
    }

    (state.breedings||[]).forEach(br=>{
      const id = String(br.id||"");
      const baseDate = String(br.date||"");
      if(!id || !baseDate || closedBreedings.has(id)) return;
      const sow = get.sow(br.sowId);
      const sowLabel = (sow?.tag || sow?.name || "cerda").toString();
      SANITARY_PROTOCOLS.gestation.forEach(item=>{
        const due = addDays(baseDate, num(item.day));
        upsertAutoTask({
          key:`sanitary:gestation:${id}:${item.code}`,
          group:"gestation",
          title:`${item.stageLabel} — ${item.shortLabel} — ${sowLabel}`,
          dueDate:due,
          priority:item.priority || "media",
          relatedType:"breeding",
          relatedId:id,
          notes:`${item.medication}`
        });
      });
    });

    const batchesByFarrowing = new Map((state.batches||[]).map(b=>[String(b.farrowingId||""), b]));
    (state.farrowings||[]).forEach(far=>{
      const farId = String(far.id||"");
      const baseDate = String(far.date||"");
      if(!farId || !baseDate) return;
      const batch = batchesByFarrowing.get(farId) || (state.batches||[]).find(b=>String(b.farrowingId||"")===farId);
      if(!batch) return;
      const batchId = String(batch.id||"");
      const currentCount = num(batch.countCurrent);
      const batchClosed = (String(batch.status||"disponible").toLowerCase()==="cerrado") || currentCount<=0;
      if(batchClosed) return;
      const sow = get.sow(far.sowId || batch.sowId);
      const sowLabel = (sow?.tag || sow?.name || "cerda").toString();
      SANITARY_PROTOCOLS.lactation.forEach(item=>{
        const due = addDays(baseDate, num(item.day));
        upsertAutoTask({
          key:`sanitary:lactation:${batchId}:${item.code}`,
          group:"lactation",
          title:`${item.stageLabel} — ${item.shortLabel} — ${sowLabel}`,
          dueDate:due,
          priority:item.priority || "media",
          relatedType:"batch",
          relatedId:batchId,
          notes:`${item.medication}`
        });
      });
      SANITARY_PROTOCOLS.piglets.forEach(item=>{
        const due = addDays(baseDate, num(item.day));
        upsertAutoTask({
          key:`sanitary:piglets:${batchId}:${item.code}`,
          group:"piglets",
          title:`${item.stageLabel} — ${item.shortLabel} — ${sowLabel}`,
          dueDate:due,
          priority:item.priority || "media",
          relatedType:"batch",
          relatedId:batchId,
          notes:`${item.medication}`
        });
      });
    });

    state.tasks = state.tasks.filter(t=>!(t && t.autoKind === "sanitary_protocol" && t.protocolTaskKey && !expected.has(String(t.protocolTaskKey))));
    const manual = state.tasks.filter(t=>!(t && t.autoKind === "sanitary_protocol"));
    state.tasks = manual.concat(nextAuto);
  }

  function auditState(){
    normalizeState();

    // Reconciliar abonos: sale.paidAmount = suma de payments (si existen)
    const paySumBySale = new Map();
    (state.payments||[]).forEach(p=>{
      const sid = (p.saleId||"").toString();
      if(!sid) return;
      const a = num(p.amount);
      paySumBySale.set(sid, (paySumBySale.get(sid)||0) + a);
    });

    const hasGet = (typeof get !== "undefined");
    // Ajustes / métodos de servicio
    state.settings = state.settings || defaults().settings;
    const baseMethods = ["inseminación","monta","otro"];
    state.settings.serviceMethods = (state.settings.serviceMethods || baseMethods)
      .map(x=>String(x??"").trim()).filter(Boolean);
    // asegurar base y evitar duplicados (case-insensitive)
    const uniq=[];
    [...state.settings.serviceMethods, ...baseMethods].forEach(x=>{
      const k=x.toLowerCase();
      if(!uniq.some(u=>u.toLowerCase()===k)) uniq.push(x);
    });
    state.settings.serviceMethods = uniq;


    state.inventory.forEach(i=>{
      i.qty = Math.max(0, num(i.qty));
      i.minQty = Math.max(0, num(i.minQty));
      i.unitCost = Math.max(0, num(i.unitCost));
    });

    state.batches.forEach(b=>{
      // Compatibilidad: algunas versiones usan countInitial, otras countBornAlive
      const born = (b.countInitial!=null ? b.countInitial : b.countBornAlive);
      b.countInitial = Math.max(0, num(born));
      b.countBornAlive = b.countInitial; // alias interno
      b.countCurrent = Math.max(0, num(b.countCurrent));
      if(b.countCurrent > b.countInitial) b.countCurrent = b.countInitial;

      // Estado: no forzar "cerrado" por defecto si falta información
      if(!b.status) b.status = "disponible";
      // Auto-cerrar solo cuando hay cantidad inicial registrada y ya no queda stock
      if(b.countInitial>0 && b.countCurrent<=0 && (b.status==="disponible" || !b.status)) b.status = "cerrado";
    });

    state.sales.forEach(s=>{
      s.qty = Math.max(0, num(s.qty));
      s.unitPrice = Math.max(0, num(s.unitPrice));
      s.total = Math.max(0, num(s.total) || (s.qty*s.unitPrice));
      s.paidAmount = Math.max(0, Math.min(s.total, num(s.paidAmount)));
      if(!s.status) s.status = (s.paidAmount>=s.total ? "pagado" : (s.paidAmount>0 ? "parcial" : "credito"));
      if(!s.sowId && s.batchId && hasGet){
        const b=get.batch(s.batchId);
        if(b?.sowId) s.sowId = b.sowId;
      }

      // Reconciliar con historial de pagos (si hay registros)
      if(paySumBySale.has(s.id)){
        const ps = paySumBySale.get(s.id)||0;
        s.paidAmount = Math.min(num(s.total), Math.max(0, ps));
      }
      const pending2 = Math.max(0, num(s.total) - num(s.paidAmount));
      s.status = pending2<=0 ? "pagado" : (num(s.paidAmount)>0 ? "parcial" : "credito");
    });

    (state.payables||[]).forEach(p=>{
      p.total = Math.max(0, num(p.total));
      p.paid = Math.max(0, Math.min(p.total, num(p.paid)));
      if(p.paid >= p.total - 0.0001) p.status = "cerrado";
      if(!p.status) p.status = (p.paid >= p.total - 0.0001) ? "cerrado" : "abierto";
    });

    state.tasks.forEach(t=>{
      if(t.done===undefined) t.done = false;
      if(!t.priority) t.priority = "media";
    });

    syncSanitaryProtocolTasks();

    state.stockMovements.forEach(m=>{
      // Mantener signo: entradas (+), salidas (-).
      // Versiones antiguas guardaban qty siempre positivo; normalizamos según m.type.
      const t = String(m.type||"").toLowerCase();
      let q = num(m.qty);
      if(t==="salida") q = -Math.abs(q);
      else if(t==="entrada") q = Math.abs(q);
      if(!Number.isFinite(q)) q = 0;

      // Normalizar costos
      m.unitCost = Math.max(0, num(m.unitCost));
      if(m.totalCost!==undefined && m.totalCost!==null) m.totalCost = Math.max(0, num(m.totalCost));

      // Completar unitCost si falta
      if((m.unitCost===undefined || m.unitCost===null || m.unitCost===0) && hasGet){
        const it=get.inv(m.itemId);
        m.unitCost = Math.max(0, num(it?.unitCost) || 0);
      }

      // Recuperar qty si quedó en 0 por auditorías antiguas pero existe costo total
      if(t==="salida" && Math.abs(q) < 1e-9){
        const tc = num(m.totalCost);
        const uc = Math.max(0, num(m.unitCost));
        if(tc>0 && uc>0){
          q = -Math.round((tc/uc)*10000)/10000;
        }
      }

      // Evita -0
      if(Math.abs(q) < 1e-9) q = 0;
      m.qty = q;
    });

    // Animales (solo Engorde)
    state.animals = state.animals || [];
    state.animals.forEach(a=>{
      a.id = String(a.id || uid("ani"));
      a.name = String(a.name || "").trim();
      a.penId = String(a.penId || "");
      a.batchId = String(a.batchId || "");
      a.createdAt = String(a.createdAt || nowISO());
      const st = String(a.status || "activo").toLowerCase();
      a.status = (st==="activo"||st==="vendido"||st==="muerto") ? st : "activo";
      a.weightKg = Math.max(0, num(a.weightKg));
      a.sick = !!a.sick;
      a.sickNotes = String(a.sickNotes||"").trim();
      if(!a.notes) a.notes = "";
    });
    state.animalEvents = state.animalEvents || [];
    state.animalEvents.forEach(ev=>{
      ev.id = String(ev.id || uid("aev"));
      ev.animalId = String(ev.animalId || "");
      ev.date = String(ev.date || nowISO());
      ev.type = String(ev.type || "");
      if(!ev.data) ev.data = {};
    });


    // Carne / ventas (conectada a Engorde)
    state.meat = state.meat || {stockKg:0,headsForSale:0,movements:[]};
    state.meat.stockKg = Math.max(0, num(state.meat.stockKg));
    state.meat.headsForSale = Math.max(0, num(state.meat.headsForSale));
    state.meat.movements = state.meat.movements || [];

    // Ajustes útiles
    state.settings = state.settings || defaults().settings;
    state.settings.arrobaKg = Math.max(0, num(state.settings.arrobaKg) || 12.5);
    state.settings.defaultPigKg = Math.max(0, num(state.settings.defaultPigKg) || 100);

    state.meatSales = state.meatSales || [];
    state.meatPayments = state.meatPayments || [];

    state.meatSales.forEach(s=>{
      // Migración: ventas antiguas eran por kg (qty=kg)
      if(!s.unit) s.unit = "kg";
      s.unit = String(s.unit||"kg").toLowerCase();
      s.penId = (s.penId||"").toString();

      s.qty = Math.max(0, num(s.qty));
      s.unitPrice = Math.max(0, num(s.unitPrice));
      s.total = Math.max(0, num(s.total) || (s.qty*s.unitPrice));

      // Cabezas y equivalencia en kg (para reportes/KPIs)
      s.headsUsed = Math.max(0, Math.floor(num(s.headsUsed || (s.unit==="completo" ? s.qty : 0))));
      const arrobaKg = Math.max(0, num(state.settings.arrobaKg) || 12.5);
      const defKg = Math.max(0, num(state.settings.defaultPigKg) || 100);
      s.avgKg = Math.max(0, num(s.avgKg || defKg));
      if(s.kgEq==null){
        if(s.unit==="kg") s.kgEq = s.qty;
        else if(s.unit==="arroba") s.kgEq = s.qty * arrobaKg;
        else if(s.unit==="completo") s.kgEq = s.headsUsed * s.avgKg;
        else s.kgEq = s.qty;
      }
      s.kgEq = Math.max(0, num(s.kgEq));

      s.paidAmount = Math.max(0, Math.min(s.total, num(s.paidAmount)));
      if(!s.status) s.status = (s.paidAmount>=s.total ? "pagado" : (s.paidAmount>0 ? "parcial" : "credito"));
      const pending = Math.max(0, num(s.total) - num(s.paidAmount));
      s.status = pending<=0 ? "pagado" : (num(s.paidAmount)>0 ? "parcial" : "credito");

      // Deducciones por lote (para reversión en edición/eliminar)
      if(!Array.isArray(s.deductions)) s.deductions = [];
    });

  }

  function getWarnings(){
    normalizeState();
    const list=[];
    const todayS=today();

    const tags=state.sows.map(s=>(s.tag||"").trim()).filter(Boolean);
    const dup=[...new Set(tags.filter((t,i)=>tags.indexOf(t)!==i))];
    if(dup.length){
      list.push({level:"bad", title:"Tags duplicados", detail:`Corrige: ${dup.slice(0,6).join(", ")}${dup.length>6?"…":""}`, tab:"sows"});
    }

    const low = state.inventory.filter(i=>num(i.qty) <= num(i.minQty) && (i.name||"").trim());
    if(low.length){
      list.push({level:"warn", title:"Stock bajo", detail:`${low.length} insumo(s) por debajo del mínimo.`, tab:"inv"});
    }

    const expSoon = state.inventory
      .filter(i=>i.expiration)
      .map(i=>({i, d: daysBetween(todayS, i.expiration)}))
      .filter(x=>x.d!==null && x.d>=0 && x.d<=30);
    if(expSoon.length){
      list.push({level:"warn", title:"Vencimientos próximos", detail:`${expSoon.length} insumo(s) vencen en ≤ 30 días.`, tab:"inv"});
    }

    const pending = state.tasks.filter(t => (t.status || "pendiente") !== "hecha" && t.dueDate);
    const overdue = pending.filter(t=>daysBetween(t.dueDate, todayS)>0);
    const dueSoon = pending.filter(t=>{ const d=daysBetween(todayS, t.dueDate); return d!==null && d>=0 && d<=7; });
    if(overdue.length) list.push({level:"bad", title:"Tareas vencidas", detail:`${overdue.length} tarea(s) atrasadas.`, tab:"tasks"});
    if(dueSoon.length) list.push({level:"warn", title:"Tareas por vencer", detail:`${dueSoon.length} tarea(s) en los próximos 7 días.`, tab:"tasks"});

    const openP = (state.payables||[]).filter(p=>(p.status||"abierto")!=="cerrado");
    const payOver = openP.filter(p=>p.dueDate && daysBetween(p.dueDate, todayS)>0);
    if(payOver.length) list.push({level:"warn", title:"Cuentas por pagar vencidas", detail:`${payOver.length} compra(s) con vencimiento pasado.`, tab:"finance"});

    const badB = state.batches.filter(b=>num(b.countCurrent)<=0 && (b.status||"")!=="cerrado");
    if(badB.length) list.push({level:"info", title:"Camadas por cerrar", detail:`${badB.length} camada(s) sin stock pero abiertas.`, tab:"batches"});

    // Camadas sin destete registrado (recordatorio, no se asume fecha automática)
    const noWean = state.batches.filter(b=>{
      if(String(b.origin||"")==="engorde_manual") return false;
      if((b.status||"disponible")==="cerrado") return false;
      if(num(b.countCurrent)<=0) return false;
      if(String(b.weaningDate||"")) return false;
      if(!b.birthDate) return false;
      const age = daysBetween(b.birthDate, todayS);
      return age!=null && age>35;
    });
    if(noWean.length){
      list.push({level:"warn", title:"Destetes sin registrar", detail:`${noWean.length} camada(s) llevan más de 35 días sin fecha de destete. Registra el destete real cuando ocurra.`, tab:"batches"});
    }

    
    // Ventas huérfanas (camada/cerda eliminada)
    const batchIds = new Set(state.batches.map(b=>b.id));
    const sowIds = new Set(state.sows.map(s=>s.id));
    const orphanSales = state.sales.filter(s=>!batchIds.has(s.batchId) || !sowIds.has(s.sowId));
    if(orphanSales.length){
      list.push({level:"warn", title:"Ventas con referencias faltantes", detail:`${orphanSales.length} venta(s) apuntan a cerda/camada que ya no existe.`, tab:"sales"});
    }

    // Camadas con sobreventa
    const oversold = state.batches.filter(b=>{
      const soldQty = (state.sales||[]).filter(s=>s.batchId===b.id).reduce((a,s)=>a+num(s.qty),0);
      const born = num(b.countInitial)||num(b.countBornAlive)||0;
      return born>0 && soldQty>born+0.0001;
    });
    if(oversold.length){
      list.push({level:"bad", title:"Camadas sobrevendidas", detail:`${oversold.length} camada(s) tienen ventas mayores al nacidos vivos. Revisa registros.`, tab:"batches"});
    }

    // Cerdas con gestación vencida sin parto
    const gestDays = num(state.settings.gestationDays)||114;
    const closed=new Set(state.farrowings.map(f=>f.breedingId).filter(Boolean));
    const overduePreg = state.breedings.filter(b=>{
      if(!b.sowId||!b.date) return false;
      if(closed.has(b.id)) return false;
      return daysBetween(addDays(b.date, gestDays), todayS) > 0;
    });
    if(overduePreg.length){
      list.push({level:"warn", title:"Gestaciones vencidas", detail:`${overduePreg.length} servicio(s) ya pasaron la fecha estimada de parto.`, tab:"breed"});
    }

return list;
  }

  // ------- Engorde -------
  function engordeEligibleBatches(){
    const t=today();
    return (state.batches||[])
      .filter(b=>num(b.countCurrent)>0 && b.birthDate && (b.status||"disponible")!=="cerrado")
      .map(b=>({b, days: daysBetween(b.birthDate, t)}))
      .filter(x=>x.days!==null && x.days>=pigletDaysForMeat())
      .sort((a,b)=> (b.b.birthDate||"").localeCompare(a.b.birthDate||""));
  }

  function engordeManualTotal(){
    return (state.engorde?.manual||[]).reduce((s,x)=>s + Math.max(0,num(x.heads)), 0);
  }

  function engordeAutoHeadsAvailable(){
    const elig = engordeEligibleBatches()
      .filter(x=>num(x.b.countCurrent)>0)
      .slice()
      .sort((a,b)=>(a.b.birthDate||"").localeCompare(b.b.birthDate||""));
    return {elig, heads: elig.reduce((s,x)=>s+Math.max(0,num(x.b.countCurrent)),0)};
  }

  function engordeTotalHeadsAvailable(){
    const manual = engordeManualTotal();
    const auto = engordeAutoHeadsAvailable().heads;
    return Math.max(0, manual + auto);
  }

  function engordeDeductHeads(heads, date, reason){
    heads = Math.max(0, num(heads));
    if(heads<=0) return {deducted:0, remaining:0};
    state.engorde = state.engorde || {manual:[], movements:[]};
    state.engorde.manual = state.engorde.manual || [];
    state.engorde.movements = state.engorde.movements || [];

    const beforeTotal = engordeTotalHeadsAvailable();
    let remaining = heads;

    // 1) Deduct from manual stock (oldest first)
    const manualSorted = state.engorde.manual
      .slice()
      .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    for(const x of manualSorted){
      if(remaining<=0) break;
      const avail = Math.max(0, num(x.heads));
      if(avail<=0) continue;
      const take = Math.min(avail, remaining);
      x.heads = avail - take;
      remaining -= take;
    }
    // Clean empty entries
    state.engorde.manual = state.engorde.manual.filter(x=>Math.max(0,num(x.heads))>0);

    // 2) Deduct from automatic eligible batches (oldest first)
    const auto = engordeAutoHeadsAvailable().elig;
    for(const x of auto){
      if(remaining<=0) break;
      const b = x.b;
      const avail = Math.max(0, num(b.countCurrent));
      if(avail<=0) continue;
      const take = Math.min(avail, remaining);
      b.countCurrent = avail - take;
      remaining -= take;
    }

    const afterTotal = engordeTotalHeadsAvailable();
    const deducted = Math.max(0, beforeTotal - afterTotal);

    if(deducted>0){
      state.engorde.movements.push({
        id:uid("engmov"),
        date: date || today(),
        type:"salida",
        heads:deducted,
        before: beforeTotal,
        after: afterTotal,
        reason: reason || "Descuento de engorde"
      });
    }
    return {deducted, remaining};
  }

          const w=Math.max(0, num(fd.get("weightKg")));

          if(!penId || !name){

          }
          const a = createAnimal(penId, name, w, {createdAt: date ? (date + "T00:00:00.000Z") : nowISO(), notes});

    const rev = animalRevenue(a.id);
    const net = rev - cost;
    const evs = (state.animalEvents||[])
      .filter(e=>String(e.animalId||"")===String(a.id))
      .slice()
      .sort((x,y)=>String(y.date||"").localeCompare(String(x.date||"")));
    const rows = evs.length ? evs.map(ev=>{
      const d = ev.data||{};
      let extra = "";
      if(ev.type==="mover") extra = `De ${esc(getPen(d.fromPenId)?.name||"")} a ${esc(getPen(d.toPenId)?.name||"")}`;
      if(ev.type==="peso") extra = `${fmtNum(num(d.weightKg),1)} kg`;
      if(ev.type==="suministro") extra = `${esc(d.itemName||"")} • ${fmtNum(num(d.qty),2)} ${esc(d.unit||"")}`;
      if(ev.type==="venta") extra = `Venta ${esc(d.saleId||"")}`;
      if(ev.type==="baja") extra = `${esc(d.reason||"")}`;
      if(ev.type==="salud") extra = `${d.sick?"Enfermo":"Sano"}${d.notes?` • ${esc(d.notes)}`:""}`;
      if(ev.type==="ingreso") extra = `${esc(getPen(d.penId)?.name||"")}`;
      return `<tr><td>${esc(ev.date||"").slice(0,10)}</td><td>${esc(ev.type)}</td><td>${extra||""}</td></tr>`;

  function openMoveAnimalsInPen(penId){
    const pid=String(penId||"");

      sub:`Se moverán ${fmtNum(list.length,0)} cerdos activos.`,

      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="okAll">Mover</button>`,
      onMount: ()=>{
        $("#okAll").onclick=()=>{
          const fd=new FormData($("#amAllF"));
          const to=(fd.get("penId")||"").toString();

  const view=$("#view");
  function shell(title, sub, actions, body){
    return `<div class="grid">

  // ------- Dashboard -------
  function renderDashboard(){
    const months = getAvailableMonths();
    const curM = today().slice(0,7);
    if(!dashMonth) dashMonth = curM;
    if(dashMonth && !months.includes(dashMonth)) months.unshift(dashMonth);
    const monthSel = dashMonth || curM;

    const inc = sumTx("ingreso", monthSel);
    const exp = sumTx("gasto", monthSel);
    const net = inc - exp;

    const recs = receivables().slice().sort((a,b)=>b.pending-a.pending);
    const recTotal = recs.reduce((s,x)=>s + Math.max(0, num(x.pending)), 0);

    const payOpen = (state.payables||[])
      .filter(p=>(p.status||"abierto")!=="cerrado")
      .slice()
      .sort((a,b)=>String(a.dueDate||a.date||"").localeCompare(String(b.dueDate||b.date||"")));
    const payPending = payOpen.reduce((s,p)=>s + Math.max(0, num(p.total) - num(p.paid)), 0);
    const payOverdue = payOpen.filter(p=>p.dueDate && daysBetween(p.dueDate, today())>0);

    const inventoryValue = (state.inventory||[]).reduce((s,i)=>s + (Math.max(0, num(i.qty)) * Math.max(0, num(i.unitCost))), 0);

    const tasksPending = (state.tasks||[]).filter(t=>(t.status||"pendiente")!=="hecha");
    const tasksOverdue = tasksPending.filter(t=>t.dueDate && daysBetween(t.dueDate, today())>0);
    const tasksSoon = tasksPending.filter(t=>{
      const d = daysBetween(today(), t.dueDate);
      return t.dueDate && d!==null && d>=0 && d<=7;
    });

    const warnings = getWarnings().slice(0,8);
    const monthOps = months.map(mm=>`<option value="${esc(mm)}" ${mm===monthSel?"selected":""}>${esc(mm)}</option>`).join("");

    const controlRows = [
      {label:"Cobros pendientes", value:fmtCOP(recTotal), meta:`${recs.length} venta(s) con saldo`, tag: recTotal>0 ? "warn" : "ok", action:"sales", cta:"Ver cartera"},
      {label:"Cuentas por pagar", value:fmtCOP(payPending), meta:`${payOpen.length} compra(s) abiertas`, tag: payPending>0 ? "bad" : "ok", action:"finance", cta:"Ver proveedores"},
      {label:"Tareas vencidas", value:fmtNum(tasksOverdue.length,0), meta:`${fmtNum(tasksSoon.length,0)} por vencer en 7 días`, tag: tasksOverdue.length ? "bad" : (tasksSoon.length ? "warn" : "ok"), action:"tasks", cta:"Ver agenda"},
      {label:"Inventario valorizado", value:fmtCOP(inventoryValue), meta:`${fmtNum((state.inventory||[]).length,0)} insumo(s) activos`, tag:"info", action:"inv", cta:"Ver inventario"}
    ];

    const controlHTML = `
      <div class="helpCard" style="margin-top:12px">
        <div class="helpHd">
          <div>
            <b>Control del período</b>
            <div class="muted">Lectura rápida para tesorería, cartera y seguimiento diario.</div>

              ${controlRows.map(r=>`<tr>

            </tbody>
          </table>
        </div>
      </div>`;

    const receivableRows = recs.slice(0,6).map(x=>{
      const c = get.client(x.s.clientId);
      const st = num(x.s.paidAmount)>0 ? '<span class="tag warn">Parcial</span>' : '<span class="tag bad">Pendiente</span>';
      return `<tr>
        <td class="mono">${esc(x.s.date||"—")}</td>

      </tr>`;

        <td class="mono">${esc(p.dueDate||p.date||"—")}</td>

  // ------- Sows / Cajones -------
  let sowsPenId = ""; // vista actual de cajón en sección Cerdas

  function penAcceptsSow(p){
    const t=String(p?.type||"").toLowerCase();
    return t !== "engorde";
  }
  function penAcceptsBatch(p){
    const t=String(p?.type||"").toLowerCase();
    return t !== "gestacion";
  }
  function getPen(id){ return (state.pens||[]).find(p=>p.id===id); }
  function firstPenIdByType(type){
    const t=String(type||"").toLowerCase();
    return (state.pens||[]).find(p=>String(p.type||"").toLowerCase()===t)?.id || "";
  }

  function lastBreedingForSow(sowId){
    return (state.breedings||[])
      .filter(b=>b.sowId===sowId)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0] || null;
  }

  function activeLactationBatchForSow(sowId){
    const list = (state.batches||[])
      .filter(b=>b.sowId===sowId && (b.status||"disponible")!=="cerrado" && num(b.countCurrent)>0)
      .sort((a,b)=>(b.birthDate||"").localeCompare(a.birthDate||""));
    if(!list.length) return null;
    const b=list[0];
    const wean = String(b.weaningDate||"");
    if(wean) return (today() < wean) ? b : null;
    // Si no hay destete registrado, NO asumimos una fecha.
    // Se considera lactancia abierta hasta que el usuario registre el destete.
    return b;
  }


  function isGrowoutBatch(b){
    if(!b) return false;
    if((b.status||"disponible")==="cerrado") return false;
    if(num(b.countCurrent)<=0) return false;
    const wean = String(b.weaningDate||"");
    if(!wean) return false;
    return today() >= wean;
  }

  function effectiveGestationPenId(sow){
    const pid = String(sow?.penId||"");
    const p = pid ? getPen(pid) : null;
    if(p && penAcceptsSow(p) && String(p.type||"").toLowerCase()==="gestacion") return pid;
    return firstPenIdByType("gestacion") || pid || "";
  }

  function effectiveMaternityPenId(sow, batch){
    const bid = String(batch?.penId||"");
    const bp = bid ? getPen(bid) : null;
    if(bp && penAcceptsSow(bp) && penAcceptsBatch(bp) && String(bp.type||"").toLowerCase()==="maternidad") return bid;
    const sid = String(sow?.penId||"");
    const sp = sid ? getPen(sid) : null;
    if(sp && penAcceptsSow(sp) && penAcceptsBatch(sp) && String(sp.type||"").toLowerCase()==="maternidad") return sid;
    return firstPenIdByType("maternidad") || "";
  }

  function effectiveEngordePenId(batch){
    const bid = String(batch?.penId||"");
    const bp = bid ? getPen(bid) : null;
    if(bp && penAcceptsBatch(bp) && String(bp.type||"").toLowerCase()==="engorde") return bid;
    return firstPenIdByType("engorde") || bid || "";
  }

  
  // Ocupación de un cajón (útil para el selector de maternidad en Partos)
  // Devuelve: { sows: <n cerdas>, batches: <n camadas activas> }
  function penOccupancy(penId){
    const pid = String(penId||"");
    if(!pid) return {sows:0, batches:0};
    const pen = getPen(pid);
    const t = String(pen?.type||"").toLowerCase();

    let batches = 0;
    const sowIds = new Set();

    (state.batches||[]).forEach(b=>{
      if(String(b?.penId||"") !== pid) return;
      if((b.status||"disponible") === "cerrado") return;
      if(num(b.countCurrent) <= 0) return;

      // En maternidad: contar lactancia hasta que el usuario registre el destete
      if(t === "maternidad"){
        const wean = String(b.weaningDate||"");
        if(wean && today() >= wean) return; // ya destetado -> no cuenta como ocupación de maternidad
      }

      batches += 1;
      if(b.sowId) sowIds.add(String(b.sowId));
    });

    return {sows: sowIds.size, batches};
  }

  function isBasePenId(penId){
    try{ return (defaults().pens||[]).some(p=>String(p.id||"")===String(penId||"")); }
    catch(e){ return false; }
  }

  function getManualBatchForPen(penId){
    const pid = String(penId||"");
    return (state.batches||[]).find(b=>{
      if(String(b.origin||"").toLowerCase()!=="engorde_manual") return false;
      const k = String(b.manualPenId||b.penId||"");
      return k===pid && !String(b.sowId||"");
    });
  }

  function upsertManualBatchForPen(penId, heads){
    const pid = String(penId||"");
    const h = Math.max(0, Math.floor(num(heads)));
    let b = getManualBatchForPen(pid);
    if(h<=0){
      if(b) state.batches = (state.batches||[]).filter(x=>x.id!==b.id);
      return;
    }
    if(!b){
      state.batches = state.batches || [];
      b = {
        id: uid("batch"),
        origin: "engorde_manual",
        manualPenId: pid,
        sowId: "",
        birthDate: "",
        weaningDate: today(),
        countBorn: h,
        countWeaned: h,
        countCurrent: h,
        status: "disponible",
        penId: pid,
        notes: "Ingreso manual al cajón"
      };
      state.batches.push(b);
    }else{
      b.manualPenId = b.manualPenId || pid;
      b.penId = pid;
      b.weaningDate = b.weaningDate || today();
      b.countBorn = h;
      b.countWeaned = h;
      b.countCurrent = h;
    }
  }

          if(dup){ toast("warn","Duplicado","Ya existe un cajón con ese nombre."); return; }

          const capRaw=(fd.get("capacity")||"").toString().trim();
          const entryDate = (fd.get("entryDate")||"").toString().trim();
          const estimatedExitDate = (fd.get("estimatedExitDate")||"").toString().trim();

  function deletePen(penId){
    const pen = getPen(penId);
    if(!pen){ toast("bad","No existe","No se encontró el cajón."); return; }
    if(isBasePenId(penId)){
      openAlert({title:"No se puede eliminar", message:"Este cajón es base del sistema. Puedes editarlo, pero no eliminarlo.", kind:"bad"});
      return;
    }
    const t = String(pen.type||"gestacion").toLowerCase();
    const others = (state.pens||[]).filter(p=>p.id!==penId && String(p.type||"").toLowerCase()===t);
    const sowsN = (state.sows||[]).filter(s=>String(s.penId||"")===String(penId||"")).length;
    const batchesN = (state.batches||[]).filter(b=>String(b.penId||"")===String(penId||"")).length;

    const ops = ['<option value="">Auto (dejar sin cajón)</option>']
      .concat(others.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`));

    openModal({
      title:"Eliminar cajón",
      sub:`${esc(pen.name)} • ${esc(t)}`,
      body:`<form id="delPenForm" class="grid2">
        <div class="f12"><label>Reasignar animales a</label><select name="dst" ${others.length?'':'disabled'}>${ops.join("")}</select></div>
        <div class="f12 muted">Cerdas asignadas: <b>${esc(sowsN)}</b> • Lotes asignados: <b>${esc(batchesN)}</b></div>
        ${(!others.length && (sowsN||batchesN)) ? `<div class="f12"><span class="tag warn">No hay otro cajón del mismo tipo; se dejarán en Auto.</span></div>` : ``}
        <div class="f12"><span class="tag">Nota</span> Los movimientos de inventario históricos no se borran.</div>
      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn danger" id="doDelPen">Eliminar</button>`,
      onMount: ()=>{
        $("#doDelPen").onclick=()=>{
          const fd=new FormData($("#delPenForm"));
          const dst=(fd.get("dst")||"").toString();

          if(t==="gestacion" || t==="maternidad"){
            (state.sows||[]).forEach(s=>{ if(String(s.penId||"")===String(penId||"")) s.penId = dst; });
          }
          if(t==="maternidad" || t==="engorde"){
            (state.batches||[]).forEach(b=>{ if(String(b.penId||"")===String(penId||"")) b.penId = dst; });
          }
          if(t==="engorde"){
            const mb = getManualBatchForPen(penId);
            if(mb){
              if(dst){ mb.penId = dst; mb.manualPenId = dst; }
              else{ state.batches = (state.batches||[]).filter(x=>x.id!==mb.id); }
            }
          }

          state.pens = (state.pens||[]).filter(p=>p.id!==penId);
          save(); dlg.close(); toast("ok","Eliminado","Cajón eliminado.");

          // Re-enfocar vista
          if(current==="cerdas"){
            sowsPenId = dst || firstPenIdByType("gestacion") || (state.pens||[])[0]?.id || "";
          }
          if(current==="engorde"){
            engPenId = dst || firstPenIdByType("engorde") || (state.pens||[])[0]?.id || "";
          }

          render();
        };
      }
    });
  }


  function openMoveToPen(kind, id, opts={}){
    const title = kind==="sow" ? "Mover cerda de cajón" : (kind==="batch" ? "Mover lechones de cajón" : "Mover madre + lechones");

    const sowId = kind==="sow" ? id : (kind==="pair" ? (opts.sowId||"") : (get.batch(id)?.sowId||""));
    const batchId = kind==="batch" ? id : (kind==="pair" ? (opts.batchId||"") : "");
    const sow = sowId ? get.sow(sowId) : null;
    const batch = batchId ? get.batch(batchId) : null;

    const allow = (p)=>{
      if(kind==="sow") return penAcceptsSow(p);
      if(kind==="batch") return penAcceptsBatch(p);
      return penAcceptsSow(p) && penAcceptsBatch(p) && String(p.type||"").toLowerCase()==="maternidad";
    };
    const pens = (state.pens||[]).filter(allow);
    const cur = kind==="sow" ? String(sow?.penId||"") : (kind==="batch" ? String(batch?.penId||"") : effectiveMaternityPenId(sow,batch));
    const ops = pens.map(p=>`<option value="${p.id}" ${p.id===cur?"selected":""}>${esc(p.name)} • ${esc(p.type)}</option>`).join("");

    openModal({
      title,
      sub:"Selecciona el cajón destino.",
      body:`<form id="mvPenForm" class="grid2"><div class="f12"><label>Cajón</label><select name="penId" required>${ops}</select></div></form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="okMv">Mover</button>`,
      onMount: ()=>{
        $("#okMv").onclick=()=>{
          const fd=new FormData($("#mvPenForm"));
          const penId=(fd.get("penId")||"").toString();
          if(!penId){ toast("bad","Falta cajón","Selecciona un cajón."); return; }
          if(kind==="sow"){
            const s=get.sow(id); if(!s) return; s.penId=penId;
          }else if(kind==="batch"){
            const b=get.batch(id); if(!b) return; b.penId=penId;
            // Si existen cerdos individualizados del lote, muévelos también
            try{
              (state.animals||[]).forEach(a=>{
                if(!isAnimalActive(a)) return;
                if(String(a.batchId||"")===String(id||"")) a.penId = penId;
              });
            }catch(e){}
          }else{
            const b=get.batch(batchId); if(b) b.penId=penId;
          }
          save(); dlg.close(); toast("ok","Movido","Actualizado."); render();
        };
      }
    });
  }

  function openWeanToEngorde(sowId, batchId){
    const sow=get.sow(sowId); const batch=get.batch(batchId);
    if(!batch) return;
    const pens=(state.pens||[]).filter(p=>String(p.type||"").toLowerCase()==="engorde" && penAcceptsBatch(p));
    const def = effectiveEngordePenId(batch);
    const ops = pens.map(p=>`<option value="${p.id}" ${p.id===def?"selected":""}>${esc(p.name)}</option>`).join("");
    openModal({
      title:"Pasar lechones a engorde",
      sub:"Marca el destete y ubica el lote en un cajón de engorde.",
      body:`<form id="weanForm" class="grid2">
        <div class="f6"><label>Fecha destete</label><input type="date" name="weaningDate" value="${esc(today())}" /></div>
        <div class="f6"><label>Cajón de engorde</label><select name="penId">${ops}</select></div>
        <div class="f12"><div class="muted">Cerda: <b>${esc(sow?.tag||sow?.name||"—")}</b> • Lote: <b>${esc(batch.id.slice(-8))}</b></div></div>
      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="okWean">Confirmar</button>`,
      onMount: ()=>{
        $("#okWean").onclick=()=>{
          const fd=new FormData($("#weanForm"));
          const d=(fd.get("weaningDate")||"").toString() || today();
          const penId=(fd.get("penId")||"").toString();
          batch.weaningDate=d;
          if(penId) batch.penId=penId;

          // marcar tarea de destete como hecha (si existe)
          const sowTag = get.sow(sowId)?.tag||"cerda";
          let t=state.tasks.find(x=>x.relatedType==="batch" && x.relatedId===batch.id && (x.title||"").toLowerCase().includes("destete"));
          if(t){
            const wd = String(d).slice(0,10);
            t.status = "hecha";
            t.title = `Destete registrado — ${sowTag}`;
            t.dueDate = wd;
            t.notes = `Destete registrado el ${wd}.`;
          }

          save(); dlg.close(); toast("ok","Listo","Lote enviado a engorde."); render();
        };
      }
    });
  }

  function renderSows(){
    const closedBr = new Set((state.farrowings||[]).map(f=>f.breedingId).filter(Boolean));

    const pens = (state.pens||[]).slice();
    if(sowsPenId && !pens.some(p=>p.id===sowsPenId)) sowsPenId = "";

    const gestSows = [];
    const maternityPairs = [];
    const engBatches = [];

    (state.sows||[]).forEach(s=>{
      if(!matchQ(s.tag,s.name,s.breed,s.status,s.notes)) return;
      const lactBatch = activeLactationBatchForSow(s.id);
      if(lactBatch){
        const pid = effectiveMaternityPenId(s, lactBatch);
        maternityPairs.push({sow:s, batch:lactBatch, penId:pid});
        return;
      }
      const last = lastBreedingForSow(s.id);
      const preg = !!(last && !closedBr.has(last.id));
      const due = preg ? (last.expectedFarrowing||"") : "";
      const inD = due ? daysBetween(today(), due) : null;
      const pid = effectiveGestationPenId(s);
      gestSows.push({sow:s, penId:pid, preg, due, inD, inv:invested.sow(s.id)});
    });

    (state.batches||[]).forEach(b=>{
      if(!isGrowoutBatch(b)) return;
      if(!matchQ(b.id,b.birthDate,b.weaningDate,b.status,b.notes, get.sow(b.sowId)?.tag, get.sow(b.sowId)?.name)) return;
      const pid = effectiveEngordePenId(b);
      engBatches.push({batch:b, penId:pid, inv:invested.batch(b.id)});
    });

    const usage = new Map();
    pens.forEach(p=>usage.set(p.id,{items:0,heads:0}));
    gestSows.forEach(x=>{
      if(!usage.has(x.penId)) usage.set(x.penId,{items:0,heads:0});
      const u=usage.get(x.penId); u.items+=1; u.heads+=1;
    });
    maternityPairs.forEach(x=>{
      if(!usage.has(x.penId)) usage.set(x.penId,{items:0,heads:0});
      const u=usage.get(x.penId); u.items+=1; u.heads+=1;
    });
    engBatches.forEach(x=>{
      if(!usage.has(x.penId)) usage.set(x.penId,{items:0,heads:0});
      const u=usage.get(x.penId); u.items+=1; u.heads += Math.max(0,num(x.batch.countCurrent));
    });

    const penBtns = pens.map(p=>{
      const u = usage.get(p.id) || {items:0,heads:0};
      const t = String(p.type||"").toLowerCase();
      const cap = (p.capacity!=null && num(p.capacity)>0) ? Math.max(0, Math.floor(num(p.capacity))) : 0;
      const label = t==="engorde" ? "cabezas" : (t==="maternidad" ? "madres" : "cerdas");
      const extra = (t==="engorde") ? 0 : Math.max(0, Math.floor(num(p.initialCount||0)));
      const used = u.heads + extra;
      const badge = cap ? `${fmtNum(used,0)}/${fmtNum(cap,0)} ${label}` : `${fmtNum(used,0)} ${label}`;
      const active = p.id===sowsPenId;
      return `<button class="btn ${active?"primary":""}" data-pen="${p.id}">${esc(p.name)} <span class="tag info">${badge}</span></button>`;
    }).join("");

    const selPen = getPen(sowsPenId);
    const selType = String(selPen?.type||"").toLowerCase();
    const hasSelectedPen = !!selPen;

    const selExtra = (selType==="engorde") ? 0 : Math.max(0, Math.floor(num(selPen?.initialCount||0)));
    const penDatesNote = (selPen?.entryDate || selPen?.estimatedExitDate)
      ? `<div class="muted" style="margin-top:6px">${selPen?.entryDate ? `Entrada: <b>${esc(selPen.entryDate)}</b>` : ``}${(selPen?.entryDate && selPen?.estimatedExitDate) ? ` &nbsp;•&nbsp; ` : ``}${selPen?.estimatedExitDate ? `Salida estimada: <b>${esc(selPen.estimatedExitDate)}</b>` : ``}</div>`
      : "";
    const extraNote = `${selExtra ? `<div class="muted" style="margin-top:6px">Adicionales no registrados en este cajón: <b>${fmtNum(selExtra,0)}</b></div>` : ""}${penDatesNote}`;

    let table = "";

    if(selType==="maternidad"){
      const rows = maternityPairs
        .filter(x=>x.penId===sowsPenId)
        .sort((a,b)=>(b.batch.birthDate||"").localeCompare(a.batch.birthDate||""))
        .map(x=>{
          const sow=x.sow, b=x.batch;
          const age = b.birthDate ? daysBetween(b.birthDate, today()) : null;
          return `<tr>
            <td>${esc(sow.tag||sow.name||"—")}<div class="muted">${esc(sow.breed||"")} • ${esc(sow.status||"")}</div></td>
            <td class="mono">${esc(b.birthDate||"—")}</td>
            <td class="mono">${b.weaningDate?esc(b.weaningDate):'—<div class="muted">Sin registrar</div>'}</td>
            <td class="mono">${esc(b.countCurrent||0)}</td>
            <td class="mono">${age==null?"—":esc(age+" días")}</td>
            <td>
              <button class="btn" data-act="detailSow" data-id="${sow.id}">Cerda</button>
              <button class="btn" data-act="editBatch" data-id="${b.id}">Camada</button>
              <button class="btn" data-act="supplyBatch" data-id="${b.id}">Suministrar</button>
              <button class="btn primary" data-act="wean" data-sow="${sow.id}" data-batch="${b.id}">A engorde</button>
              <button class="btn" data-act="movePair" data-sow="${sow.id}" data-batch="${b.id}">Mover cajón</button>
            </td>
          </tr>`;
        }).join("");

      table = `<div class="wrap"><table>
        <thead><tr><th>Madre</th><th>Nac.</th><th>Destete</th><th>Lechones</th><th>Edad</th><th>Acciones</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="muted">Sin madres con lechones en este cajón.</td></tr>`}</tbody>
      </table></div>`;

    } else if(selType==="engorde"){
      const penAnimals = animalsInPen(sowsPenId)
        .filter(a=>isAnimalActive(a))
        .slice()
        .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));

      const animalRows = penAnimals.map((a, idx)=>{
        const w = Math.max(0, num(a.weightKg));
        const inDate = a.createdAt ? String(a.createdAt).slice(0,10) : "";
        const age = inDate ? daysBetween(inDate, today()) : null;
        const cost = animalCost(a.id);
        return `<tr>
          <td class="mono">CERDO ${idx+1}</td>
          <td><b>${esc(a.name || ("Cerdo " + (idx+1)))}</b><div class="muted mono">${esc(String(a.id||"").slice(-8))}</div></td>
          <td class="mono">${esc(inDate||"—")}</td>
          <td class="mono">${age==null?"—":esc(age+" días")}</td>
          <td class="mono">${w?fmtNum(w,1)+" kg":"—"}</td>
          <td class="mono">${cost?fmtCOP(cost):"—"}</td>
          <td>
            <button class="btn" data-act="viewAnimal" data-id="${a.id}">Ver</button>
            <button class="btn" data-act="weightAnimal" data-id="${a.id}">Peso</button>
            <button class="btn" data-act="supplyAnimal" data-id="${a.id}">Suministrar</button>
            <button class="btn" data-act="moveAnimal" data-id="${a.id}">Mover cajón</button>
          </td>
        </tr>`;
      }).join("");

      const rows = engBatches
        .filter(x=>x.penId===sowsPenId)
        .sort((a,b)=>(b.batch.weaningDate||b.batch.birthDate||"").localeCompare(a.batch.weaningDate||a.batch.birthDate||""))
        .map(x=>{
          const b=x.batch; const sow=get.sow(b.sowId);
          const days = (b.weaningDate ? daysBetween(b.weaningDate, today()) : null);
          return `<tr>
            <td class="mono">${esc(b.id.slice(-8))}</td>
            <td>${esc(sow?.tag||sow?.name||"—")}</td>
            <td class="mono">${esc(b.birthDate||"—")}</td>
            <td class="mono">${esc(b.weaningDate||"—")}${days==null?"":`<div class="muted">${esc(days)} días post-destete</div>`}</td>
            <td class="mono">${esc(b.countCurrent||0)}</td>
            <td class="mono">${x.inv?fmtCOP(x.inv):"—"}</td>
            <td>
              <button class="btn" data-act="editBatch" data-id="${b.id}">Editar</button>
              <button class="btn" data-act="supplyBatch" data-id="${b.id}">Suministrar</button>
              <button class="btn primary" data-act="sellBatch" data-id="${b.id}">Vender</button>
              <button class="btn" data-act="moveBatch" data-id="${b.id}">Mover cajón</button>
            </td>
          </tr>`;
        }).join("");

      table = `<div class="wrap"><table>
        <thead><tr><th>Registro</th><th>Detalle</th><th>Ingreso</th><th>Edad</th><th>Peso/Stock</th><th>Inversión</th><th>Acciones</th></tr></thead>
        <tbody>${(animalRows || rows) ? (animalRows + rows) : `<tr><td colspan="7" class="muted">Sin lechones en engorde en este cajón.</td></tr>`}</tbody>
      </table></div>`;

    } else {
      const rows = gestSows
        .filter(x=>x.penId===sowsPenId)
        .sort((a,b)=>(a.sow.tag||"").localeCompare(b.sow.tag||""))
        .map(x=>{
          const s=x.sow;
          return `<tr>
            <td class="mono">${esc(s.tag||"—")}<div class="muted">${esc(s.name||"")}</div></td>
            <td>${esc(s.breed||"—")}<div class="muted">${esc(s.status||"activa")}</div></td>
            <td>${x.preg?`<span class="tag warn">Preñada</span>`:`<span class="tag">—</span>`}</td>
            <td class="mono">${x.preg?`${esc(x.due)} (${x.inD} días)`:"—"}</td>
            <td class="mono">${x.inv?fmtCOP(x.inv):"—"}</td>
            <td>
              <button class="btn" data-act="detailSow" data-id="${s.id}">Ver</button>
              <button class="btn" data-act="editSow" data-id="${s.id}">Editar</button>
              <button class="btn" data-act="moveSow" data-id="${s.id}">Mover cajón</button>
              <button class="btn danger" data-act="delSow" data-id="${s.id}">Eliminar</button>
            </td>
          </tr>`;
        }).join("");

      table = `<div class="wrap"><table>
        <thead><tr><th>Identificación</th><th>Raza/Estado</th><th>Gestación</th><th>Parto est.</th><th>Inversión</th><th>Acciones</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="muted">Sin cerdas en este cajón.</td></tr>`}</tbody>
      </table></div>`;
    }

    const selectedCard = hasSelectedPen
      ? `<div class="card" style="margin-top:12px">
           <div class="cardHd engSelectedHd">
             <div>
               <b>${esc(selPen?.name||"Cajón")}</b>
               <div class="muted" style="margin-top:4px">Tipo: <b>${esc(selPen?.type||"—")}</b></div>
               ${extraNote}
             </div>
             <div class="miniRow" style="gap:8px;align-items:center">
               <button class="btn" data-sows-close="1" aria-label="Cerrar tabla">✕</button>
             </div>
           </div>
           <div style="margin-top:10px">${table}</div>
         </div>`
      : `<div class="card" style="margin-top:12px"><div class="cardHd"><b>Detalle del cajón</b></div><div class="wrap"><div class="muted">Presiona un cajón para ver su tabla. Cuando quieras ocultarla, usa la <b>X</b>.</div></div></div>`;

    view.innerHTML = shell(
      "Cerdas",
      "Organiza por cajones: gestación (cerdas), maternidad (madre+lechones) y engorde (lechones).",
      `<button class="btn primary" id="add"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-plus" xlink:href="#i-plus"></use></svg><span>Nueva cerda</span></button>
       <button class="btn" id="penAdd"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-plus" xlink:href="#i-plus"></use></svg><span>Nuevo cajón</span></button>
       <button class="btn" id="penEdit" ${hasSelectedPen?"":"disabled"}>Editar cajón</button>
       <button class="btn danger" id="penDel" ${hasSelectedPen?"":"disabled"}>Eliminar cajón</button>
       <button class="btn" id="sowSupply">Suministrar cerda</button>
       ${selType==="engorde" && hasSelectedPen ? '<button class="btn" id="penSupply">Suministrar cajón</button>' : ""}
       <button class="btn" id="svc"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-dna" xlink:href="#i-dna"></use></svg><span>Registrar servicio</span></button>`,
      `<div class="miniRow" style="flex-wrap:wrap;gap:8px">${penBtns}</div>
       ${selectedCard}`
    );

    $("#add").onclick=()=>openSow();
    const sp=$("#sowSupply"); if(sp) sp.onclick=()=>openSupplySowPicker();
    const ps=$("#penSupply"); if(ps) ps.onclick=()=>openSupplyFor("engorde", sowsPenId);
    $("#svc").onclick=()=>openBreeding();
    const pa=$("#penAdd"); if(pa) pa.onclick=()=>openPen();
    const pe=$("#penEdit"); if(pe) pe.onclick=()=>{ if(sowsPenId) openEditPen(sowsPenId); };
    const pd=$("#penDel"); if(pd) pd.onclick=()=>{ if(sowsPenId) deletePen(sowsPenId); };

    view.onclick = (e)=>{
      const penBtn = e.target.closest("button[data-pen]");
      if(penBtn){
        const nextPen = penBtn.dataset.pen || "";
        sowsPenId = (sowsPenId===nextPen) ? "" : nextPen;
        renderSows();
        return;
      }

      const closeBtn = e.target.closest("button[data-sows-close]");
      if(closeBtn){
        sowsPenId = "";
        renderSows();
        return;
      }

      const b=e.target.closest("button[data-act]"); if(!b) return;
      const act=b.dataset.act;
      if(act==="editSow") return openSow(b.dataset.id);
      if(act==="detailSow") return sowDetail(b.dataset.id);
      if(act==="delSow") return delSow(b.dataset.id);
      if(act==="moveSow") return openMoveToPen('sow', b.dataset.id);

      if(act==="editBatch") return openBatch(b.dataset.id);
      if(act==="sellBatch") return openSale(null,{batchId:b.dataset.id});
      if(act==="supplyBatch") return openSupplyFor('batch', b.dataset.id);
      if(act==="moveBatch") return openMoveToPen('batch', b.dataset.id);

      if(act==="gotoEngPen"){ engPenId = b.dataset.id; goTab("engorde"); return; }
      if(act==="supplyEngPen") return openSupplyFor('engorde', b.dataset.id);
      if(act==="viewAnimal") return openAnimalModal(b.dataset.id);
      if(act==="weightAnimal") return openAnimalWeight(b.dataset.id);
      if(act==="supplyAnimal") return openSupplyFor('animal', b.dataset.id);
      if(act==="moveAnimal") return openMoveAnimal(b.dataset.id);

      if(act==="movePair") return openMoveToPen('pair', '', {sowId:b.dataset.sow, batchId:b.dataset.batch});
      if(act==="wean") return openWeanToEngorde(b.dataset.sow, b.dataset.batch);
    };
  }

  function sowForm(s){
    s = s || {tag:"",name:"",breed:"",dob:"",status:"activa",notes:""};
    return `<form id="sowForm" class="grid2">
      <div class="f3"><label>Arete/Tag *</label><input name="tag" required value="${esc(s.tag)}" placeholder="Ej: C-021"/></div>
      <div class="f3"><label>Nombre</label><input name="name" value="${esc(s.name)}"/></div>
      <div class="f3"><label>Raza</label><input name="breed" value="${esc(s.breed)}"/></div>
      <div class="f3"><label>Nacimiento</label><input type="date" name="dob" value="${esc(s.dob)}"/></div>
      <div class="f4"><label>Estado</label><select name="status">${["activa","seca","lactante","vendida","descartada","muerta"].map(x=>`<option ${s.status===x?"selected":""} value="${x}">${x}</option>`).join("")}</select></div>
      <div class="f4"><label>Cajón</label><select name="penId"><option value="">Auto (según etapa)</option>${(state.pens||[]).filter(p=>penAcceptsSow(p)).map(p=>`<option value="${p.id}" ${s.penId===p.id?"selected":""}>${esc(p.name)} • ${esc(p.type)}</option>`).join("")}</select></div>
      <div class="f12"><label>Notas</label><textarea name="notes">${esc(s.notes)}</textarea></div>
    </form>
`;
  }

  function openSow(id){
    const s=id?get.sow(id):null;
    openModal({
      title: id?"Editar cerda":"Nueva cerda",
      sub:"Crea el registro base para reproducción y camadas.",
      body: sowForm(s),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{ $("#save").onclick=()=>saveSow(id); }
    });
  }

  function saveSow(id){
    const f=$("#sowForm"); const fd=new FormData(f);
    const tag=(fd.get("tag")||"").toString().trim();
    if(!tag){ toast("bad","Falta Tag","El Tag es obligatorio."); return; }
    const dup=state.sows.find(x=>x.tag?.toLowerCase()===tag.toLowerCase() && x.id!==id);
    if(dup){ toast("bad","Duplicado","Ya existe ese Tag."); return; }
    const payload={
      id:id||uid("sow"), tag,
      name:(fd.get("name")||"").toString().trim(),
      breed:(fd.get("breed")||"").toString().trim(),
      dob:(fd.get("dob")||"").toString(),
      status:(fd.get("status")||"activa").toString(),
      notes:(fd.get("notes")||"").toString().trim(),
      penId:(fd.get("penId")||"").toString()
    };
    if(id) state.sows=state.sows.map(x=>x.id===id?payload:x);
    else state.sows.push(payload);
    save(); dlg.close(); toast("ok","Guardado","Cerda guardada."); render();
  }

  function sowDetail(id){
    const s=get.sow(id); if(!s) return;
    const br=state.breedings.filter(b=>b.sowId===id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,10);
    const fa=state.farrowings.filter(f=>f.sowId===id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,10);
    const ba=state.batches.filter(b=>b.sowId===id).sort((a,b)=>(b.birthDate||"").localeCompare(a.birthDate||"")).slice(0,10);
    openModal({
      title:`Cerda: ${s.tag||s.name||"—"}`,
      sub:"Historial rápido",
      body:`<div class="grid">
        <div class="card"><div class="bd">
          <div class="row"><div><div class="muted">Tag</div><b class="mono">${esc(s.tag||"—")}</b><div class="muted">${esc(s.name||"")}</div></div>
          <div><div class="muted">Raza/Estado</div><b>${esc(s.breed||"—")}</b><div class="muted">${esc(s.status||"activa")}</div></div>
          <div><div class="muted">Notas</div><div class="muted">${esc(s.notes||"—")}</div></div></div>
        </div></div>
        ${supplyHistoryHTML("sow", id)}
        ${profitHistoryHTML("sow", id)}

  function delSow(id){
    const s=get.sow(id); if(!s) return;
    openModal({
      title:"Eliminar cerda",
      sub:"Puedes mantener historial o purgar todo.",
      body:`<div class="muted">Eliminar: <b>${esc(s.tag||s.name||"—")}</b></div>
      <div style="margin-top:10px">
        <label>Modo</label>
        <select id="delMode">
          <option value="keep">Mantener historial (recomendado)</option>
          <option value="purge">Borrar TODO asociado</option>
        </select>
      </div>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn danger" id="okDel">Eliminar</button>`,
      onMount: ()=>{
        $("#okDel").onclick=()=>{
          const mode=$("#delMode").value;
          state.sows=state.sows.filter(x=>x.id!==id);
          if(mode==="purge"){
            const brIds=new Set(state.breedings.filter(b=>b.sowId===id).map(b=>b.id));
            state.breedings=state.breedings.filter(b=>b.sowId!==id);
            state.farrowings=state.farrowings.filter(f=>f.sowId!==id);
            const batchIds=new Set(state.batches.filter(b=>b.sowId===id).map(b=>b.id));
            state.batches=state.batches.filter(b=>b.sowId!==id);
            state.sales=state.sales.filter(s=>!batchIds.has(s.batchId));
            const saleIds=new Set(state.sales.map(s=>s.id));
            state.payments=state.payments.filter(p=>saleIds.has(p.saleId));
            state.tasks=state.tasks.filter(t=>!(t.relatedType==="breeding"&&brIds.has(t.relatedId)));
          } else {
            state.breedings.forEach(b=>{ if(b.sowId===id) b.sowId=""; });
            state.farrowings.forEach(f=>{ if(f.sowId===id) f.sowId=""; });
            state.batches.forEach(b=>{ if(b.sowId===id) b.sowId=""; });
          }
          save(); dlg.close(); toast("ok","Eliminado","Cerda eliminada."); render();
        };
      }
    });
  }

  function breedingForm(b,preset={}){
    if(!state.sows.length) return `<div class="muted">Primero crea una cerda.</div>`;
    b=b||{sowId:preset.sowId||"",date:today(),method:"inseminación",expectedFarrowing:"",notes:""};
    if(!b.expectedFarrowing && b.date) b.expectedFarrowing=addDays(b.date, num(state.settings.gestationDays)||114);
    const baseMethods=["inseminación","monta","otro"];
    let methods=(state.settings?.serviceMethods||[]).slice().map(x=>String(x??"").trim()).filter(Boolean);
    if(!methods.length) methods = baseMethods.slice();
    baseMethods.forEach(x=>{ if(!methods.some(m=>m.toLowerCase()===x.toLowerCase())) methods.push(x); });
    if(b.method && !methods.some(m=>m.toLowerCase()===String(b.method).toLowerCase())) methods.push(String(b.method));

    const sowOps = state.sows.slice().sort((a,b)=>(a.tag||"").localeCompare(b.tag||""))
      .map(s=>`<option value="${s.id}" ${b.sowId===s.id?"selected":""}>${esc(s.tag||s.name||"—")}${s.name?` — ${esc(s.name)}`:""}</option>`).join("");
    return `<form id="breedingForm" class="grid2">
      <div class="f6"><label>Cerda *</label><select name="sowId" required><option value="">Selecciona</option>${sowOps}</select></div>
      <div class="f3"><label>Fecha servicio *</label><input type="date" name="date" required value="${esc(b.date)}"/></div>
      <div class="f3">
        <label>Método</label>
        <select name="method" id="breedingMethod">
          ${methods.map(x=>`<option ${String(b.method||"").toLowerCase()===String(x).toLowerCase()?"selected":""} value="${x}">${x}</option>`).join("")}
        </select>
        <div class="miniRow">
          <input type="text" id="breedingNewMethod" placeholder="Nuevo método…" />
          <button type="button" class="btn" id="breedingAddMethod">Agregar</button>
        </div>
        <div class="muted" style="margin-top:6px">Si es un método nuevo, escríbelo y presiona <b>Agregar</b>.</div>
      </div>
      <div class="f4"><label>Parto estimado</label><input type="date" name="expectedFarrowing" value="${esc(b.expectedFarrowing)}"/></div>
      <div class="f12"><label>Notas</label><textarea name="notes">${esc(b.notes)}</textarea></div>
    </form>
`;

  function openBreeding(id,preset={}){
    if(!state.sows.length){ toast("warn","Sin cerdas","Primero crea una cerda."); openSow(); return; }
    const b=id?get.breeding(id):null;
    openModal({
      title: id?"Editar servicio":"Registrar servicio",
      sub:"Crea una gestación y calcula fecha de parto estimada.",
      body: breedingForm(b,preset),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const f=$("#breedingForm");
        const date=f.querySelector('input[name="date"]');
        const due=f.querySelector('input[name="expectedFarrowing"]');
        date.onchange=()=>{ if(date.value) due.value=addDays(date.value, num(state.settings.gestationDays)||114); };
        // Permitir agregar nuevos métodos de servicio
        const sel = f.querySelector("#breedingMethod");
        const newI = f.querySelector("#breedingNewMethod");
        const addB = f.querySelector("#breedingAddMethod");
        const base = ["inseminación","monta","otro"];
        const refreshMethods = (selected)=>{
          state.settings = state.settings || defaults().settings;
          let arr = (state.settings.serviceMethods || []).map(x=>String(x??"").trim()).filter(Boolean);
          const uniq=[];
          [...arr, ...base].forEach(x=>{
            const k=x.toLowerCase();
            if(!uniq.some(u=>u.toLowerCase()===k)) uniq.push(x);
          });
          state.settings.serviceMethods = uniq;
          if(sel){
            sel.innerHTML = uniq.map(x=>`<option value="${x}">${x}</option>`).join("");
            if(selected) sel.value = selected;
          }
        };
        refreshMethods(sel?.value || "");
        if(addB && newI && sel){
          addB.onclick=()=>{
            const v = (newI.value||"").trim();
            if(!v){ openAlert({title:"Faltan datos", message:"Escribe el nombre del nuevo método/servicio.", kind:"bad"}); return; }
            // agregar (sin duplicados)
            state.settings.serviceMethods = state.settings.serviceMethods || [];
            if(!state.settings.serviceMethods.some(x=>String(x).toLowerCase()===v.toLowerCase())){
              state.settings.serviceMethods.push(v);
            }
            refreshMethods(v);
            sel.value = v;
            newI.value = "";
            save();
            toast("ok","Agregado",`Método: ${v}`);
          };
          newI.addEventListener("keydown",(e)=>{
            if(e.key==="Enter"){ e.preventDefault(); addB.click(); }
          });
        }

        $("#save").onclick=()=>saveBreeding(id);
      }
    });
  }

  function saveBreeding(id){
    const f=$("#breedingForm"); const fd=new FormData(f);
    const sowId=(fd.get("sowId")||"").toString();
    const date=(fd.get("date")||"").toString();
    if(!sowId||!date){ toast("bad","Faltan datos","Cerda y fecha son obligatorios."); return; }
    const payload={
      id:id||uid("brd"),
      sowId, date,
      method:(fd.get("method")||"inseminación").toString(),
      expectedFarrowing:(fd.get("expectedFarrowing")||"").toString()||addDays(date,num(state.settings.gestationDays)||114),
      notes:(fd.get("notes")||"").toString().trim()
    };
    if(id) state.breedings=state.breedings.map(x=>x.id===id?payload:x);
    else {
      state.breedings.push(payload);
      // task sugerida chequeo preñez
      state.tasks.push({id:uid("tsk"),title:`Chequeo preñez — ${get.sow(sowId)?.tag||"cerda"}`,dueDate:addDays(date,25),priority:"media",status:"pendiente",relatedType:"breeding",relatedId:payload.id,notes:"Sugerido 21–28 días."});
    }
    save(); dlg.close(); toast("ok","Guardado","Servicio guardado."); render();
  }

  function delBreeding(id){
    const b=get.breeding(id); if(!b) return;
    const has=state.farrowings.some(f=>f.breedingId===id);
    if(has){ toast("bad","No permitido","Este servicio ya tiene parto."); return; }
    state.breedings=state.breedings.filter(x=>x.id!==id);
    state.tasks=state.tasks.filter(t=>!(t.relatedType==="breeding"&&t.relatedId===id));
    save(); toast("ok","Eliminado","Servicio eliminado."); render();
  }

      </table></div>`

    $("#manual").onclick=()=>openBatch();

    view.onclick=(e)=>{
      const b=e.target.closest("button[data-act]"); if(!b) return;
      const id=b.dataset.id, act=b.dataset.act;

  function openFarrowing(id,preset={}){
    if(!state.sows.length){ toast("warn","Sin cerdas","Primero crea una cerda."); openSow(); return; }
    const f=id?state.farrowings.find(x=>x.id===id):null;
    openModal({
      title:id?"Editar parto":"Registrar parto",
      sub:"Se crea o actualiza el lote/camada automáticamente.",
      body:farrowingForm(f,preset),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const sel=$("#ffBr"), sow=$("#ffSow");
        sel.onchange=()=>{ const br=get.breeding(sel.value); if(br && br.sowId) sow.value=br.sowId; };

        // Sugerencia de destete (no automática)
        const form = $("#farForm");
        const dateI = form ? form.querySelector('input[name="date"]') : null;
        const weanI = form ? form.querySelector('input[name="weaningDate"]') : null;
        const sug = $("#ffWeanSug");
        const use = $("#ffWeanUse");
        const refreshSug = ()=>{
          const s = (dateI && dateI.value) ? addDays(dateI.value, 21) : "";
          if(sug) sug.textContent = s || "";
        };
        if(dateI) dateI.addEventListener("change", refreshSug);
        if(use && weanI) use.onclick=()=>{ const s=(dateI && dateI.value)?addDays(dateI.value,21):""; if(s) weanI.value=s; };
        refreshSug();

        $("#save").onclick=()=>saveFarrowing(id);
      }
    });
  }


  function saveFarrowing(id){
    const f=$("#farForm"); const fd=new FormData(f);
    const sowId=(fd.get("sowId")||"").toString();
    const date=(fd.get("date")||"").toString();
    const penId=(fd.get("penId")||"").toString();
    const weaningDate=(fd.get("weaningDate")||"").toString(); // puede ir vacío (se registra cuando ocurra)
    if(!sowId||!date){ toast("bad","Faltan datos","Cerda y fecha son obligatorios."); return; }

    const breedingId=(fd.get("breedingId")||"").toString();
    if(breedingId){
      const dup=state.farrowings.find(x=>x.breedingId===breedingId && x.id!==id);
      if(dup){ toast("bad","Duplicado","Ese servicio ya tiene parto."); return; }
    }

    const payload={
      id:id||uid("far"),
      breedingId:breedingId||"",
      sowId, date,
      bornTotal:num(fd.get("bornTotal")),
      bornAlive:num(fd.get("bornAlive")),
      stillborn:num(fd.get("stillborn")),
      mummified:num(fd.get("mummified")),
      notes:(fd.get("notes")||"").toString().trim()
    };
    if(id) state.farrowings=state.farrowings.map(x=>x.id===id?payload:x);
    else state.farrowings.push(payload);

    // batch linked
    let batch=state.batches.find(b=>b.farrowingId===payload.id);
    const init=Math.max(0, payload.bornAlive);
    if(!batch){
      batch={
        id:uid("bat"),
        sowId,
        farrowingId:payload.id,
        birthDate:date,
        // Destete real (opcional). Si se deja vacío, NO se asume automáticamente.
        weaningDate: weaningDate || "",
        countInitial:init,
        countCurrent:init,
        status:"disponible",
        penId:(penId || firstPenIdByType("maternidad") || ""),
        notes:""
      };
      state.batches.push(batch);
    } else {
      batch.sowId = sowId;
      batch.birthDate = date;
      batch.weaningDate = weaningDate || ""; // permitir limpiar/corregir
      batch.countInitial = init;
      batch.countCurrent = Math.min(num(batch.countCurrent), init);
    }

    const matPen = penId || firstPenIdByType("maternidad") || "";
    const weaned = batch.weaningDate && (today() >= batch.weaningDate);
    if(!weaned){
      batch.penId = matPen; // mantener en maternidad hasta registrar destete
    } else if(!batch.penId){
      batch.penId = matPen;
    }

    // tarea de destete (sugerida) y cierre automático si ya registraste destete real
    const sowTag = get.sow(sowId)?.tag||"cerda";
    let t=state.tasks.find(x=>x.relatedType==="batch" && x.relatedId===batch.id && (x.title||"").toLowerCase().includes("destete"));
    if(!t){
      t={id:uid("tsk"),title:`Destete sugerido — ${sowTag}`,dueDate:addDays(date,21),priority:"media",status:"pendiente",relatedType:"batch",relatedId:batch.id,notes:"Ajusta la fecha real según tu manejo."};
      state.tasks.push(t);
    } else {
      // actualizar sugerencia si el parto cambió (solo si no está marcada como hecha)
      if((t.status||"pendiente")!=="hecha"){
        t.dueDate = addDays(date,21);
        if(!(t.title||"").toLowerCase().includes("registrado")) t.title = `Destete sugerido — ${sowTag}`;
        if(!t.notes) t.notes = "Ajusta la fecha real según tu manejo.";
      }
    }
    if(batch.weaningDate){
      const wd = String(batch.weaningDate).slice(0,10);
      t.status = "hecha";
      t.title = `Destete registrado — ${sowTag}`;
      t.dueDate = wd;
      t.notes = `Destete registrado el ${wd}.`;
    }

    save(); dlg.close(); toast("ok","Guardado","Parto registrado."); render();
  }

  function openBatch(id, pre={}){
    if(!state.sows.length){ toast("warn","Sin cerdas","Primero crea una cerda."); openSow(); return; }
    const b0=id?get.batch(id):null;
    const mode = (pre&&pre.mode)?pre.mode:"manual";
    const b = b0 || (pre && !id ? Object.assign({id:uid("bat"),sowId:"",birthDate:today(),weaningDate:"",countInitial:"",countCurrent:"",status:"disponible",notes:""}, pre) : null);

    openModal({
      title: id ? "Editar camada" : (mode==="birth" ? "Registrar parto" : "Camada manual"),
      sub: id ? "" : (mode==="birth" ? "Registra un parto creando la camada (mismo formulario de camada manual)." : "Útil si registras lotes sin usar el módulo de parto."),
      body: batchForm(b) + (id ? profitHistoryHTML("batch", id) + supplyHistoryHTML("batch", id) : ""),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const f=$("#batchForm");
        const birth=f.querySelector('input[name="birthDate"]');
        const wean=f.querySelector('input[name="weaningDate"]');
        const sug = $("#batchWeanSug");
        const use = $("#batchWeanUse");
        const refreshSug = ()=>{
          const s = birth.value ? addDays(birth.value,21) : "";
          if(sug) sug.textContent = s || "";
        };
        if(birth) birth.onchange=refreshSug;
        if(use && wean) use.onclick=()=>{ const s = birth.value ? addDays(birth.value,21) : ""; if(s) wean.value = s; };
        refreshSug();
        // Botón dentro del historial de suministros
        dlgBody.querySelectorAll("button[data-supply]").forEach(b=>{
          b.onclick=()=>{ const t=b.dataset.supply; const did=b.dataset.supplyid; dlg.close(); openSupplyFor(t, did); };
        });
        $("#save").onclick=()=>{
          const fd=new FormData(f);
          const sowId=(fd.get("sowId")||"").toString();
          const birthDate=(fd.get("birthDate")||"").toString();
          if(!sowId||!birthDate){ toast("bad","Faltan datos","Cerda y nacimiento son obligatorios."); return; }
          const ci = num(fd.get("countInitial"));
          const ccRaw = (fd.get("countCurrent")||"").toString().trim();
          const cc = ccRaw==="" ? ci : num(ccRaw);

          const payload={
            id:id||uid("bat"),
            sowId, farrowingId:b?.farrowingId||"",
            birthDate,
            weaningDate:(fd.get("weaningDate")||"").toString(),
            countInitial:ci,
            countBornAlive:ci,
            countCurrent:Math.min(cc, ci),
            status:(fd.get("status")||"disponible").toString(),
            penId:(fd.get("penId")||"").toString(),
            notes:(fd.get("notes")||"").toString().trim()
          };
          if(id) state.batches=state.batches.map(x=>x.id===id?payload:x);
          else state.batches.push(payload);

          // Si registraste destete real, marcar la tarea como hecha (si existe)
          if(payload.weaningDate){
            const sowTag = get.sow(payload.sowId)?.tag||"cerda";
            let t=state.tasks.find(x=>x.relatedType==="batch" && x.relatedId===payload.id && (x.title||"").toLowerCase().includes("destete"));
            if(t){
              const wd = String(payload.weaningDate).slice(0,10);
              t.status = "hecha";
              t.title = `Destete registrado — ${sowTag}`;
              t.dueDate = wd;
              t.notes = `Destete registrado el ${wd}.`;
            }
          }

          save(); dlg.close(); toast("ok","Guardado","Camada guardada."); render();
        };
      }
    });

          state.stockMovements.push({id:uid("mov"),itemId:"",type:"ajuste",date:(fd.get("date")||today()).toString(),qty:(type==="mortalidad"?-qty:(after-before)),unitCost:0,linkedType:"batch",linkedId:b.id,notes:`Camada ${type}. ${(fd.get("notes")||"").toString().trim()}`.trim()});
          save(); dlg.close(); toast("ok","Aplicado",`${before} → ${after}`); render();
        };
      }
    });
  }

  function inventoryCategoriesList(currentValue=""){
    const base = ["alimento","medicamento","insumo"];
    const raw = [...base, ...((state.settings && state.settings.inventoryCategories) || [])];
    if(String(currentValue||"").trim()) raw.push(String(currentValue).trim());
    const seen = new Set();
    return raw.map(x=>String(x??"").trim()).filter(Boolean).filter(x=>{
      const k=x.toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function inventoryUnitsList(currentValue=""){
    const base = ["ml","cc","kg","g","l","und","lb","bulto","bolsa"];
    const raw = [...base, ...((state.settings && state.settings.inventoryUnits) || [])];
    if(String(currentValue||"").trim()) raw.push(String(currentValue).trim());
    const seen = new Set();
    return raw.map(x=>String(x??"").trim()).filter(Boolean).filter(x=>{
      const k=x.toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function inventoryUnitLabel(v){
    const s=String(v||"").trim();
    const k=s.toLowerCase();
    const map={ml:"ML",cc:"CC",kg:"KG",g:"G",l:"L",und:"UND",lb:"LB",bulto:"Bulto",bolsa:"Bolsa"};
    return map[k] || s;
  }

  function inventoryOptionMeta(kind){
    const isUnit = kind === "unit";
    return {
      isUnit,
      label: isUnit ? "unidad" : "categoría",
      title: isUnit ? "Gestionar unidades" : "Gestionar categorías",
      base: isUnit ? ["ml","cc","kg","g","l","und","lb","bulto","bolsa"] : ["alimento","medicamento","insumo"],
      list: isUnit ? inventoryUnitsList() : inventoryCategoriesList(),
      custom: ((state.settings && (isUnit ? state.settings.inventoryUnits : state.settings.inventoryCategories)) || []).map(x=>String(x??"").trim()).filter(Boolean),
      labelFn: isUnit ? inventoryUnitLabel : (v)=>String(v||"")
    };
  }

  function inventoryOptionUsage(kind, value){
    const key = kind === "unit" ? "unit" : "category";
    const needle = String(value||"").trim().toLowerCase();
    return (state.inventory||[]).filter(item=>String(item?.[key]||"").trim().toLowerCase()===needle).length;
  }

  function createInventoryOption(kind, value){
    const meta = inventoryOptionMeta(kind);
    const clean = String(value||"").trim();
    if(!clean) return {ok:false, value:""};
    const exists = meta.list.find(x=>x.toLowerCase()===clean.toLowerCase());
    if(exists){
      toast("warn","Ya existe",`La ${meta.label} ya está creada.`);
      return {ok:false, value:exists, exists:true};
    }
    state.settings = state.settings || defaults().settings;
    if(meta.isUnit){
      state.settings.inventoryUnits = [...meta.custom, clean];
      save();
      toast("ok","Unidad creada", inventoryUnitLabel(clean));
    } else {
      state.settings.inventoryCategories = [...meta.custom, clean];
      save();
      toast("ok","Categoría creada", clean);
    }
    return {ok:true, value:clean};
  }

  function deleteInventoryOption(kind, value){
    const meta = inventoryOptionMeta(kind);
    const clean = String(value||"").trim();
    if(!clean) return {ok:false};
    const lower = clean.toLowerCase();
    if(meta.base.some(x=>x.toLowerCase()===lower)){
      toast("warn","Protegida", `La ${meta.label} base no se puede borrar.`);
      return {ok:false, protected:true};
    }
    const usage = inventoryOptionUsage(kind, clean);
    if(usage>0){
      toast("warn","En uso", `No puedes borrar esta ${meta.label} porque ${usage===1?"está usada en 1 insumo":"está usada en "+usage+" insumos"}.`);
      return {ok:false, inUse:true};
    }
    state.settings = state.settings || defaults().settings;
    if(meta.isUnit){
      state.settings.inventoryUnits = meta.custom.filter(x=>x.toLowerCase()!==lower);
      save();
      toast("ok","Unidad borrada", inventoryUnitLabel(clean));
    } else {
      state.settings.inventoryCategories = meta.custom.filter(x=>x.toLowerCase()!==lower);
      save();
      toast("ok","Categoría borrada", clean);
    }
    return {ok:true, value:clean};
  }

  function openInventoryOptionManager(kind, onChange){
    const renderManager = ()=>{
      const meta = inventoryOptionMeta(kind);
      const rows = meta.list.map(opt=>{
        const lower = String(opt||"").trim().toLowerCase();
        const isBase = meta.base.some(x=>x.toLowerCase()===lower);
        const usage = inventoryOptionUsage(kind, opt);
        return `<div class="row" style="gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
          <div style="flex:1;min-width:0">
            <b>${esc(meta.labelFn(opt))}</b>
            <div class="muted" style="font-size:12px;margin-top:2px">${isBase?"Base del sistema":"Personalizada"}${usage?` • En uso: ${usage}`:""}</div>
          </div>
          ${isBase ? `<span class="tag">Base</span>` : `<button type="button" class="btn danger" data-delopt="${esc(opt)}" ${usage ? 'disabled title="En uso"' : ''}>Borrar</button>`}
        </div>`;
      }).join("") || `<div class="muted">Sin opciones registradas.</div>`;

      openMiniModal({
        title: meta.title,
        sub: `Crea o borra ${meta.isUnit?"unidades de medida":"categorías"} del inventario.`,
        body:`<div class="grid2">
          <div class="f12">
            <label>Nueva ${meta.label}</label>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input id="invOptNew" placeholder="Escribe la nueva ${meta.label}" style="flex:1;min-width:220px"/>
              <button type="button" class="btn primary" id="invOptCreate">Crear</button>
            </div>
            <div class="muted" style="margin-top:6px;font-size:12px">Las opciones base no se pueden borrar. Las opciones en uso tampoco.</div>
          </div>
          <div class="f12">
            <div class="card" style="border:none;box-shadow:none;background:var(--panel2)">
              <div class="bd" style="padding:8px 12px;max-height:320px;overflow:auto">${rows}</div>
            </div>
          </div>
        </div>`,
        footer:`<button class="btn" id="aOk">Cerrar</button>`,
        onMount: ()=>{
          const input = $("#invOptNew", dlg2Body);
          const createBtn = $("#invOptCreate", dlg2Body);
          const runCreate = ()=>{
            const result = createInventoryOption(kind, input?.value || "");
            if(!result.ok) return;
            if(typeof onChange === "function") onChange({action:"create", value:result.value});
            renderManager();
          };
          if(createBtn) createBtn.onclick = runCreate;
          if(input) input.onkeydown = (e)=>{ if(e.key === "Enter"){ e.preventDefault(); runCreate(); } };
          dlg2Body.querySelectorAll("button[data-delopt]").forEach(btn=>{
            btn.onclick = ()=>{
              const value = btn.dataset.delopt || "";
              if(!confirm(`¿Borrar ${meta.label} "${value}"?`)) return;
              const result = deleteInventoryOption(kind, value);
              if(!result.ok) return;
              if(typeof onChange === "function") onChange({action:"delete", value:result.value});
              renderManager();
            };
          });
        }
      });
    };
    renderManager();
  }
