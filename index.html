  function openInvMove(itemId, mode, forcedLink){
    const i=get.inv(itemId); if(!i) return;
    openModal({
      title: mode==="entrada"?"Entrada a inventario":"Salida de inventario",
      sub: `${i.name} • ${i.category}`,
      body:`<form id="movForm" class="grid2">
        <div class="f4"><label>Fecha</label><input type="date" name="date" value="${today()}"/></div>
        <div class="f4"><label>Cantidad (${esc(i.unit)})</label><input type="number" step="0.01" name="qty" value="1" min="0"/></div>
        <div class="f4"><label>Costo unit. (opcional)</label><input type="number" step="0.01" name="unitCost" value="${esc(i.unitCost||0)}"/></div>
        ${mode==="entrada"?`
        <div class="f4"><label>Costo total (opcional)</label><input type="number" step="0.01" name="totalCost" value="0" placeholder="Si lo llenas, calcula costo unit."/></div>
        <div class="f4"><label>Estado de pago</label>
          <select name="payStatus" id="payStatus">
            <option value="pagado">Pagado completo</option>
            <option value="credito">Crédito (pendiente)</option>
            <option value="parcial">Parcial (abonos)</option>
          </select>
        </div>
        <div class="f4"><label>Pagado hoy (COP)</label><input type="number" step="0.01" name="paidNow" id="paidNow" value="0"/></div>
        <div class="f4"><label>Método</label>
          <select name="method" id="method">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="f4"><label>Vence (si hay crédito)</label><input type="date" name="dueDate" id="dueDate" value=""/></div>
        `:""}
        <div class="f6"><label>Relacionado con (opcional)</label>
          <select name="linkedType" id="lt">
            <option value="">—</option><option value="sow">Cerda</option><option value="batch">Camada</option>
          </select>
        </div>
        <div class="f6"><label>Seleccionar</label><select name="linkedId" id="lid" disabled><option value="">—</option></select></div>
        <div class="f12"><label>Notas</label><textarea name="notes"></textarea></div>
        ${mode==="entrada"?`<div class="f12"><label style="display:flex;gap:10px;align-items:center;cursor:pointer">
          <input id="asExp" type="checkbox" checked style="width:18px;height:18px"/> Registrar como gasto (cantidad×costo unit.)
        </label></div>`:""}
      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="ok">Aplicar</button>`,
      onMount: ()=>{
        const lt=$("#lt"), lid=$("#lid");
        // Auto cálculo costo unitario cuando se ingresa costo total
        const totalI=$("#movForm input[name=totalCost]");
        const qtyI=$("#movForm input[name=qty]");
        const ucI=$("#movForm input[name=unitCost]");
        const stI=$("#payStatus");
        const paidI=$("#paidNow");
        const dueI=$("#dueDate");
        function clampPaid(){
          const total=num(totalI?.value);
          if(!stI) return;
          if(stI.value==="pagado"){
            if(paidI){ paidI.value=String(Math.max(0,total)); paidI.disabled=true; }
            if(dueI){ dueI.value=""; dueI.disabled=true; }
          } else if(stI.value==="credito"){
            if(paidI){ paidI.value="0"; paidI.disabled=true; }
            if(dueI){ dueI.disabled=false; }
          } else {
            if(paidI){ paidI.disabled=false; const p=num(paidI.value); if(p>total) paidI.value=String(Math.max(0,total)); }
            if(dueI){ dueI.disabled=false; }
          }
        }
        function recalcUC(){
          const q=num(qtyI?.value);
          const total=num(totalI?.value);
          if(total>0 && q>0 && ucI){ ucI.value=String(Math.round((total/q)*100)/100); }
          clampPaid();
        }
        if(totalI) totalI.oninput=recalcUC;
        if(qtyI) qtyI.oninput=recalcUC;
        if(stI) stI.onchange=clampPaid;
        if(paidI) paidI.oninput=clampPaid;
        clampPaid();

        lt.onchange=()=>{
          lid.innerHTML=`<option value="">—</option>`;
          if(!lt.value){ lid.disabled=true; return; }
          lid.disabled=false;
          if(lt.value==="sow"){
            lid.innerHTML+=state.sows.slice().sort((a,b)=>(a.tag||"").localeCompare(b.tag||"")).map(s=>`<option value="${s.id}">${esc(s.tag||s.name||"—")}</option>`).join("");
          } else {
            lid.innerHTML+=state.batches.slice().sort((a,b)=>(b.birthDate||"").localeCompare(a.birthDate||"")).map(b=>`<option value="${b.id}">${esc(b.id.slice(-8))} • ${esc(get.sow(b.sowId)?.tag||"cerda")}</option>`).join("");
          }
        };

        // Si viene forzado (desde cerda/camada), fija y bloquea la selección sin deshabilitar (para que FormData lo capture)
        if(forcedLink && forcedLink.type && forcedLink.id){
          lt.value = forcedLink.type;
          lt.onchange();
          lid.value = forcedLink.id;
          lt.style.pointerEvents = "none";
          lid.style.pointerEvents = "none";
          lt.style.opacity = ".75";
          lid.style.opacity = ".75";
        }

        $("#ok").onclick=()=>{
          const fd=new FormData($("#movForm"));
          const date=(fd.get("date")||today()).toString();
          const qty=num(fd.get("qty"));
          if(qty<=0){ toast("bad","Cantidad inválida","Debe ser > 0."); return; }
          const unitCostIn=num(fd.get("unitCost"));
          let unitCost = unitCostIn || num(i.unitCost) || 0;
          const before=num(i.qty);
          const delta = mode==="entrada" ? qty : -qty;
          let after = before + delta;
          if(mode==="salida" && after < 0){ after=0; toast("warn","Stock insuficiente",`Había ${before} ${i.unit}. Se ajustó a 0.`); }
          i.qty=after; if(mode==="entrada" && unitCostIn) i.unitCost=unitCostIn;

          state.stockMovements.push({
            id:uid("mov"), itemId:i.id, type:mode, date, qty:delta, unitCost,
            linkedType:(fd.get("linkedType")||"").toString(),
            linkedId:(fd.get("linkedId")||"").toString(),
            notes:(fd.get("notes")||"").toString().trim(),
            totalCost:num(fd.get("totalCost")),
            payStatus:(fd.get("payStatus")||"").toString(),
            paidNow:num(fd.get("paidNow")),
            method:(fd.get("method")||"").toString(),
            dueDate:(fd.get("dueDate")||"").toString()
          });

          if(mode==="entrada" && $("#asExp")?.checked){
            const totalCost=num(fd.get("totalCost"));
            const status=(fd.get("payStatus")||"pagado").toString();
            const method=(fd.get("method")||"efectivo").toString();
            const due=(fd.get("dueDate")||"").toString();

            // total de la compra: si hay totalCost úsalo; si no, qty×unitCost
            const total = totalCost>0 ? totalCost : Math.max(0, qty*unitCost);
            if(total>0){
              let paidNow=num(fd.get("paidNow"));
              if(status==="pagado") paidNow = total;
              if(status==="credito") paidNow = 0;
              paidNow = Math.max(0, Math.min(total, paidNow));

              // gasto por lo pagado hoy
              if(paidNow>0){
                state.transactions.push({
                  id:uid("tx"),
                  date,
                  type:"gasto",
                  category:"Inventario / compra",
                  amount: paidNow,
                  method,
                  refType:"inventory",
                  refId:i.id,
                  notes:`Compra: ${i.name}`
                });
              }

              const remain = Math.max(0, total - paidNow);
              if(remain>0){
                state.payables.push({
                  id:uid("pay"),
                  date,
                  category:"Inventario / compra",
                  supplier:i.supplier||"",
                  refType:"inventory",
                  refId:i.id,
                  itemName:i.name,
                  total,
                  paid: paidNow,
                  dueDate: due,
                  method,
                  status:"abierto",
                  notes:`Compra: ${i.name}`
                });
              }
            }
          }

          save(); dlg.close(); toast("ok","Aplicado",`${i.name}: ${before} → ${after} ${i.unit}`); render();
        };
      }
    });
  }

  function openMovs(){
    const rows=state.stockMovements.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,250).map(m=>{
      const item=m.itemId?get.inv(m.itemId):null;

      return `<tr>

  function openSale(id,preset={}){
    if(!state.clients.length){ toast("warn","Sin clientes","Crea un cliente."); openClient(); return; }
    if(!state.batches.some(b=>(b.status||"disponible")!=="cerrado" && num(b.countCurrent)>0)){ toast("warn","Sin camadas","Registra un parto/camada primero."); current="litters"; renderNav(); render(); return; }

    const s=id?get.sale(id):null;
    openModal({
      title:id?"Editar venta":"Nueva venta",
      sub:"Descuenta stock de lechones y gestiona abonos.",
      body:saleForm(s,preset),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const sq=$("#sq"), su=$("#su"), st=$("#st"), ss=$("#ss"), sp=$("#sp");
        const sowSel=$("#saleSow");
        const batchSel=$("#saleBatch");
        const allBatches = state.batches.filter(b=>(b.status||"disponible")!=="cerrado" && num(b.countCurrent)>0);

        const rebuildBatches=(keep="")=>{
          if(!batchSel) return;
          const sowId=(sowSel?.value||"");
          const list = sowId ? allBatches.filter(b=>b.sowId===sowId) : allBatches;
          const ops = list
            .slice()
            .sort((a,b)=>(b.birthDate||"").localeCompare(a.birthDate||""))
            .map(b=>{
              const sow=get.sow(b.sowId);
              return `<option value="${b.id}">${esc(b.birthDate||"—")} • ${esc(sow?.tag||"cerda")} • Disp ${esc(b.countCurrent)}</option>`;
            }).join("");
          batchSel.innerHTML = `<option value="">Selecciona</option>` + ops;
          if(keep && list.some(x=>x.id===keep)) batchSel.value = keep;
        };

        const syncFromBatch=()=>{
          const bb=get.batch(batchSel?.value||"");
          if(bb && sowSel) sowSel.value = bb.sowId||"";
        };

        if(sowSel){
          sowSel.onchange=()=>{
            // al cambiar cerda, resetear camada
            rebuildBatches("");
          };
        }
        if(batchSel){
          batchSel.onchange=()=>{
            syncFromBatch();
            // reconstruir manteniendo la misma camada (por si lista estaba sin filtrar)
            rebuildBatches(batchSel.value);
          };
        }

        // Inicial (si viene con batchId)
        if(batchSel?.value){
          syncFromBatch();
        }
        rebuildBatches(batchSel?.value||"");

        const recalc=()=>{
          const t=Math.max(0,num(sq.value)*num(su.value));
          setMoney(st, t);
          if(ss.value==="pagado") setMoney(sp, t);
          if(ss.value==="credito") setMoney(sp, 0);
          const p=num(sp.value);
          if(p>t) setMoney(sp, t);
        };
        sq.oninput=recalc; su.oninput=recalc; ss.onchange=recalc; sp.oninput=recalc; recalc();

        $("#save").onclick=()=>saveSale(id);
      }
    });
  }

  function saveSale(id){
    const fd=new FormData($("#saleForm"));
    const date=(fd.get("date")||"").toString();
    const clientId=(fd.get("clientId")||"").toString();
    const sowId=(fd.get("sowId")||"").toString();
    const batchId=(fd.get("batchId")||"").toString();
    const qty=num(fd.get("qty"));
    const unitPrice=num(fd.get("unitPrice"));
    const total=Math.max(0, qty*unitPrice);
    let paid=Math.max(0, num(fd.get("paidAmount")));
    let status=(fd.get("status")||"credito").toString();
    if(!date||!clientId||!batchId||qty<=0){ openAlert({title:"Faltan datos", message:"Debes seleccionar fecha, cliente, cerda, camada y cantidad.", kind:"bad"}); return; }
    const batch=get.batch(batchId); if(!batch){ openAlert({title:"Camada inválida", message:"Selecciona una camada válida.", kind:"bad"}); return; }
    const sowIdFinal = sowId || (batch?.sowId||"");
    if(!sowIdFinal){ openAlert({title:"Faltan datos", message:"Debes seleccionar la cerda.", kind:"bad"}); return; }
    if(batch.sowId && sowIdFinal && batch.sowId!==sowIdFinal){ openAlert({title:"Cerda/Camada no coinciden", message:"Selecciona la camada correcta para esa cerda.", kind:"bad"}); return; }

    if(!id){
      const available=num(batch.countCurrent);
      if(qty>available){ toast("bad","Stock insuficiente",`Disponible ${available}.`); return; }
    } else {
      const old=get.sale(id);
      if(old && (old.batchId!==batchId || old.qty!==qty)){ toast("warn","Restricción v1","Para cambiar camada/cantidad elimina y crea una nueva venta."); return; }
    }

    if(paid>=total){ paid=total; status="pagado"; }
    else if(paid>0) status="parcial";
    else status=(status==="pagado"?"credito":status);

    const payload={id:id||uid("sale"),date,clientId,sowId:sowIdFinal,batchId,qty,unitPrice,total,status,paidAmount:paid,dueDate:(fd.get("dueDate")||"").toString(),notes:(fd.get("notes")||"").toString().trim()};

    if(id){
      const prev = get.sale(id);
      if(!prev){ toast("bad","No encontrada","La venta no existe."); return; }

      const prevBatch = get.batch(prev.batchId||"");
      const newBatch = get.batch(batchId||"");
      if(!newBatch){
        openAlert({title:"Faltan datos", message:"Selecciona una camada válida.", kind:"bad"});
        return;
      }

      // Disponibilidad: si es la misma camada, permite usar el stock + lo que ya había vendido en esta venta
      const available = num(newBatch.countCurrent) + ((prev.batchId===batchId)?num(prev.qty):0);
      if(qty>available){
        openAlert({
          title:"Stock insuficiente",
          message:`Disponible en la camada: ${fmtNum(available)} und. Estás intentando vender: ${fmtNum(qty)}.`,
          kind:"bad"
        });
        return;
      }

      // Si hay pagos registrados, se usa la suma real
      const paidSum = (state.payments||[]).filter(p=>p.saleId===id).reduce((a,p)=>a+num(p.amount),0);
      const paidFinal = paidSum>0 ? paidSum : paid;
      if(paidFinal>total){
        openAlert({
          title:"Abonos superan el total",
          message:`Esta venta tiene abonos por ${fmtCOP(paidFinal)}. El total (${fmtCOP(total)}) no puede ser menor.`,
          kind:"bad"
        });
        return;
      }

      // Restaurar stock de la venta anterior
      if(prevBatch){
        prevBatch.countCurrent = Math.max(0, num(prevBatch.countCurrent) + num(prev.qty));
        if(num(prevBatch.countCurrent)>0 && (prevBatch.status||"") === "cerrado") prevBatch.status = "disponible";
      }

      // Descontar stock en la nueva venta
      newBatch.countCurrent = Math.max(0, num(newBatch.countCurrent) - qty);
      if(newBatch.countCurrent<=0) newBatch.status="cerrado";

      const sowIdFinal = (sowId || newBatch.sowId || "");
      if(!sowIdFinal){
        openAlert({title:"Faltan datos", message:"Selecciona la cerda (o usa una camada ligada a una cerda).", kind:"bad"});
        return;
      }

      const pending = Math.max(0, total - paidFinal);
      const statusFinal = pending<=0 ? "pagado" : (paidFinal>0 ? "parcial" : "credito");

      const payload={
        id, date, clientId,
        sowId: sowIdFinal,
        batchId,
        qty,
        unitPrice,
        total,
        paidAmount: paidFinal,
        status: statusFinal,
        notes
      };

      state.sales = state.sales.map(x=>x.id===id?payload:x);

      // Actualizar tarea de cobro
      state.tasks = (state.tasks||[]).filter(t=>!(t.relatedType==="sale" && t.relatedId===id && (t.title||"").startsWith("Cobro pendiente")));
      if(pending>0){
        state.tasks.push({
          id:uid("tsk"),
          title:`Cobro pendiente — ${get.client(clientId)?.name||"cliente"}`,
          dueDate:addDays(date,7),
          priority:"alta",
          status:"pendiente",
          relatedType:"sale",
          relatedId:id,
          notes:`Saldo: ${fmtCOP(pending)}`
        });
      }

      save(); dlg.close(); toast("ok","Actualizado","Venta actualizada."); render();
      return;
    }

    state.sales.push(payload);
    batch.countCurrent=Math.max(0, num(batch.countCurrent)-qty);
    if(num(batch.countCurrent)===0) batch.status="cerrado";

    if(paid>0){
      state.payments.push({id:uid("pay"),saleId:payload.id,date,amount:paid,method:"efectivo",notes:"Abono inicial"});
      state.transactions.push({id:uid("tx"),date,type:"ingreso",category:"Venta de lechones",amount:paid,method:"efectivo",refType:"sale",refId:payload.id,notes:`Venta ${payload.id.slice(-6)} • ${qty} und`});
    }
    const pending=Math.max(0,total-paid);
    if(pending>0){
      state.tasks.push({id:uid("tsk"),title:`Cobro pendiente — ${get.client(clientId)?.name||"cliente"}`,dueDate:payload.dueDate||addDays(date,7),priority:"alta",status:"pendiente",relatedType:"sale",relatedId:payload.id,notes:`Saldo: ${fmtCOP(pending)}`});
    }

    save(); dlg.close(); toast("ok","Guardado","Venta registrada."); render();
  }

            </tbody>
          </table></div>

      onMount: ()=>{
        const amount=$("#payAmount");
        const range=$("#payRange");

          v = round100(v);
          if(v>pending) v = pending; // por redondeo

          amount.value = moneyFormatStr(v);
          range.value = String(Math.min(v, maxv));
          // mantiene el input formateado
          amount.value = moneyFormatStr(v);

          clamp.style.display = wasOver ? "inline" : "none";

          const paid1 = Math.min(total, paid0 + v);
          const pend1 = Math.max(0, total - paid1);

          nowPaid.textContent = fmtCOP(paid0);
          nowPend.textContent = fmtCOP(pending);
          afterPaid.textContent = fmtCOP(paid1);
          afterPend.textContent = fmtCOP(pend1);

          const pct1 = total>0 ? Math.min(100, Math.round((paid1/total)*100)) : 0;
          pct.textContent = pct1 + "%";
          bar.style.width = pct1 + "%";
        };

        amount.oninput=()=>sync("amount");
        range.oninput=()=>sync("range");
        $$(".chips button[data-set]").forEach(b=>b.onclick=()=>{
          const k=b.dataset.set;
          let v = 0;
          if(k==="25") v = pending*0.25;
          if(k==="50") v = pending*0.50;
          if(k==="all") v = pending;
          amount.value = moneyFormatStr(round100(v));
          sync("amount");
        });

        sync("amount");

        $("#ok").onclick=()=>{
          const fd=new FormData($("#payForm"));
          const date=(fd.get("date")||today()).toString();
          const method=(fd.get("method")||"efectivo").toString();
          let amountV=num(fd.get("amount"));
          if(!date){ openAlert({title:"Faltan datos", message:"Ingresa la fecha.", kind:"bad"}); return; }
          if(amountV<=0){ openAlert({title:"Valor inválido", message:"El abono debe ser mayor a 0.", kind:"bad"}); return; }

          const pendNow=Math.max(0,num(s.total)-num(s.paidAmount));
          amountV=Math.min(round100(amountV), pendNow);
          if(amountV<=0){ openAlert({title:"Sin saldo", message:"No hay saldo pendiente para abonar.", kind:"bad"}); return; }

          s.paidAmount=num(s.paidAmount)+amountV;
          const newPending=Math.max(0,num(s.total)-num(s.paidAmount));
          s.status=newPending<=0?"pagado":"parcial";

          state.payments = state.payments || [];
          state.payments.push({id:uid("pay"),saleId:s.id,date,amount:amountV,method,notes:(fd.get("notes")||"").toString().trim()});
          state.transactions.push({id:uid("tx"),date,type:"ingreso",category:"Ventas / lechones",amount:amountV,method,refType:"sale",refId:s.id,notes:`Abono a ${s.id.slice(-6)}`});

          if(newPending<=0){
            state.tasks.forEach(t=>{ if(t.relatedType==="sale" && t.relatedId===s.id && (t.title||"").startsWith("Cobro pendiente")) t.status="hecha"; });
          }

          save(); dlg.close(); toast("ok","Abono registrado",`Nuevo saldo: ${fmtCOP(newPending)}`); render();
        };
      }
    });
  }

  function meatEligibleHeads(){
    // Sugerido: camadas con edad mayor a PIGLET_DAYS_FOR_MEAT y con stock disponible
    const t=today();
    return state.batches
      .filter(b=>num(b.countCurrent)>0 && b.birthDate)
      .map(b=>({b, days: daysBetween(b.birthDate, t)}))
      .filter(x=>x.days!==null && x.days>=PIGLET_DAYS_FOR_MEAT)
      .reduce((acc,x)=>acc + num(x.b.countCurrent), 0);
  }

  function meatStats(){
    const rows=(state.meatSales||[]);
    const total = rows.reduce((a,s)=>a+num(s.total),0);
    const paid  = rows.reduce((a,s)=>a+num(s.paidAmount),0);
    const pending = Math.max(0, total - paid);
    const kgSold = rows.reduce((a,s)=>a+num(s.qty),0);
    return {total, paid, pending, kgSold, stockKg: num(state.meat?.stockKg)};
  }

  function saveMeatSale(editId, deductStock=true){
    const fd=new FormData($("#meatSaleForm"));
    const id = editId || (fd.get("id")||uid("meat")).toString();
    const date=(fd.get("date")||"").toString();
    const clientId=(fd.get("clientId")||"").toString();
    const qty=num(fd.get("qty"));          // kg
    const unitPrice=num(fd.get("unitPrice")); // COP/kg
    const total=Math.max(0, qty*unitPrice);
    let status=(fd.get("status")||"credito").toString();
    let paid=num(fd.get("paidAmount"));
    const dueDate=(fd.get("dueDate")||"").toString();
    const notes=(fd.get("notes")||"").toString().trim();

    if(!date||!clientId||qty<=0||unitPrice<0){
      openAlert({title:"Faltan datos", message:"Debes seleccionar fecha, cliente, kilos y precio por kg.", kind:"bad"}); return;
    }

    state.meat = state.meat || {stockKg:0,headsForSale:0,movements:[]};
    state.meatSales = state.meatSales || [];
    state.meatPayments = state.meatPayments || [];
    state.transactions = state.transactions || [];
    state.tasks = state.tasks || [];

    const existing = (state.meatSales||[]).find(x=>x.id===id) || null;
    const hasPays = (state.meatPayments||[]).some(p=>p.saleId===id);

    // Si ya tiene pagos registrados, no permitimos editar paid/status desde el formulario
    if(existing && hasPays){
      paid = num(existing.paidAmount);
      status = existing.status || status;
    } else {
      if(paid>total) paid=total;
      // Ajuste de estado coherente
      if(status==="pagado") paid = total;
      if(status==="credito") paid = 0;
      if(status==="parcial" && paid<=0) paid = Math.min(total, Math.max(0, paid));
      if(paid>=total) status="pagado";
      else if(paid>0) status="parcial";
      else status = (status==="parcial"?"credito":status);
    }

    // --- Stock: revertir venta anterior si estaba descontando stock ---
    const stockNow = num(state.meat.stockKg);
    let stockTemp = stockNow;

    if(existing && existing.deductStock){
      stockTemp = stockTemp + num(existing.qty);
      state.meat.movements.push({
        id:uid("mkmov"),
        date: today(),
        type:"entrada",
        kg:num(existing.qty),
        before: stockNow,
        after: stockTemp,
        reason:`Reversión (edición) venta carne ${id.slice(-6)}`
      });
    }

    // Aplicar nueva deducción si corresponde
    if(deductStock){
      if(qty>stockTemp){
        openAlert({title:"Stock insuficiente", message:`Disponible: ${fmtNum(stockTemp,2)} kg. Ajusta el stock o desmarca “Descontar stock”.`, kind:"bad"}); 
        // revertimos cualquier movimiento temporal? (no guardado todavía, pero ya agregamos log) — limpiarlo:
        if(existing && existing.deductStock) state.meat.movements.pop();
        return;
      }
      const before = stockTemp;
      stockTemp = Math.max(0, stockTemp - qty);
      state.meat.movements.push({
        id:uid("mkmov"),
        date,
        type:"salida",
        kg:qty,
        before,
        after:stockTemp,
        reason:`Venta carne (${get.client(clientId)?.name||clientId})`
      });
    }

    state.meat.stockKg = stockTemp;

    // --- Guardar/actualizar venta ---
    const payload={
      id,
      date, clientId,
      qty, unitPrice, total,
      status,
      paidAmount: paid,
      dueDate,
      notes,
      deductStock
    };

    const idx = state.meatSales.findIndex(x=>x.id===id);
    if(idx>=0) state.meatSales[idx]=payload;
    else state.meatSales.push(payload);

    // --- Finanzas: ingreso inicial (solo si NO hay pagos previos) ---
    // Si existía y no tenía pagos, actualizamos el "ingreso inicial" eliminando el anterior
    state.transactions = state.transactions.filter(tx=>!(tx.refType==="meatSale" && tx.refId===id && String(tx.notes||"").startsWith("Venta carne")));
    if(!hasPays && paid>0){
      state.transactions.push({
        id:uid("tx"),
        date,
        type:"ingreso",
        category:"Ventas / carne (kg)",
        amount:paid,
        method:"",
        refType:"meatSale",
        refId:id,
        notes:`Venta carne (${fmtNum(qty,2)} kg)`
      });
    }

    // --- Tarea de cobro si queda pendiente ---
    const pending = Math.max(0, total - paid);
    state.tasks = state.tasks.filter(t=>!(t.relatedType==="meatSale" && t.relatedId===id));
    if(pending>0){
      state.tasks.push({
        id:uid("task"),
        title:`Cobro pendiente carne (${id.slice(-6)})`,
        dueDate: dueDate || addDays(date, 7),
        priority:"media",
        done:false,
        relatedType:"meatSale",
        relatedId:id,
        notes:`Pendiente: ${fmtCOP(pending)} • Cliente: ${(get.client(clientId)?.name||"")}`
      });
    }

    save(); dlg.close(); toast("ok","Venta guardada", pending>0?`Pendiente: ${fmtCOP(pending)}`:"Pagada"); render();
  }


  function delMeatSale(id){
    const s=get.meatSale(id); if(!s) return;
    openModal({
      title:"Eliminar venta de carne",
      sub:`${s.id.slice(-6)} • ${fmtCOP(num(s.total))}`,
      body:`<div class="muted">Se eliminará la venta y se revertirá (si aplica) el stock descontado, los abonos/ingresos y la tarea de cobro.</div>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn danger" id="ok">Eliminar</button>`,
      onMount: ()=>{
        $("#ok").onclick=()=>{
          // Revertir stock si la venta descontó stock
          state.meat = state.meat || {stockKg:0,headsForSale:0,movements:[]};
          const before = num(state.meat.stockKg);
          if(s.deductStock){
            state.meat.stockKg = before + num(s.qty);
            state.meat.movements = state.meat.movements || [];
            state.meat.movements.push({id:uid("mkmov"),date:today(),type:"entrada",kg:num(s.qty),before,after:num(state.meat.stockKg),reason:`Reversión (eliminar) venta carne ${s.id.slice(-6)}`});
          }

          // Eliminar venta
          state.meatSales = (state.meatSales||[]).filter(x=>x.id!==id);

          // Eliminar pagos y transacciones asociadas
          state.meatPayments = (state.meatPayments||[]).filter(p=>p.saleId!==id);
          state.transactions = (state.transactions||[]).filter(tx=>!(tx.refType==="meatSale" && tx.refId===id));

          // Eliminar tarea asociada
          state.tasks = (state.tasks||[]).filter(t=>!(t.relatedType==="meatSale" && t.relatedId===id));

          save(); dlg.close(); toast("ok","Eliminado","Venta y registros asociados eliminados."); render();
        };
      }
    });
  }

        const afterPaid=$("#payAfterPaid");
        const afterPend=$("#payAfterPend");

        const sync = (src)=>{
          pending = Math.max(0, num(s.total) - num(s.paidAmount));
          const maxv = Math.max(0, Math.floor(pending));
          range.max = String(Math.max(1, maxv||1));

          const date=(fd.get("date")||today()).toString();
          const method=(fd.get("method")||"efectivo").toString();
          let amountV=num(fd.get("amount"));
          if(amountV<=0){ openAlert({title:"Valor inválido", message:"El pago debe ser mayor a 0.", kind:"bad"}); return; }

          const remainNow=Math.max(0, num(p.total)-num(p.paid));
          amountV=Math.min(round100(amountV), remainNow);
          if(amountV<=0){ openAlert({title:"Sin saldo", message:"No hay saldo pendiente en esta cuenta.", kind:"bad"}); return; }

          // registra gasto
          state.transactions.push({
            id:uid("tx"),
            date,
            type:"gasto",
            category:p.category||"Inventario / compra",
            amount:amountV,
            method,
            refType:"inventory",
            refId:p.refId||"",
            notes:`Pago compra: ${p.itemName||"insumo"}${p.supplier?(" • "+p.supplier):""}`.trim()
          });

          // guarda historial interno de la CxP
          p.payments = p.payments || [];
          p.payments.push({date, amount:amountV, method, notes:(fd.get("notes")||"").toString().trim()});

          // actualiza CxP
          p.paid = num(p.paid) + amountV;
          if(num(p.paid) >= num(p.total) - 0.0001){
            p.paid = num(p.total);
            p.status = "cerrado";
          }else{
            p.status = "abierto";
          }

          save(); dlg.close(); toast("ok","Pago registrado",`Pendiente: ${fmtCOP(Math.max(0,num(p.total)-num(p.paid)))}`); render();
        };
      }
    });
  }



  // ------- Tareas -------
  function renderTasks(){
    const now=today();
    const rows=state.tasks
      .filter(t=>matchQ(t.title,t.dueDate,t.priority,t.status,t.notes))
      .sort((a,b)=>(a.status||"").localeCompare(b.status||"") || (a.dueDate||"").localeCompare(b.dueDate||""))
      .map(t=>{
        const dueIn=t.dueDate?daysBetween(now,t.dueDate):null;
        const st=t.status||"pendiente";
        const tag=st==="hecha"?`<span class="tag ok">Hecha</span>`:(dueIn!==null&&dueIn<0?`<span class="tag bad">Vencida</span>`:`<span class="tag warn">Pendiente</span>`);
        return `<tr>
          <td>${tag} <span class="tag">${esc(t.priority||"media")}</span></td>
          <td><b>${esc(t.title)}</b><div class="muted">${esc(t.notes||"")}</div></td>
          <td class="mono">${esc(t.dueDate||"—")}<div class="muted">${dueIn!==null?(dueIn>=0?`${dueIn} días`:`${Math.abs(dueIn)} días tarde`):""}</div></td>
          <td class="mono">${esc(t.relatedType||"—")} ${t.relatedId?esc(t.relatedId.slice(-6)):""}</td>
          <td>
            ${st!=="hecha"?`<button class="btn" data-act="done" data-id="${t.id}">Hecha</button>`:`<button class="btn" data-act="undo" data-id="${t.id}">Reabrir</button>`}
            <button class="btn danger" data-act="del" data-id="${t.id}">Eliminar</button>
          </td>
        </tr>`;
      }).join("");

    view.innerHTML = shell(
      "Tareas",
      "Agenda destete, chequeos, vacunación y cobros (algunas se crean automáticamente).",
      `<button class="btn primary" id="add">➕ Nueva tarea</button>`,
      `<div class="wrap"><table>
        <thead><tr><th>Estado</th><th>Tarea</th><th>Vence</th><th>Relacionado</th><th>Acciones</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="5" class="muted">Sin tareas.</td></tr>`}</tbody>
      </table></div>`
    );
    $("#add").onclick=()=>openTask();
    view.onclick=(e)=>{
      const b=e.target.closest("button[data-act]"); if(!b) return;
      const id=b.dataset.id, act=b.dataset.act;
      if(act==="del"){ state.tasks=state.tasks.filter(t=>t.id!==id); save(); toast("ok","Eliminada","Tarea eliminada."); render(); }
      if(act==="done"||act==="undo"){
        const t=state.tasks.find(x=>x.id===id); if(!t) return;
        t.status = act==="done" ? "hecha" : "pendiente";
        save(); toast("ok","Listo", act==="done"?"Marcada como hecha.":"Reabierta."); render();
      }
    };
  }

  function taskForm(t){
    t=t||{title:"",dueDate:addDays(today(),3),priority:"media",status:"pendiente",relatedType:"",relatedId:"",notes:""};
    return `<form id="taskForm" class="grid2">
      <div class="f12"><label>Título *</label><input name="title" required value="${esc(t.title)}" placeholder="Ej: Vacunar camada lote..." /></div>
      <div class="f4"><label>Fecha</label><input type="date" name="dueDate" value="${esc(t.dueDate)}"/></div>
      <div class="f4"><label>Prioridad</label><select name="priority">${["alta","media","baja"].map(x=>`<option ${t.priority===x?"selected":""} value="${x}">${x}</option>`).join("")}</select></div>
      <div class="f4"><label>Estado</label><select name="status"><option value="pendiente" ${t.status!=="hecha"?"selected":""}>Pendiente</option><option value="hecha" ${t.status==="hecha"?"selected":""}>Hecha</option></select></div>
      <div class="f6"><label>Relacionado</label><select name="relatedType" id="rt">
        <option value="">—</option><option value="sow">Cerda</option><option value="batch">Camada</option><option value="sale">Venta</option><option value="inventory">Insumo</option>
      </select></div>
      <div class="f6"><label>Seleccionar</label><select name="relatedId" id="rid" disabled><option value="">—</option></select></div>
      <div class="f12"><label>Notas</label><textarea name="notes">${esc(t.notes)}</textarea></div>
    </form>
`;
  }

  function openTask(){
    openModal({
      title:"Nueva tarea",
      sub:"Puedes relacionarla con cerda/camada/venta/inventario.",
      body:taskForm(),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const rt=$("#rt"), rid=$("#rid");
        rt.onchange=()=>{
          rid.innerHTML=`<option value="">—</option>`;
          if(!rt.value){ rid.disabled=true; return; }
          rid.disabled=false;
          if(rt.value==="sow") rid.innerHTML+=state.sows.map(s=>`<option value="${s.id}">${esc(s.tag||s.name||"—")}</option>`).join("");
          if(rt.value==="batch") rid.innerHTML+=state.batches.map(b=>`<option value="${b.id}">${esc(b.id.slice(-8))} • ${esc(get.sow(b.sowId)?.tag||"cerda")}</option>`).join("");
          if(rt.value==="sale") rid.innerHTML+=state.sales.map(s=>`<option value="${s.id}">${esc(s.id.slice(-6))} • ${esc(get.client(s.clientId)?.name||"cliente")}</option>`).join("");
          if(rt.value==="inventory") rid.innerHTML+=state.inventory.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join("");
        };
        $("#save").onclick=()=>{
          const fd=new FormData($("#taskForm"));
          const title=(fd.get("title")||"").toString().trim();
          if(!title){ toast("bad","Falta título","Obligatorio."); return; }
          state.tasks.push({id:uid("tsk"),title,dueDate:(fd.get("dueDate")||"").toString(),priority:(fd.get("priority")||"media").toString(),status:(fd.get("status")||"pendiente").toString(),relatedType:(fd.get("relatedType")||"").toString(),relatedId:(fd.get("relatedId")||"").toString(),notes:(fd.get("notes")||"").toString().trim()});
          save(); dlg.close(); toast("ok","Guardado","Tarea creada."); render();
        };
      }
    });
  }

  // ------- Ajustes / Backup / CSV -------
  function renderSettings(){
    view.innerHTML = shell(
      "Ajustes",
      "Nombre de granja, días de gestación, respaldo JSON y exportaciones CSV.",
      `<button class="btn" id="reset">🧨 Reset</button>`,
      `<form id="setForm" class="grid2">
        <div class="f6"><label>Nombre granja</label><input name="farmName" value="${esc(state.settings.farmName||"")}"/></div>
        <div class="f3"><label>Moneda</label><select name="currency"><option value="COP" ${state.settings.currency==="COP"?"selected":""}>COP</option><option value="USD" ${state.settings.currency==="USD"?"selected":""}>USD</option></select></div>
        <div class="f3"><label>Días gestación</label><input type="number" name="gestationDays" min="90" max="130" value="${esc(state.settings.gestationDays||114)}"/></div>
        <div class="f12"><div class="tag info">Seguridad</div></div>
        <div class="f4"><label>Requerir inicio de sesión</label>
          <select name="requireLogin">
            <option value="1" ${state.settings.requireLogin!==false?"selected":""}>Sí</option>
            <option value="0" ${state.settings.requireLogin===false?"selected":""}>No</option>
          </select>
        </div>
        <div class="f4"><label>Usuario</label><input name="authUser" value="${esc(state.settings.authUser||"admin")}"/></div>
        <div class="f4"><label>Contraseña</label><input type="password" name="authPass" value="${esc(state.settings.authPass||"1234")}"/></div>

      </form>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn primary" id="save">Guardar</button>
        <button class="btn" id="expJson">Exportar JSON</button>
        <label class="btn" style="cursor:pointer">Importar JSON <input id="imp" type="file" accept="application/json" style="display:none"/></label>
        <button class="btn" id="csvSales">CSV Ventas</button>
        <button class="btn" id="csvInv">CSV Inventario</button>
        <button class="btn" id="csvTx">CSV Finanzas</button>
      </div>
      <div class="muted" style="margin-top:10px;font-size:12px">Tip: exporta JSON semanal para respaldo.</div>`
    );

    $("#save").onclick=()=>{
      const fd=new FormData($("#setForm"));
      state.settings.farmName=(fd.get("farmName")||"Granja Porcina").toString().trim()||"Granja Porcina";
      state.settings.currency=(fd.get("currency")||"COP").toString();
      state.settings.gestationDays=num(fd.get("gestationDays"))||114;
      
      state.settings.requireLogin=(fd.get("requireLogin")||"1").toString()==="1";
      state.settings.authUser=(fd.get("authUser")||"admin").toString().trim()||"admin";
      state.settings.authPass=(fd.get("authPass")||"1234").toString();
      save(); toast("ok","Guardado","Ajustes actualizados."); render();
    };
    $("#expJson").onclick=exportJSON;
    $("#imp").onchange=importJSON;
    $("#csvSales").onclick=exportSalesCSV;
    $("#csvInv").onclick=exportInvCSV;
    $("#csvTx").onclick=exportTxCSV;
    $("#reset").onclick=resetAll;
  }

  function download(name, content, mime){
    const blob=new Blob([content],{type:mime||"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function exportJSON(){
    download(`granja_respaldo_${today()}.json`, JSON.stringify(state,null,2), "application/json");
    toast("ok","Exportado","Respaldo descargado.");
  }
  function importJSON(e){
    const file=e.target.files && e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{ state=Object.assign(defaults(), JSON.parse(r.result)); save(); toast("ok","Importado","Base restaurada."); current="dashboard"; renderNav(); render(); } catch { toast("bad","Error","JSON inválido."); } };
    r.readAsText(file);
  }
  function resetAll(){
    openModal({
      title:"Reset total",
      sub:"Borra todo lo guardado en este navegador.",
      body:`<div class="tag bad">Recomendado: Exporta JSON antes.</div>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn danger" id="ok">Borrar todo</button>`,
      onMount: ()=>{ $("#ok").onclick=()=>{ state=defaults(); save(); dlg.close(); toast("ok","Listo","Datos borrados."); current="dashboard"; renderNav(); render(); }; }
    });
  }

  function toCSV(rows){ return rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"); }

  function exportSalesCSV(){
    const rows=[["date","client","batch","qty","unitPrice","total","status","paidAmount","pending","dueDate","notes"]];
    state.sales.forEach(s=>{
      const c=get.client(s.clientId);
      const pending=Math.max(0,num(s.total)-num(s.paidAmount));
      rows.push([s.date,c?.name||"",s.batchId?s.batchId.slice(-8):"",s.qty,s.unitPrice,s.total,s.status,s.paidAmount,pending,s.dueDate,s.notes]);
    });
    download(`ventas_${today()}.csv`, toCSV(rows), "text/csv");
    toast("ok","Exportado","CSV de ventas descargado.");
  }
  function exportInvCSV(){
    const rows=[["name","category","qty","unit","minQty","unitCost","supplier","expiration","notes"]];
    state.inventory.forEach(i=>rows.push([i.name,i.category,i.qty,i.unit,i.minQty,i.unitCost,i.supplier,i.expiration,i.notes]));
    download(`inventario_${today()}.csv`, toCSV(rows), "text/csv");
    toast("ok","Exportado","CSV de inventario descargado.");
  }
  function exportTxCSV(){
    const rows=[["date","type","category","amount","method","notes"]];
    state.transactions.forEach(t=>rows.push([t.date,t.type,t.category,t.amount,t.method,t.notes]));
    download(`finanzas_${today()}.csv`, toCSV(rows), "text/csv");
    toast("ok","Exportado","CSV de finanzas descargado.");
  }

  // ------- Quick add + top buttons -------
  $("#quick").onclick=()=>{
    openModal({
      title:"Registro rápido",
      sub:"Crea un registro sin cambiar de módulo.",
      body:`<div class="grid2">
        <div class="f12">
          <label>Tipo</label>
          <select id="qa">
            <option value="sow">Nueva cerda</option>
            <option value="breeding">Servicio / inseminación</option>
            <option value="farrowing">Parto</option>
            <option value="inv">Nuevo insumo</option>
            <option value="expense">Gasto</option>
            <option value="task">Tarea</option>
          </select>
        </div>
      </div>
      <div id="qaBody" style="margin-top:10px"></div>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="go">Continuar</button>`,
      onMount: ()=>{
        const qa=$("#qa"), qaBody=$("#qaBody");
        const renderQA=()=>{
          if(qa.value==="sow") qaBody.innerHTML=sowForm();
          if(qa.value==="breeding") qaBody.innerHTML=breedingForm();
          if(qa.value==="farrowing") qaBody.innerHTML=farrowingForm();
          if(qa.value==="inv") qaBody.innerHTML=invForm();
          if(qa.value==="expense") qaBody.innerHTML=txForm("gasto");
          if(qa.value==="task") qaBody.innerHTML=taskForm();
        };
        qa.onchange=renderQA; renderQA();
        $("#go").onclick=()=>{
          if(qa.value==="sow") saveSow();
          else if(qa.value==="breeding") saveBreeding();
          else if(qa.value==="farrowing") saveFarrowing();
          else if(qa.value==="inv") { openInvItem(); toast("warn","Tip","Guarda el insumo desde el formulario para evitar duplicados."); }
          else if(qa.value==="expense") { 
            const fd=new FormData($("#txForm"));
            const amount=num(fd.get("amount"));
            if(amount<=0){ toast("bad","Valor inválido","Debe ser >0."); return; }
            state.transactions.push({id:uid("tx"),date:(fd.get("date")||today()).toString(),type:"gasto",category:(fd.get("category")||"Operación").toString(),amount,method:(fd.get("method")||"efectivo").toString(),refType:"manual",refId:"",notes:(fd.get("notes")||"").toString()});
            save(); dlg.close(); toast("ok","Guardado","Gasto registrado."); render();
          }
          else if(qa.value==="task"){
            const fd=new FormData($("#taskForm"));
            const title=(fd.get("title")||"").toString().trim();
            if(!title){ toast("bad","Falta título","Obligatorio."); return; }
            state.tasks.push({id:uid("tsk"),title,dueDate:(fd.get("dueDate")||"").toString(),priority:(fd.get("priority")||"media").toString(),status:(fd.get("status")||"pendiente").toString(),relatedType:(fd.get("relatedType")||"").toString(),relatedId:(fd.get("relatedId")||"").toString(),notes:(fd.get("notes")||"").toString().trim()});
            save(); dlg.close(); toast("ok","Guardado","Tarea creada."); render();
          }
        };
      }
    });
  };

  $("#newSale").onclick=()=>openSale();
  const hb=$("#helpBtn"); if(hb) hb.onclick=()=>openHelp();

  // ------- Init -------
  mountLogin();
  renderNav();
  render();
  enforceAuth();
  if(storage._mode==="memory"){
    toast("warn","Almacenamiento bloqueado","Este navegador está bloqueando el almacenamiento. Los datos NO se guardarán hasta permitir almacenamiento/sitio.");
  }
  save(); // ensures pills update
  if(!requireAuth() || isAuthed()) setTimeout(()=>maybeOnboard(), 80);
})();
</script>
</body>
