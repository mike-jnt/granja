  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#070b14,var(--bg));color:var(--text)}
  header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;flex-wrap:wrap}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{width:36px;height:36px;border-radius:12px;background:conic-gradient(from 180deg,var(--acc),#a78bfa,var(--acc));display:grid;place-items:center;color:#071023;font-weight:900}
  .title{display:flex;flex-direction:column;line-height:1.05}
  .title b{font-size:14px;font-weight:900;letter-spacing:.1px;white-space:normal;word-break:break-word;max-width:min(52vw,520px)}
  .title span{font-size:12px;color:var(--muted)}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:650;font-size:12.5px}
  nav button.active{border-color:rgba(125,211,252,.6);background:rgba(125,211,252,.12)}
  .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .search{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 10px;border-radius:12px;min-width:min(420px,80vw);outline:none}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:650;font-size:12.5px}
  .btn.primary{border-color:rgba(125,211,252,.6);background:rgba(125,211,252,.14)}
  .btn.danger{border-color:rgba(255,107,107,.7);background:rgba(255,107,107,.12)}
  main{padding:0}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
  .card{grid-column:span 12;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:16px;overflow:hidden}
  /* Card header used in some modules (e.g., Carne "Ventas de carne") */
  .cardHd{padding:14px 16px 10px}
  .cardHd b{display:block;font-weight:700;font-size:18px;line-height:1.15;margin:0}
  .cardHd .muted{margin-top:6px}
  /* Give inner content breathing room from card edges */
  .card> .wrap{margin:0 16px 16px}
  .card> .wrap:first-child{margin-top:16px}

  .hd{padding:12px 12px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .hd h2{margin:0;font-size:14px} .hd p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .bd{padding:12px}
  .kpis{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
  .kpi{grid-column:span 3;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px;background:linear-gradient(135deg,rgba(125,211,252,.10),rgba(167,139,250,.08))}
  .kpi small{color:var(--muted)} .kpi b{display:block;font-size:20px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}
  th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
  th{text-align:left;color:var(--muted);font-size:11.5px;letter-spacing:.2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:sticky;top:0;background:rgba(11,18,32,.96)}
  tr:hover td{background:rgba(255,255,255,.02)}
  .wrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:14px}
  .tag{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-size:11px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tag.ok{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12)}
  .tag.bad{border-color:rgba(255,107,107,.7);background:rgba(255,107,107,.12)}
  .tag.warn{border-color:rgba(251,191,36,.7);background:rgba(251,191,36,.12)}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  dialog{border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(11,18,32,.96);color:var(--text);width:min(900px,calc(100vw - 24px))}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  form.grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
  .f6{grid-column:span 6} .f4{grid-column:span 4} .f3{grid-column:span 3} .f12{grid-column:span 12}
  label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  input,select,textarea{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.02);color:var(--text);padding:9px 10px;border-radius:12px;outline:none}
  textarea{min-height:86px;resize:vertical}
  .dlgHd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .dlgHd b{font-size:14px} .dlgHd span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  .dlgBd{padding:12px;max-height:65vh;overflow:auto}
  .dlgFt{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .toast{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;z-index:20}
  .toast .t{border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(11,18,32,.96);padding:10px 12px;width:min(420px,calc(100vw - 24px))}
  .t.ok{border-color:rgba(52,211,153,.6)} .t.bad{border-color:rgba(255,107,107,.7)} .t.warn{border-color:rgba(251,191,36,.7)}
  @media (max-width:900px){ .kpi{grid-column:span 6} table{min-width:720px} .search{min-width:min(300px,86vw)} }
  @media (max-width:520px){ .kpi{grid-column:span 12} .f6,.f4,.f3{grid-column:span 12} nav{gap:6px} }


/* =========================================================
   TEMA PROFESIONAL — VERDE & BLANCO (override total)
   Insertado al final para dominar estilos anteriores.
   ========================================================= */
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --panel2:#f2fbf5;
  --text:#0b1220;                 /* casi negro para legibilidad */
  --muted:#4b5563;
  --accent:#16a34a;               /* verde principal */
  --accent2:#065f46;              /* verde profundo */
  --danger:#b91c1c;               /* rojo sutil SOLO para eliminar/acciones críticas */
  --ok:#16a34a;
  --warn:#0f766e;
  --line:rgba(15,23,42,.12);
  --shadow: 0 10px 28px rgba(2,6,23,.10);
}

/* Fondo general */
body{
  background:
    radial-gradient(1000px 620px at 6% -10%, rgba(34,197,94,.18), transparent 55%),
    radial-gradient(900px 520px at 95% 0%, rgba(6,95,70,.12), transparent 55%),
    linear-gradient(180deg, #ffffff, #f4fbf6);
  color: var(--text);
}

/* Sidebar */
.sidebar{
  background: rgba(255,255,255,.78) !important;
  border-right: 1px solid var(--line) !important;
}
.brand{
  background: rgba(255,255,255,.96) !important;
  border-color: var(--line) !important;
}
.logo{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  color:#ffffff !important;
}
.footer-mini{
  border-top: 1px dashed rgba(15,23,42,.14) !important;
}
.footer-mini .chip{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  color: rgba(15,23,42,.75) !important;
}

/* Navegación */
.nav button{
  background: rgba(255,255,255,.80) !important;
  border-color: var(--line) !important;
  color: var(--text) !important;
}
.nav button:hover{
  background: rgba(34,197,94,.08) !important;
  border-color: rgba(34,197,94,.40) !important;
}
.nav button.active{
  background: linear-gradient(135deg, rgba(34,197,94,.22), rgba(6,95,70,.10)) !important;
  border-color: rgba(34,197,94,.55) !important;
}

/* Buscador y paneles */
.search{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  box-shadow: var(--shadow) !important;
}
.search input{ color: var(--text) !important; }

/* Tarjetas */
.card{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  box-shadow: var(--shadow) !important;
}
.card .hd{
  border-bottom: 1px solid rgba(15,23,42,.06) !important;
  background: linear-gradient(180deg, rgba(34,197,94,.06), rgba(255,255,255,0)) !important;
}

/* KPI */
.kpi{
  border-color: rgba(15,23,42,.10) !important;
  background: linear-gradient(135deg, rgba(34,197,94,.16), rgba(6,95,70,.06)) !important;
}
.kpi:before{
  background: radial-gradient(circle at 30% 30%, rgba(34,197,94,.18), transparent 65%) !important;
  opacity:.95 !important;
}

/* Botones */
.btn{
  background: rgba(255,255,255,.92) !important;
  border-color: var(--line) !important;
  color: var(--text) !important;
}
.btn:hover{
  background: rgba(34,197,94,.08) !important;
  border-color: rgba(34,197,94,.40) !important;
}
.btn.primary{
  background: linear-gradient(135deg, rgba(34,197,94,.24), rgba(6,95,70,.10)) !important;
  border-color: rgba(34,197,94,.60) !important;
}
.btn.ok{
  background: rgba(34,197,94,.12) !important;
  border-color: rgba(34,197,94,.48) !important;
}
.btn.danger{
  background: rgba(185,28,28,.08) !important;
  border-color: rgba(185,28,28,.32) !important;
}

/* Inputs */
input, select, textarea{
  background: rgba(255,255,255,.98) !important;
  border-color: rgba(15,23,42,.16) !important;
  color: var(--text) !important;
}
input:focus, select:focus, textarea:focus{
  border-color: rgba(34,197,94,.60) !important;
  box-shadow: 0 0 0 3px rgba(34,197,94,.18) !important;
}

/* Pills y tags */
.pill{
  border-color: rgba(34,197,94,.28) !important;
  background: rgba(34,197,94,.08) !important;
  color: rgba(6,95,70,.92) !important;
}
.tag{
  border-color: rgba(15,23,42,.12) !important;
  background: rgba(255,255,255,.84) !important;
  color: rgba(15,23,42,.86) !important;
}
.tag.ok{
  border-color: rgba(34,197,94,.42) !important;
  background: rgba(34,197,94,.12) !important;
}
.tag.warn{
  border-color: rgba(6,95,70,.40) !important;
  background: rgba(6,95,70,.10) !important;
}
.tag.info{
  border-color: rgba(34,197,94,.30) !important;
  background: rgba(34,197,94,.08) !important;
}
/* "bad" debe seguir siendo visible (ventas pendientes, etc.) */
.tag.bad{
  border-color: rgba(185,28,28,.42) !important;
  background: rgba(185,28,28,.10) !important;
}

/* Tablas */
.tablewrap{
  border-color: rgba(15,23,42,.10) !important;
}
th{
  background: rgba(248,250,249,.98) !important;
  color: rgba(15,23,42,.62) !important;
  border-bottom-color: rgba(15,23,42,.06) !important;
}
td{
  border-bottom-color: rgba(15,23,42,.06) !important;
}
tr:hover td{
  background: rgba(34,197,94,.05) !important;
}

/* Modal & Toast */
.modal{
  background: rgba(255,255,255,.97) !important;
  border-color: rgba(15,23,42,.14) !important;
}
.modal .mh{
  border-bottom: 1px solid rgba(15,23,42,.08) !important;
}
.modal .mf{
  border-top: 1px solid rgba(15,23,42,.08) !important;
}
.x{
  background: rgba(255,255,255,.92) !important;
  border-color: rgba(15,23,42,.14) !important;
  color: rgba(15,23,42,.90) !important;
}
.x:hover{ border-color: rgba(34,197,94,.50) !important; }

.toast .t{
  background: rgba(255,255,255,.96) !important;
  border-color: rgba(15,23,42,.14) !important;
}
.toast .t.ok{ border-color: rgba(34,197,94,.50) !important; }
.toast .t.warn{ border-color: rgba(6,95,70,.40) !important; }
.toast .t.bad{ border-color: rgba(185,28,28,.50) !important; }

/* Asegura textos "muted" */
.muted{ color: var(--muted) !important; }



/* =========================================================
   PATCH: Verde & Blanco 100% (todo combina)
   - Elimina rojos/azules residuales
   - Backdrops y estados "bad/danger" también en verde
   ========================================================= */
:root{
  --accent:#16a34a !important;
  --accent2:#065f46 !important;
  --danger: var(--accent2) !important; /* ahora todo en verde */
  --ok: var(--accent) !important;
  --warn: var(--accent2) !important;
}

/* Overlay del modal en verde (no negro) */
.modal-backdrop{
  background: rgba(6,95,70,.38) !important;
}

/* Todo lo "danger/bad" pasa a verde */
.btn.danger{
  background: rgba(6,95,70,.12) !important;
  border-color: rgba(6,95,70,.45) !important;
  color: var(--text) !important;
}
.btn.danger:hover{
  background: rgba(6,95,70,.16) !important;
  border-color: rgba(6,95,70,.55) !important;
}

.tag.bad{
  border-color: rgba(6,95,70,.45) !important;
  background: rgba(6,95,70,.12) !important;
  color: rgba(15,23,42,.86) !important;
}
.toast .t.bad{
  border-color: rgba(6,95,70,.55) !important;
}

/* Asegura que cualquier borde "line" use el mismo tono */
.card, .brand, .search, .tablewrap, .nav button, .btn, input, select, textarea,
.footer-mini .chip, .x, .modal, .toast .t{
  border-color: var(--line) !important;
}

/* Asegura que fondos de paneles/quebres sean blancos */
.sidebar, .brand, .search, .card, .btn, .pill, .tag, input, select, textarea,
.modal, .toast .t{
  background-clip: padding-box !important;
}

/* Estados visuales coherentes */
.nav button:hover,
.btn:hover{
  box-shadow: 0 10px 26px rgba(2,6,23,.08) !important;
}

/* Mantén texto siempre oscuro (evita restos claros) */
*{ color-scheme: light; }



/* =========================================================
   PATCH v3 — Verde & Blanco (Header + Dialog + Variables)
   Corrige: barra superior oscura, botones del nav, modal oscuro
   ========================================================= */
:root{
  /* Variables usadas por el CSS original */
  --acc: var(--accent) !important;     /* antes azul */
  --bad: var(--accent2) !important;    /* antes rojo */
  --bg:#ffffff !important;
  --panel:#ffffff !important;
  --text:#0b1220 !important;
  --muted:#475569 !important;
  --line:rgba(15,23,42,.12) !important;
}

/* Barra superior (antes oscura) */
header{
  background: rgba(255,255,255,.86) !important;
  border-bottom: 1px solid var(--line) !important;
  box-shadow: 0 10px 26px rgba(2,6,23,.08) !important;
  backdrop-filter: blur(12px) saturate(1.1) !important;
}

/* Navegación superior (nav sin clase) */
header nav button{
  background: rgba(255,255,255,.92) !important;
  border: 1px solid var(--line) !important;
  color: var(--text) !important;
}
header nav button:hover{
  background: rgba(34,197,94,.10) !important;
  border-color: rgba(34,197,94,.40) !important;
}
header nav button.active{
  background: rgba(34,197,94,.14) !important;
  border-color: rgba(34,197,94,.55) !important;
}

/* Input de búsqueda (en header) */
input.search{
  background: rgba(255,255,255,.96) !important;
  border: 1px solid var(--line) !important;
  color: var(--text) !important;
}
input.search::placeholder{ color: rgba(15,23,42,.55) !important; }
input.search:focus{
  border-color: rgba(34,197,94,.60) !important;
  box-shadow: 0 0 0 3px rgba(34,197,94,.18) !important;
}

/* Botón principal más "pro": verde sólido */
.btn.primary{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  border-color: rgba(6,95,70,.65) !important;
  color: #ffffff !important;
}
.btn.primary:hover{
  filter: brightness(1.02) !important;
}

/* Dialog (modal nativo) — antes oscuro */
dialog{
  background: rgba(255,255,255,.98) !important;
  border: 1px solid rgba(15,23,42,.14) !important;
  box-shadow: 0 18px 45px rgba(2,6,23,.18) !important;
}
dialog::backdrop{
  background: rgba(6,95,70,.34) !important;
}

.dlgHd{
  border-bottom: 1px solid rgba(15,23,42,.08) !important;
  background: linear-gradient(180deg, rgba(34,197,94,.06), rgba(255,255,255,0)) !important;
}
.dlgFt{
  border-top: 1px solid rgba(15,23,42,.08) !important;
}



/* =========================================================
   PATCH v4 — Header Verde bonito (con contraste)
   ========================================================= */
header{
  background: #076146 !important;
  background-image: none !important;
  border-bottom: 1px solid rgba(255,255,255,.18) !important;
  box-shadow: 0 14px 36px rgba(2,6,23,.18) !important;
  backdrop-filter: blur(10px) saturate(1.2) !important;
}

/* Texto en header */
header, header *{
  color: #ffffff !important;
}

/* Textos secundarios */
header .muted, header small, header .sub, header .subtitle, header .meta{
  color: rgba(255,255,255,.82) !important;
}

/* Logo dentro del header (si existe) */
header .logo{
  background: rgba(255,255,255,.95) !important;
  color: rgba(6,95,70,.98) !important;
  box-shadow: 0 10px 22px rgba(2,6,23,.14) !important;
}

/* Navegación superior */
header nav button{
  background: rgba(255,255,255,.14) !important;
  border: 1px solid rgba(255,255,255,.22) !important;
  color: #ffffff !important;
}
header nav button:hover{
  background: rgba(255,255,255,.22) !important;
  border-color: rgba(255,255,255,.30) !important;
}
header nav button.active{
  background: rgba(255,255,255,.26) !important;
  border-color: rgba(255,255,255,.36) !important;
  box-shadow: 0 10px 24px rgba(2,6,23,.14) !important;
}

/* Buscador del header */
input.search{
  background: rgba(255,255,255,.16) !important;
  border: 1px solid rgba(255,255,255,.28) !important;
  color: #ffffff !important;
}
input.search::placeholder{ color: rgba(255,255,255,.75) !important; }
input.search:focus{
  background: rgba(255,255,255,.20) !important;
  border-color: rgba(255,255,255,.38) !important;
  box-shadow: 0 0 0 3px rgba(255,255,255,.16) !important;
}

/* Botones en header (rápido/nueva venta) si usan .btn */
header .btn{
  background: rgba(255,255,255,.14) !important;
  border: 1px solid rgba(255,255,255,.22) !important;
  color: #ffffff !important;
}
header .btn:hover{
  background: rgba(255,255,255,.22) !important;
  border-color: rgba(255,255,255,.30) !important;
}

/* Para íconos/svg dentro del header */
header svg, header svg *{
  fill: currentColor !important;
  stroke: currentColor !important;
}



/* =========================================================
   PATCH v5 — Arreglo de Brand (logo + nombre) en header
   - Quita el bloque claro detrás del nombre
   - Alinea y mejora contraste/jerarquía
   ========================================================= */
header .brand{
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  gap: 12px !important;
  align-items: center !important;
}

/* Logo como "badge" blanco */
header .brand .logo{
  width: 38px !important;
  height: 38px !important;
  border-radius: 14px !important;
  background-color: rgba(255,255,255,.96) !important;
  background-image: var(--farmLogo) !important;
  background-size: contain !important;
  background-repeat: no-repeat !important;
  background-position: center !important;
  border: 1px solid rgba(255,255,255,.32) !important;
  box-shadow: 0 10px 22px rgba(2,6,23,.14) !important;
  color: transparent !important;
  font-size: 0 !important;
  overflow: hidden !important;
}

/* Texto del nombre (bien visible) */
header .brand .title{
  display:flex !important;
  flex-direction: column !important;
  line-height: 1.08 !important;
}
header .brand .title b{
  font-size: 15px !important;
  font-weight: 900 !important;
  letter-spacing: .2px !important;
  text-shadow: 0 1px 0 rgba(2,6,23,.12) !important;
}
header .brand .title span{
  font-size: 12px !important;
  color: rgba(255,255,255,.85) !important;
}

/* Evita que el brand tome un ancho raro en pantallas grandes */
header .bar{
  align-items: center !important;
}
header .brand{
  max-width: 320px !important;
}
header .brand .title{
  max-width: 260px !important;
}
header .brand .title b,
header .brand .title span{
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

/* En pantallas pequeñas: permite que baje el texto sin romper */
@media (max-width: 520px){
  header .brand{
    max-width: 100% !important;
  }
  header .brand .title{
    max-width: 100% !important;
  }
  header .brand .title b,
  header .brand .title span{
    white-space: normal !important;
  }
}



/* =========================================================
   UX: tarjetas de ayuda, pasos y estados vacíos
   ========================================================= */
.helpCard{
  border:1px solid rgba(15,23,42,.12);
  background: linear-gradient(135deg, rgba(34,197,94,.10), rgba(255,255,255,.88));
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 12px 30px rgba(2,6,23,.08);
  margin: 10px 0 14px;
}
.helpHd{
  display:flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.helpHd b{ font-size: 14px; }
.helpHd .muted{ margin-top:4px; }
.steps{
  display:grid;
  gap:10px;
}
.step{
  display:flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border-radius: 14px;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(15,23,42,.10);
}
.step .left{ display:flex; gap:10px; align-items:flex-start; }
.step .ico{
  width: 26px; height: 26px;
  border-radius: 10px;
  display:grid; place-items:center;
  background: rgba(34,197,94,.14);
  border:1px solid rgba(34,197,94,.28);
  flex: 0 0 auto;
  font-size: 14px;
}
.step.done .ico{
  background: rgba(34,197,94,.20);
  border-color: rgba(34,197,94,.40);
}
.step .txt b{ display:block; font-size: 13px; }
.step .txt .muted{ font-size: 12px; }
.step .right{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

.emptyBig{
  padding: 16px;
  border-radius: 18px;
  border: 1px dashed rgba(15,23,42,.18);
  background: rgba(255,255,255,.78);
  margin-top: 10px;
}
.emptyBig b{ font-size: 14px; display:block; margin-bottom:4px; }
.emptyBig .muted{ font-size: 12.5px; }
.emptyBig .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
kbd{
  font-family: var(--mono);
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.12);
  color: #fff;
}



/* =========================================================
   PATCH v14 — Centrar modales (dialog) y mejorar scroll
   ========================================================= */
dialog, dialog#dlg{
  position: fixed !important;
  inset: 0 !important;
  margin: auto !important;                 /* <- centra (antes quedaba arriba/izq) */
  max-height: calc(100vh - 24px) !important;
  overflow: auto !important;
}

/* Asegura look consistente (por si algún rule quedó corrupto) */
dialog, dialog#dlg{
  background: rgba(255,255,255,.98) !important;
  border: 1px solid rgba(15,23,42,.14) !important;
  border-radius: 18px !important;
  box-shadow: 0 18px 45px rgba(2,6,23,.18) !important;
  color: var(--text) !important;
}

/* Backdrop más suave */
dialog::backdrop{
  background: rgba(6,95,70,.34) !important;
}

/* En móvil: usa casi toda la pantalla pero sigue centrado */
@media (max-width: 520px){
  dialog, dialog#dlg{
    width: calc(100vw - 18px) !important;
    max-height: calc(100vh - 18px) !important;
    border-radius: 16px !important;
  }
}



/* =========================================================
   PATCH v15 — Menú lateral (izquierda)
   ========================================================= */
.layout{
  display:flex;
  gap:14px;
  padding:14px;
  align-items:flex-start;
}
.sidebar{
  width:260px;
  flex:0 0 260px;
  position: sticky;
  top: 86px; /* debajo del header */
  height: calc(100vh - 100px);
  overflow:auto;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.85);
  box-shadow: 0 12px 30px rgba(2,6,23,.08);
}
.sideHead{
  padding: 12px 12px 8px;
  border-bottom: 1px solid rgba(15,23,42,.10);
}
.sideTitle{
  font-weight: 900;
  color: var(--text);
  letter-spacing: .2px;
  margin-bottom: 2px;
}
.sideNav{
  padding: 10px;
  display:flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar nav button{
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(15,23,42,.10);
  background: rgba(255,255,255,.92);
  color: var(--text);
  cursor:pointer;
  font-weight: 750;
}
.sidebar nav button:hover{
  border-color: rgba(34,197,94,.30);
  box-shadow: 0 10px 22px rgba(2,6,23,.08);
}
.sidebar nav button.active{
  border-color: rgba(34,197,94,.45);
  background: rgba(34,197,94,.12);
}
main.content{ padding: 0; min-width: 0; }

/* En pantallas pequeñas, el menú se vuelve una barra debajo del header */
@media (max-width: 900px){
  .layout{ flex-direction: column; }
  .sidebar{
    width: 100%;

/* =======================================================================
   SERIOUS / EMPRESARIAL (menos dinámico)
   - Reduce animaciones, transforms, brillos y cambios agresivos en hover.
   ======================================================================= */
:root{
  --radius-sm: 10px;
  --radius-md: 12px;
  --radius-lg: 14px;
}

/* Quitar animaciones llamativas */
*{
  animation: none !important;
}

/* Mantener transiciones solo para color/borde (sin movimiento) */
.btn, button, a, .pill, .chip, .badge, .tab, .side a, .card, dialog, .modal, .toast{
  transition: background-color .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease !important;
}

/* Evitar “saltos”/movimientos al pasar el mouse */
.btn:hover, button:hover, a:hover,
.card:hover, .tile:hover, .kpi:hover,
dialog:hover, .modal:hover{
  transform: none !important;
  filter: none !important;
}

/* Sombras más sobrias y consistentes */
.card, .tile, .kpi, dialog, .modal, .toast, .loginCard{
  box-shadow: 0 1px 4px rgba(0,0,0,.22) !important;
}

/* Nada de “glow” extra en hover */
.card:hover, .tile:hover, .kpi:hover, .btn:hover, button:hover, .toast:hover{
  box-shadow: 0 1px 4px rgba(0,0,0,.22) !important;
}

/* Bordes y radios más serios */
.card, .tile, .kpi, dialog, .modal, .toast{
  border-radius: var(--radius-lg) !important;
}
.btn, button, input, select, textarea{
  border-radius: var(--radius-md) !important;
}

/* Fondos con menos “vidrio” y sin blur (más empresarial) */
.loginOverlay, .modalBackdrop, .backdrop{
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

/* Sidebar/menú: hover sobrio */
.side a:hover{
  transform: none !important;
  filter: none !important;
}

/* Tablas: hover suave (sin cambio brusco) */
table tr:hover{
  filter: none !important;
}

/* =========================================================
   RESPONSIVE PATCH — Mobile & Tablet friendly (sin romper PC)
   ========================================================= */

/* Mejor lectura/tacto en pantallas táctiles */
@media (hover: none) and (pointer: coarse){
  .btn{ min-height: 40px; }
  input, select, textarea{ min-height: 40px; }
}

/* Tablets / pantallas medianas */
@media (max-width: 900px){
  .layout{ padding: 12px; gap: 12px; }

  /* Header: que el bloque derecho no “empuje” */
  header .bar{ padding: 12px; }

  /* KPIs: 2 por fila */
  .kpi{ grid-column: span 6 !important; }

  /* Navegación lateral en barra: scroll suave horizontal si se llena */
  .sideNav{
    flex-wrap: nowrap !important;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 6px;
  }
  .sideNav::-webkit-scrollbar{ height: 6px; }
  .sideNav button{ white-space: nowrap; }
}

/* Teléfonos */
@media (max-width: 560px){
  .layout{ padding: 10px; gap: 10px; }

  /* Títulos y marca más compactos */
  .brand{ gap: 8px; }
  .logo{ width: 34px; height: 34px; border-radius: 12px; }
  .title b{ max-width: 92vw !important; }

  /* Header: botones compactos y wrap ordenado */
  header .bar{ gap: 10px; padding: 10px 10px; }
  header .right{ gap: 8px; }
  header .search{ flex: 1 1 100%; width: 100%; }

  /* Reducir texto de botones con icono (mantener “Nueva venta”) */
  header .right .btn:not(.primary):not(#newSale):not(#helpBtn) span{ display: none; }
  header .right .btn{ padding: 9px 10px; border-radius: 14px; }

  /* KPIs: 1 por fila */
  .kpi{ grid-column: span 12 !important; }

  /* Forms: columnas a una sola */
  form.grid2{ gap: 8px; }
  .f6, .f4, .f3{ grid-column: span 12 !important; }

  /* Inputs a 16px para evitar zoom iOS */
  input, select, textarea{ font-size: 16px !important; }

  /* Tablas: menos ancho mínimo (igual se puede hacer scroll) */
  table{ min-width: 680px !important; }

  /* Acciones/botones dentro de cards: que no se salgan */
  .actions, .rowActions, .miniRow, .btnRow, .toolbar{
    flex-wrap: wrap !important;
    justify-content: flex-start !important;
  }

  /* Chips y tags más respirables */
  .tag{ padding: 4px 9px; font-size: 12px; }

  /* Dialogs: más cómodos en móvil */
  dialog, dialog#dlg, dialog#dlg2{
    width: calc(100vw - 16px) !important;
    max-height: calc(100vh - 16px) !important;
    border-radius: 16px !important;
  }
}

}

/* =========================================================
   PATCH v20 — Responsive refinado (márgenes, safe-area, tablets)
   - Evita que textos/elementos queden pegados a los bordes
   - Centra el contenido en pantallas grandes
   - Mejora scroll horizontal en tablas/navegación
   ========================================================= */
html{ -webkit-text-size-adjust: 100%; }
body{ overflow-x: hidden; }

/* “Gutter” adaptable y contenedor máximo (mejor en pantallas grandes) */
:root{
  --gutter: 14px;
  --maxw: 1480px;
}

/* Header: mantiene fondo full-width, pero contenido centrado con padding seguro */
header .bar{
  max-width: var(--maxw);
  margin-left: auto !important;
  margin-right: auto !important;
  padding-left: calc(var(--gutter) + env(safe-area-inset-left)) !important;
  padding-right: calc(var(--gutter) + env(safe-area-inset-right)) !important;
}

/* App: mismo contenedor para sidebar + contenido */
.layout{
  max-width: var(--maxw);
  margin-left: auto !important;
  margin-right: auto !important;
  width: 100%;
  padding-left: calc(var(--gutter) + env(safe-area-inset-left)) !important;
  padding-right: calc(var(--gutter) + env(safe-area-inset-right)) !important;
}

/* Evita “empujes” raros en flex/grid en pantallas chicas */
main.content{ min-width: 0; }
#view{ padding-bottom: 28px; }

/* Cortes limpios en textos largos (códigos, nombres, etc.) */
#view, .card, .pigCard, .metric, .kpi, .wrap, dialog, .modal{
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Scroll horizontal más suave donde aplique */
.wrap{
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* Tablets: un poco menos de “gutter” */
@media (max-width: 900px){
  :root{ --gutter: 12px; --maxw: 100%; }
}

/* Teléfonos */
@media (max-width: 560px){
  :root{ --gutter: 10px; --maxw: 100%; }

  /* Reduce un toque padding interno para que respire sin pegarse */
  .card .hd, .card .bd{ padding-left: 14px !important; padding-right: 14px !important; }

  /* Tablas: lectura mejor sin pegarse */
  th,td{ padding: 10px 10px !important; }
}

/* Muy pequeño */
@media (max-width: 390px){
  :root{ --gutter: 8px; --maxw: 100%; }
}

   NO quede pegado a los bordes (desktop + mobile)

  (por ejemplo, tablas renderizadas directamente dentro de módulos).

*/

table{

}

/* Mensajes de tablas (filas colspan) */

#fbStatusBtn{
  width:40px;
  height:40px;
  min-width:40px;
  padding:0 !important;
  border-radius:14px !important;
  display:inline-flex !important;
  align-items:center;

  flex:0 0 40px;

  line-height:1;
  transition:background .2s ease, border-color .2s ease, transform .15s ease;

  width:10px;
  height:10px;
  border-radius:999px;
  background:currentColor;
  display:block;
  box-shadow:0 0 0 2px rgba(255,255,255,.18);
}
#fbStatusBtn.is-on{
  background:#15803d !important;
  border-color:#166534 !important;
  color:#ffffff !important;
}
#fbStatusBtn.is-off{
  background:#b91c1c !important;
  border-color:#991b1b !important;
  color:#ffffff !important;
}
#fbStatusBtn.is-wait{
  background:#2563eb !important;
  border-color:#1d4ed8 !important;
  color:#ffffff !important;
}
#fbStatusBtn:hover{
  transform:translateY(-1px);
}
</style>

<script>
  // Estado visual de Firebase como botón en el header
  window.__setFBStatus = function(stateOrOk, msg){
    const el = document.getElementById("fbStatusBtn");
    if(!el) return;

    const raw = (msg || "").toString().trim();
    const isOk = stateOrOk === true || stateOrOk === "on" || stateOrOk === "connected";
    const isWait = stateOrOk === "wait" || stateOrOk === "connecting" || (!isOk && raw && /inici|cargando|autentic|sincronizando|subiendo|conectando|restaurando/i.test(raw));

    let stateText = "Firebase desconectado";
    el.classList.remove("is-on","is-off","is-wait");

    if(isOk){
      el.classList.add("is-on");
      stateText = "Firebase conectado";
    }else if(isWait){
      el.classList.add("is-wait");
      stateText = raw ? ("Firebase conectando: " + raw) : "Firebase conectando";
    }else{
      el.classList.add("is-off");
      stateText = raw ? ("Firebase desconectado: " + raw) : "Firebase desconectado";
    }

    el.title = stateText;
    el.setAttribute("aria-label", stateText);
    el.dataset.status = stateText;
  };
</script>

<script type="module">
  // ==============================
  // Firebase Cloud Firestore Sync
  // ==============================
  // Guarda y carga el "state" completo en Firestore.
  // Ruta: /apps/granja-7b4b5/users/<uid>/state/main

  import { initializeApp } from "firebase/app";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword as fbSignInWithEmailAndPassword, createUserWithEmailAndPassword as fbCreateUserWithEmailAndPassword, setPersistence, browserLocalPersistence, signOut as fbSignOut } from "firebase/auth";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "firebase/firestore";

  const firebaseConfig = {
    apiKey: "AIzaSyCf5JD4AfLEkgFEJFJfYyEuharFdq1d6lY",
    authDomain: "granja-7b4b5.firebaseapp.com",
    projectId: "granja-7b4b5",
    storageBucket: "granja-7b4b5.firebasestorage.app",
    messagingSenderId: "570166643052",
    appId: "1:570166643052:web:01925e9935d14637434b49"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // === Modo "un solo usuario" ===
  // Crea este usuario en Firebase Auth (Email/Password) y usa SIEMPRE la misma cuenta en todos los dispositivos.
  const DEFAULT_SINGLE_USER_EMAIL = "admin@granja.local";

  function getFirebaseEmailCandidate(userOrEmail){
    const raw = (userOrEmail || "").toString().trim();
    const settings = ((window.state || {}).settings || {});
    const configuredEmail = (settings.firebaseEmail || "").toString().trim();
    const configuredUser = (settings.authUser || "admin").toString().trim();

    if(configuredEmail && configuredEmail.includes("@")) return configuredEmail.toLowerCase();
    if(raw && raw.includes("@")) return raw.toLowerCase();
    if(configuredUser && configuredUser.includes("@")) return configuredUser.toLowerCase();

    const alias = (raw || configuredUser || "admin").toString().trim().toLowerCase().replace(/[^a-z0-9._-]+/g, "");
    return ((alias || "admin") + "@granja.local").toLowerCase();
  }
  window.getFirebaseEmailCandidate = getFirebaseEmailCandidate;

  // Estado inicial
  window.__setFBStatus && window.__setFBStatus("connecting","conectando…");

  // Identificador del dispositivo (para ignorar el eco de nuestros propios cambios)
  const DEVICE_ID_KEY = "granja_device_id";
  const deviceId = (() => {
    let v = localStorage.getItem(DEVICE_ID_KEY);
    if (!v) {
      v = (crypto?.randomUUID?.() || ("dev_" + Math.random().toString(16).slice(2)));
      localStorage.setItem(DEVICE_ID_KEY, v);
    }
    return v;
  })();

  function stateDocRef(uid){
    return doc(db, "apps", "granja-7b4b5", "users", uid, "state", "main");
  }

  window.firebaseCloud = {
    enabled: true,
    ready: false,
    uid: null,
    hasSession(){ try{ return !!auth.currentUser; }catch(e){ return false; } },
    unsub: null,
    async loadNow(){
      if(!this.uid) return null;
      const snap = await getDoc(stateDocRef(this.uid));
      return snap.exists() ? (snap.data()?.state || null) : null;
    },
    async saveNow(state){
      if(!this.uid) return;
      await setDoc(
        stateDocRef(this.uid),
        { state, updatedAt: serverTimestamp(), deviceId },
        { merge: true }
      );
    },
  
    // Iniciar sesión (Email/Password). Para "un solo usuario" usa la MISMA cuenta en todos los dispositivos.
    async signIn(userOrEmail, password){
      const u = (userOrEmail || "").toString().trim();
      const p = (password || "").toString();
      if(!u || !p) throw new Error("missing-credentials");

      const emailCandidate = getFirebaseEmailCandidate(u);
      await setPersistence(auth, browserLocalPersistence);

      try{
        await fbSignInWithEmailAndPassword(auth, emailCandidate, p);
        return true;
      }catch(signErr){
        const code = String(signErr?.code || signErr?.message || "").toLowerCase();
        const shouldCreate = code.includes("user-not-found") || code.includes("invalid-user");
        if(!shouldCreate) throw signErr;
      }

      await fbCreateUserWithEmailAndPassword(auth, emailCandidate, p);
      return true;
    },
    async signOut(){
      try{ await fbSignOut(auth); }catch(e){}
    },
};

  window.__fbAutoConnectInFlight = false;
  window.__ensureFirebaseConnection = async function(passwordOverride){
    try{
      if(!window.firebaseCloud || !window.firebaseCloud.enabled) return false;
      if(window.firebaseCloud.ready && window.firebaseCloud.uid){
        window.__setFBStatus && window.__setFBStatus(true);
        return true;
      }
      if(window.firebaseCloud.hasSession && window.firebaseCloud.hasSession()){
        window.__setFBStatus && window.__setFBStatus("connecting","restaurando sesión…");
        return true;
      }
      if(window.__fbAutoConnectInFlight) return false;

      const savedUser = (((window.state||{}).settings||{}).authUser || "admin").toString().trim() || "admin";
      const savedPass = (passwordOverride != null ? passwordOverride : ((((window.state||{}).settings||{}).authPass || "").toString()));
      if(!savedPass){
        window.__setFBStatus && window.__setFBStatus(false,"desconectado");
        return false;
      }

      window.__fbAutoConnectInFlight = true;
      window.__setFBStatus && window.__setFBStatus("connecting","conectando…");
      await window.firebaseCloud.signIn(savedUser, savedPass);
      return true;
    }catch(e){
      console.warn("[Firebase] Auto connect error:", e);
      window.__setFBStatus && window.__setFBStatus(false,"desconectado");
      return false;
    }finally{
      window.__fbAutoConnectInFlight = false;
    }
  };

  // Firebase Auth (Email/Password): cuando hay sesión cargamos/sincronizamos el state
  onAuthStateChanged(auth, async (user) => {
    if(!user){
      window.firebaseCloud.ready = false;
      window.firebaseCloud.uid = null;
      try{ if(window.firebaseCloud.unsub) window.firebaseCloud.unsub(); }catch(e){}
      window.__setFBStatus && window.__setFBStatus(false,"desconectado");
      // Si la app ya cargó, fuerza pantalla de login
      try{
        if(typeof window.__clearLocalAuthed === "function") window.__clearLocalAuthed();
        if(typeof window.__enforceAuth === "function") window.__enforceAuth();
        else window.__PENDING_LOCAL_CLEAR__ = true;
      }catch(e){}
      return;
    }

    window.firebaseCloud.uid = user.uid;
    // Marca sesión local como activa para no volver a pedir login si Firebase ya está autenticado
    try{
      if(typeof window.__setLocalAuthed === "function") window.__setLocalAuthed(true);
      else window.__PENDING_LOCAL_AUTH__ = true;
      if(typeof window.__enforceAuth === "function") window.__enforceAuth();
    }catch(e){}
    window.firebaseCloud.ready = true;
    console.log("[Firebase] UID:", user.uid);

    // Seguridad extra: si alguien inicia sesión con otro email, cerramos sesión.
    try{
      const em = (user.email || "").toString().toLowerCase();
      const allowedEmail = getFirebaseEmailCandidate((((window.state||{}).settings||{}).authUser || em || "admin").toString());
      if(em && allowedEmail && em !== allowedEmail){
        console.warn("[Firebase] Email no coincide con el configurado:", em, allowedEmail);
      }
    }catch(e){}

    // 1) Cargar estado desde la nube
    let hadCloud = false;
    try{
      window.__setFBStatus && window.__setFBStatus("connecting","cargando datos…");
      const snap = await getDoc(stateDocRef(user.uid));
      if(snap.exists() && snap.data()?.state){
        hadCloud = true;
        const cloudState = snap.data().state;

        if(typeof window.applyRemoteState === "function"){
          window.applyRemoteState(cloudState, {source:"cloud_boot"});
        }else{
          window.__BOOTSTRAP_STATE__ = cloudState;
        }
        console.log("[Firebase] Estado cargado desde la nube");
      }else{
        console.log("[Firebase] No había estado en la nube (doc nuevo)");
      }
      window.__setFBStatus && window.__setFBStatus(true);
    }catch(e){
      console.warn("[Firebase] Load error:", e);
      // Si ves "permission-denied", revisa reglas de Firestore.
      window.__setFBStatus && window.__setFBStatus(false,"desconectado");
      return; // sin permisos, no intentes suscribirte
    }

    // 2) Suscripción en tiempo real
    try{
      if(window.firebaseCloud.unsub) window.firebaseCloud.unsub();
      window.firebaseCloud.unsub = onSnapshot(stateDocRef(user.uid), (snap)=>{
        if(!snap.exists()) return;
        const data = snap.data() || {};
        if(data.deviceId && data.deviceId === deviceId) return; // ignorar eco propio
        if(!data.state) return;

        if(typeof window.applyRemoteState === "function"){
          window.applyRemoteState(data.state, {source:"cloud_live"});
        }else{
          window.__REMOTE_STATE__ = data.state;
        }
      });
    }catch(e){
      console.warn("[Firebase] Subscribe error:", e);
      window.__setFBStatus && window.__setFBStatus(false,"desconectado");
    }

    // 3) Avisar a la app que Firebase está listo (para hacer primer push local si hace falta)
    try{
      window.__FIREBASE_INFO__ = { uid: user.uid, hadCloud };
      if(typeof window.onFirebaseReady === "function"){
        window.onFirebaseReady(window.__FIREBASE_INFO__);
      }
    }catch(e){}
  });
</script>

<script>
(() => {

const KEY = "granja_porcina_v1_compact";
  
  const storage = (()=> {
    const testKey="__st";
    try{
      localStorage.setItem(testKey,"1");
      localStorage.removeItem(testKey);
      return Object.assign(localStorage,{_mode:"localStorage"});
    }catch(e1){
      try{
        sessionStorage.setItem(testKey,"1");
        sessionStorage.removeItem(testKey);
        return Object.assign(sessionStorage,{_mode:"sessionStorage"});
      }catch(e2){
        const mem={};
        return {
          _mode:"memory",
          getItem:(k)=> (k in mem ? mem[k] : null),
          setItem:(k,v)=>{ mem[k]=String(v); },
          removeItem:(k)=>{ delete mem[k]; },
          clear:()=>{ for(const k in mem) delete mem[k]; }
        };
      }
    }
  })();

const uid = (p="id") => p + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  const today = () => new Date().toISOString().slice(0,10);
  const nowISO = () => new Date().toISOString();
  const num = (v) => {
    let s = String(v??"").trim();
    if(!s) return 0;
    s = s.replace(/[^0-9.,-]/g,"");
    s = s.replace(/(?!^)-/g,""); // solo un "-"
    // Patrones de miles: 1.234 o 1.234.567 / 1,234,567
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){
      s = s.replace(/\./g,"");
    } else if(/^-?\d{1,3}(,\d{3})+$/.test(s)){
      s = s.replace(/,/g,"");
    } else if(s.includes(".") && s.includes(",")){
      // "." miles y "," decimal
      s = s.replace(/\./g,"").replace(",",".");
    } else {
      const dots = (s.match(/\./g)||[]).length;
      const commas = (s.match(/,/g)||[]).length;
      if(dots>1 && commas===0) s = s.replace(/\./g,"");
      else if(commas>1 && dots===0) s = s.replace(/,/g,"");
      else if(commas===1 && dots===0) s = s.replace(",",".");
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  };
  const addDays = (iso, d) => { const x = new Date(iso+"T00:00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
  const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/(1000*60*60*24));
  // ------- Helpers de periodos (histórico mensual) -------
  const monthKey = (iso)=> String(iso||"").slice(0,7); // YYYY-MM
  const monthStartISO = (m)=> (m && /^\d{4}-\d{2}$/.test(String(m))) ? (String(m) + "-01") : "";
  const monthEndISO = (m)=>{
    const s = String(m||"");
    if(!/^\d{4}-\d{2}$/.test(s)) return "";
    const y = Number(s.slice(0,4));
    const mo = Number(s.slice(5,7)); // 1..12
    const d = new Date(Date.UTC(y, mo, 0)); // día 0 del mes siguiente = último del mes
    return d.toISOString().slice(0,10);
  };
  const addMonthsKey = (m, delta)=>{
    const s = String(m||"");
    if(!/^\d{4}-\d{2}$/.test(s)) return today().slice(0,7);
    const y = Number(s.slice(0,4));
    const mo = Number(s.slice(5,7)); // 1..12
    const d = new Date(Date.UTC(y, mo-1, 1));
    d.setUTCMonth(d.getUTCMonth() + (delta|0));
    return d.toISOString().slice(0,7);
  };

  const esc = (s) => String(s??"").replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
const svgIcon = (name, cls="ico") => `<svg class="${cls}" aria-hidden="true" focusable="false"><use href="#i-${name}" xlink:href="#i-${name}"></use></svg>`;
  const btnLabel = (iconName, text, cls="ico") => `${svgIcon(iconName, cls)}<span>${text}</span>`;
  const fmtCOP = (n) => { n=num(n); try { return n.toLocaleString("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}); } catch { return "COP "+Math.round(n).toString(); } };

  const fmtNum = (n, dec=0) => {
    n = num(n);
    if(!Number.isFinite(n)) n = 0;
    const sign = n<0 ? "-" : "";
    n = Math.abs(n);
    const p = Math.pow(10, Math.max(0, dec|0));
    const r = Math.round(n*p)/p;
    const i = Math.trunc(r);
    const frac = Math.round((r - i) * p);
    const intStr = i.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    if(dec<=0) return sign + intStr;
    if(frac<=0) return sign + intStr;
    const fracStr = frac.toString().padStart(dec, "0");
    return sign + intStr + "," + fracStr;
  };

  // Helper para KPIs reutilizables
  const kpi = (label, value, kindOrSub="", sub="") => {
    const kinds = ["ok","warn","bad","info"];
    const kind = kinds.includes(kindOrSub) ? kindOrSub : "";
    const subtitle = kind ? (sub||"") : (kindOrSub||sub||"");
    return `<div class="kpi${kind?(" "+kind):""}">
      <small>${esc(label)}</small>
      <b>${value}</b>
      <div class="muted mono">${esc(subtitle||"")}</div>
    </div>`;
  };



  // ------- Máscara de números (dinero y cantidades) con puntuación mientras escribes -------
  const numberFormatStr = (v, decimals=0) => {
    let s = String(v??"");
    if(!s) return "";
    s = s.replace(/[^\d.,]/g,"");
    if(!s) return "";
    let dec = "";
    if(decimals>0){
      const lastComma = s.lastIndexOf(",");
      const lastDot   = s.lastIndexOf(".");
      const lastSep   = Math.max(lastComma, lastDot);
      if(lastSep>-1){
        const after = s.slice(lastSep+1).replace(/[^\d]/g,"");
        const before = s.slice(0,lastSep);
        // Heurística: si después hay 1-2 dígitos => decimal; si hay 3 => miles
        if(after.length>0 && after.length<=decimals && after.length!==3){
          dec = after.slice(0, decimals);
          s = before;
        } else if(after.length>0 && after.length<3){
          dec = after.slice(0, decimals);
          s = before;
        } // else: tratar como miles
      }
    }
    const intDigits = s.replace(/[^\d]/g,"");
    const intFormatted = intDigits ? intDigits.replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";
    if(dec) return (intFormatted || "0") + "," + dec;
    return intFormatted;
  };

  // Compatibilidad: dinero = entero COP
  const moneyFormatStr = (v) => numberFormatStr(v, 0);

  const moneyKeys = new Set([
    "unitprice","unitcost","totalcost","paidamount","amount","total",
    "invtotal","payamount","cxpamount","invunit","invpaidnow","price","cost","valor","monto"
  ]);
  const qtyHints = ["qty","cantidad","count","stock","units","unidades","born","deaths","alive","current","peso","weight","litters"];

    // Cantidades: inputs numéricos o que contengan pistas
    const isQty = (!isMoney) && (el.dataset.qty==="1" || t==="number" || qtyHints.some(h=>name.includes(h)||id.includes(h)));

      if(step.includes(".") && step !== "1"){
        decimals = Math.min(4, (step.split(".")[1]||"").length);
      } else if(step.includes(",") && step !== "1"){
        decimals = Math.min(4, (step.split(",")[1]||"").length);
      }
    }
    return {kind: isMoney ? "money" : "qty", decimals};
  };

  const setMoney = (el, n) => { if(el) el.value = moneyFormatStr(Math.max(0, Math.round(num(n)))); };
  const setMoneyInput = (el, n) => { if(el) el.value = String(Math.max(0, Math.round(num(n)))); };
  const setQty   = (el, n) => { if(el) el.value = numberFormatStr(num(n), 0); };

  function bindMoneyInputs(root=document){
    const scope = root?.querySelectorAll ? root : document;

      // Formatea inicial

      el.addEventListener("input", ()=>{
        el.value = info.kind==="money" ? moneyFormatStr(el.value) : numberFormatStr(el.value, info.decimals);

      });

      el.addEventListener("blur", ()=>{
        el.value = info.kind==="money" ? moneyFormatStr(el.value) : numberFormatStr(el.value, info.decimals);
      });

  }



  // ------- Costeo / inversión por cerda y por camada -------
  const moveCost = (m) => {
    const tc = num(m.totalCost);

  const invested = {

      .filter(m=>m.type==="salida" && m.linkedType==="sow" && m.linkedId===sowId)
      .reduce((s,m)=>s+moveCost(m),0),

  function defaultUnitCostForItem(itemId){
    const it = get.inv(itemId);
    const cur = num(it?.unitCost);
    if(cur>0) return cur;
    const moves = (state.stockMovements||[])
      .filter(m=>m.itemId===itemId && m.type==="entrada")
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    for(const m of moves){
      const q = Math.max(0, num(m.qty));
      const tc = num(m.totalCost);
      const uc = num(m.unitCost);
      const derived = uc>0 ? uc : (tc>0 && q>0 ? (tc/q) : 0);
      if(derived>0) return Math.round(derived*100)/100;
    }
    return 0;
  }

  // ------- Utilidad / ganancias (lechones) -------
  function profitStatsForBatch(batchId){
    const sales = (state.sales||[]).filter(s=>s.batchId===batchId);
    const qtySold = sales.reduce((a,s)=>a+Math.max(0,num(s.qty)),0);
    const sold = sales.reduce((a,s)=>a+Math.max(0,num(s.total)),0);
    const collected = sales.reduce((a,s)=>a+Math.max(0,num(s.paidAmount)),0);
    const pending = Math.max(0, sold - collected);
    const cost = Math.max(0, invested.batch(batchId));
    const profitEst = sold - cost;
    return {sales, qtySold, sold, collected, pending, cost, profitEst};
  }

  function profitStatsForSow(sowId){
    const batches = (state.batches||[]).filter(b=>b.sowId===sowId);
    const per = batches
      .map(b=>{
        const st = profitStatsForBatch(b.id);
        return {
          batch: b,
          qtySold: st.qtySold,
          sold: st.sold,
          collected: st.collected,
          pending: st.pending,
          cost: st.cost,
          profitEst: st.sold - st.cost
        };
      })
      .sort((a,b)=>(b.batch.birthDate||"").localeCompare(a.batch.birthDate||""));

    const qtySold = per.reduce((a,x)=>a+x.qtySold,0);
    const sold = per.reduce((a,x)=>a+x.sold,0);
    const collected = per.reduce((a,x)=>a+x.collected,0);
    const pending = Math.max(0, sold - collected);

    const costS = Math.max(0, invested.sow(sowId));
    const costB = per.reduce((a,x)=>a+x.cost,0);
    const profitEst = sold - (costS + costB);

    return {per, qtySold, sold, collected, pending, costS, costB, profitEst};
  }

  async function attemptLogin(){
    const uEl=$("#loginUser");
    const pEl=$("#loginPass");
    const u=((uEl && uEl.value)||"").toString().trim();
    const p=((pEl && pEl.value)||"").toString();

    const b=$("#btnLogin");
    const prevTxt = b ? b.textContent : "";
    if(b){ b.disabled=true; b.textContent="Entrando…"; }

    try{
      // 0) Si Firebase ya tiene sesión persistida, no fuerces credenciales.
      // A veces onAuthStateChanged tarda unos ms en marcar ready/uid.
      if(window.firebaseCloud && window.firebaseCloud.enabled){
        const wait = (ms)=>new Promise(r=>setTimeout(r,ms));
        for(let i=0;i<20;i++){
          const has = (window.firebaseCloud.ready && window.firebaseCloud.uid) ||
                      (window.firebaseCloud.hasSession && window.firebaseCloud.hasSession());
          if(has) break;
          await wait(100);
        }
        const has = (window.firebaseCloud.ready && window.firebaseCloud.uid) ||
                    (window.firebaseCloud.hasSession && window.firebaseCloud.hasSession());
        if(has){
          setAuthed(true);
          toast("ok","Bienvenido","Sesión restaurada.");
          enforceAuth();
          return;
        }
      }

      if(!u || !p){
        toast("bad","Datos inválidos","Ingresa usuario y contraseña.");
        openLoginErrorModal("Ingresa usuario y contraseña.");
        return;
      }
      // 1) Preparar coincidencia local y priorizar Firebase cuando sea posible
      const lu=((state.settings.authUser||"admin")+"").trim();
      const lp=((state.settings.authPass||"1234")+"");
      const localMatch = (u===lu && p===lp);

      // 1.5) Si Firebase está restaurando sesión, espera un poco antes de forzar signIn.
      if(window.firebaseCloud && window.firebaseCloud.enabled){
        const wait2 = (ms)=>new Promise(r=>setTimeout(r,ms));
        for(let i=0;i<20;i++){
          const has = (window.firebaseCloud.ready && window.firebaseCloud.uid) ||
                      (window.firebaseCloud.hasSession && window.firebaseCloud.hasSession());
          if(has){
            setAuthed(true);
            toast("ok","Bienvenido","Sesión restaurada.");
            enforceAuth();
            return;
          }
          await wait2(100);
        }
      }

      // 2) Intenta nube primero. Si falla pero la clave coincide localmente, entra local y luego vuelve a intentar conectar.
      if(window.firebaseCloud && typeof window.firebaseCloud.signIn==="function"){
        try{
          window.__setFBStatus && window.__setFBStatus("connecting","autenticando…");
          await window.firebaseCloud.signIn(u, p);
          setAuthed(true);
          toast("ok","Bienvenido","Sesión iniciada (nube).");
          enforceAuth();
          return;
        }catch(firebaseErr){
          console.warn("[Firebase] SignIn error:", firebaseErr);
          if(!localMatch) throw firebaseErr;
        }
      }

      if(localMatch){
        setAuthed(true);
        const linked = await (window.__ensureFirebaseConnection ? window.__ensureFirebaseConnection(p) : false);
        toast("ok","Bienvenido", linked ? "Sesión iniciada y Firebase conectado." : "Sesión iniciada. Firebase quedó desconectado.");
        enforceAuth();
        return;
      }

      throw new Error("login-failed");
    }catch(e){
      console.warn("Login error:", e);
      const msg = (e && (e.code || e.message || "")) ? String(e.code || e.message) : "";

      // Si Firebase está restaurando sesión, espera un momento antes de mostrar error.
      try{
        if(window.firebaseCloud && window.firebaseCloud.enabled){
          const wait3 = (ms)=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<20;i++){
            const has = (window.firebaseCloud.ready && window.firebaseCloud.uid) ||
                        (window.firebaseCloud.hasSession && window.firebaseCloud.hasSession());
            if(has){
              setAuthed(true);
              toast("ok","Bienvenido","Sesión restaurada.");
              enforceAuth();
              return;
            }
            await wait3(100);
          }
        }
      }catch(_){}

      if(msg.includes("invalid-user")){
        toast("bad","Usuario o correo inválido","Revisa el usuario o el correo Firebase en Ajustes.");
        openLoginErrorModal("Usuario o correo incorrecto.");
        window.__setFBStatus && window.__setFBStatus(false,"desconectado");
        return;
      }

      if(msg.includes("auth/invalid-credential") || msg.includes("invalid-credential") || msg.includes("auth/wrong-password")){
        toast("bad","Datos inválidos","Contraseña incorrecta.");
        openLoginErrorModal("Contraseña incorrecta.");
        window.__setFBStatus && window.__setFBStatus(false,"desconectado");
        return;
      }

      toast("bad","No se pudo iniciar","Revisa usuario/contraseña o conecta la nube.");
      openLoginErrorModal("No se pudo iniciar sesión.");
      window.__setFBStatus && window.__setFBStatus(false,"desconectado");
    }finally{
      if(b){ b.disabled=false; b.textContent=prevTxt || "Iniciar sesión"; }
    }
  }

  function save(){

      // Si el storage falla (políticas del navegador/extensiones), no rompas la app.

  function takeAnimalsFromPen(penId, want, preferredIds){
    ensureAnimals();
    const pid = String(penId||"");
    const n = Math.max(0, Math.floor(num(want)));
    const preferred = (preferredIds||[]).map(String).filter(Boolean);
    const chosen = [];
    const used = new Set();

    // 1) tomar preferidos primero
    preferred.forEach(id=>{
      const a = get.animal(id);
      if(!a) return;
      if(!isAnimalActive(a)) return;
      if(String(a.penId||"")!==pid) return;
      if(used.has(a.id)) return;
      chosen.push(a.id);
      used.add(a.id);
    });

    // 2) completar FIFO por createdAt
    const pool = animalsInPen(pid)
      .slice()
      .sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
    for(const a of pool){
      if(chosen.length>=n) break;
      if(used.has(a.id)) continue;
      chosen.push(a.id);
      used.add(a.id);
    }
    return chosen.slice(0,n);
  }

  function animalCost(animalId){
    const id = String(animalId||"");
    return (state.stockMovements||[])
      .filter(m=>String(m.type||"").toLowerCase()==="salida" && String(m.linkedType||"")==="animal" && String(m.linkedId||"")===id)
      .reduce((s,m)=>{
        const tc = num(m.totalCost);
        const uc = Math.max(0, num(m.unitCost));
        const q = Math.abs(num(m.qty));
        return s + (tc>0?tc:(q*uc));
      },0);
  }
  function animalRevenue(animalId){
    const id = String(animalId||"");

      .filter(s=>Array.isArray(s.animalIds) && s.animalIds.map(String).includes(id))
      .reduce((sum,s)=>{

  }

  function migrateLegacy(){
    // batches / camadas
    (state.batches||[]).forEach(b=>{
      if(b.birthDate==null && b.date!=null) b.birthDate = b.date;
      if(b.countInitial==null){
        if(b.countBornAlive!=null) b.countInitial = num(b.countBornAlive);
        else if(b.bornAlive!=null) b.countInitial = num(b.bornAlive);
        else if(b.alive!=null) b.countInitial = num(b.alive);
      }
      if(b.countCurrent==null){
        if(b.countInitial!=null) b.countCurrent = num(b.countInitial);
      }
      if(b.status==null || b.status===""){
        b.status = num(b.countCurrent)>0 ? "disponible" : "cerrado";
      }
    });

    // farrowings / partos
    (state.farrowings||[]).forEach(f=>{
      if(f.date==null && f.farrowingDate!=null) f.date = f.farrowingDate;
      if(f.bornAlive==null && f.bornTotal!=null){
        f.bornAlive = Math.max(0, num(f.bornTotal) - num(f.stillborn||0));
      }
    });

    // inventory
    (state.inventory||[]).forEach(i=>{
      if(i.unitCost==null && i.costUnit!=null) i.unitCost = num(i.costUnit);
      if(i.minQty==null && i.min!=null) i.minQty = num(i.min);
    });

    // sales
    (state.sales||[]).forEach(s=>{
      if(s.unitPrice==null && s.price!=null) s.unitPrice = num(s.price);
      if(s.paidAmount==null && s.paid!=null) s.paidAmount = num(s.paid);
      if(s.status==null || s.status===""){
        const total=num(s.total);
        const paid=num(s.paidAmount);
        const pending=Math.max(0,total-paid);
        s.status = pending<=0 ? "pagado" : (paid>0 ? "parcial" : "credito");
      }
    });
  }

  function normalizeAccountingState(){
    state.accounting = state.accounting || {};

    DEFAULT_CONTABLE_CHART.forEach(base=>{
      const found = existing.find(x=>x.id===base.id) || existing.find(x=>x.code===base.code);
      merged.push(found ? {...base, ...found, system:true} : {...base});
    });
    existing.forEach(acc=>{
      if(!merged.some(x=>x.id===acc.id || x.code===acc.code)) merged.push(acc);
    });
    merged.sort((a,b)=> String(a.code||"").localeCompare(String(b.code||"")));
    state.accounting.chartAccounts = merged;
  }

function normalizeState(){
    migrateLegacy();
    state.sows = state.sows || [];
    state.breedings = state.breedings || [];
    state.farrowings = state.farrowings || [];
    state.batches = state.batches || [];
    state.inventory = state.inventory || [];
    state.stockMovements = state.stockMovements || [];
    state.clients = state.clients || [];
    state.sales = state.sales || [];
    state.payments = state.payments || [];
    state.meat = state.meat || {stockKg:0,headsForSale:0,movements:[]};
    state.meatSales = state.meatSales || [];
    state.meatPayments = state.meatPayments || [];
    state.transactions = state.transactions || [];
    state.payables = state.payables || [];
    state.tasks = state.tasks || [];
    state.engorde = state.engorde || {manual:[], movements:[]};
    state.engorde.manual = state.engorde.manual || [];
    state.engorde.movements = state.engorde.movements || [];
    state.animals = state.animals || [];
    state.animalEvents = state.animalEvents || [];

    // Cajones / corrales
    state.pens = state.pens || [];

    // Nota: preservamos metadatos como avgKg (peso promedio del cajón) y capacity.
    const basePens = (defaults().pens || []).map(p=>({
      id:String(p.id||""),
      name:String(p.name||""),
      type:String(p.type||"gestacion").toLowerCase()
    }));

    const cleaned = (state.pens||[])
      .map(p=>({
        id:String(p.id||uid("pen")),
        name:String(p.name||"").trim(),
        type:String(p.type||"gestacion").trim().toLowerCase(),
        avgKg: (p.avgKg==null || p.avgKg==="") ? null : Math.max(0, num(p.avgKg)),
        capacity: (p.capacity==null || p.capacity==="") ? null : Math.max(0, Math.floor(num(p.capacity))),
        initialCount: (p.initialCount==null || p.initialCount==="") ? 0 : Math.max(0, Math.floor(num(p.initialCount))),
        entryDate: String(p.entryDate||"").trim(),
        estimatedExitDate: String(p.estimatedExitDate||"").trim(),
      }))
      .filter(p=>p.name);

    // Merge: primero base (mantener ids), luego los extra del usuario
    const merged = [];
    basePens.forEach(bp=>{
      const found = cleaned.find(p=>p.id===bp.id) ||
        cleaned.find(p=>p.type===bp.type && p.name.toLowerCase()===String(bp.name||"").toLowerCase());
      merged.push({
        id: bp.id || (found?found.id:uid("pen")),
        name: (found&&found.name) ? found.name : bp.name,
        type: (found&&found.type) ? found.type : bp.type,
        avgKg: (found && found.avgKg!=null) ? found.avgKg : null,
        capacity: (found && found.capacity!=null) ? found.capacity : null,
        initialCount: (found && found.initialCount!=null) ? found.initialCount : 0,
        entryDate: (found && found.entryDate!=null) ? found.entryDate : "",
        estimatedExitDate: (found && found.estimatedExitDate!=null) ? found.estimatedExitDate : "",
      });
    });
    cleaned.forEach(p=>{ if(!merged.some(x=>x.id===p.id)) merged.push(p); });
    state.pens = merged;

    // Normalizar asignaciones
    state.sows.forEach(s=>{ if(s.penId==null) s.penId=""; });
    state.batches.forEach(b=>{ if(b.penId==null) b.penId=""; });

    // Marcar lotes manuales de engorde por cajón (para poder editarlos fácilmente)
    (state.batches||[]).forEach(b=>{
      if(String(b.origin||"").toLowerCase()==="engorde_manual" && !b.manualPenId && b.penId && !String(b.sowId||"")) b.manualPenId = b.penId;
    });

    state.settings = state.settings || defaults().settings;
    state.settings.serviceMethods = state.settings.serviceMethods || ["inseminación","monta","otro"]; 
    state.settings.inventoryCategories = (state.settings.inventoryCategories || defaults().settings.inventoryCategories || ["alimento","medicamento","insumo"]).map(x=>String(x??"").trim()).filter(Boolean);
    state.settings.inventoryUnits = (state.settings.inventoryUnits || defaults().settings.inventoryUnits || ["ml","cc","kg","g","l","und","lb","bulto","bolsa"]).map(x=>String(x??"").trim()).filter(Boolean);
    normalizeAccountingState();
  }
