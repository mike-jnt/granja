  function openInvItem(id){
    const i=id?get.inv(id):null;
    openModal({
      title:id?"Editar insumo":"Nuevo insumo",
      sub:"Define mínimo para alertas.",
      body:invForm(i, !id),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const f = $("#invForm");
        const reg = $("#invRegPurchase");
        const qtyI = $("#invQty");
        const totalI = $("#invTotal");
        const ucI = $("#invUnitCost");
        const stI = $("#invPayStatus");
        const paidI = $("#invPaidNow");
        const dueI = $("#invDue");
        const methodI = $("#invMethod");
        const catSel = f?.querySelector('[name="category"]');
        const unitSel = f?.querySelector('[name="unit"]');
        const btnCat = $("#addInvCategory");
        const btnUnit = $("#addInvUnit");

        function refreshInvSelect(sel, values, currentValue, labelFn){
          if(!sel) return;
          sel.innerHTML = values.map(x=>`<option value="${esc(x)}" ${String(currentValue||"").toLowerCase()===String(x||"").toLowerCase()?"selected":""}>${esc(labelFn?labelFn(x):x)}</option>`).join("");
          if(currentValue) sel.value = currentValue;
        }

        function clampPaid(){
          const total=num(totalI?.value);
          if(stI?.value==="pagado"){
            setMoneyInput(paidI, Math.max(0,total));
            paidI.disabled = true;
            dueI.value = "";
            dueI.disabled = true;
          } else if(stI?.value==="credito"){
            setMoneyInput(paidI, 0);
            paidI.disabled = true;
            dueI.disabled = false;
          } else {
            paidI.disabled = false;
            dueI.disabled = false;
            const p=num(paidI.value);
            if(p>total) setMoneyInput(paidI, Math.max(0,total));
          }
        }

        function recalcUnit(){
          if(!reg || !reg.checked) return;
          const q=num(qtyI?.value);
          const total=num(totalI?.value);
          if(q>0 && total>0){
            const uc = total / q;
            if(ucI) ucI.value = String(Math.round(uc*100)/100);
          }
          clampPaid();
        }
        if(reg){ reg.onchange=()=>{ clampPaid(); }; }
        if(btnCat){ btnCat.onclick=()=>{
          openInventoryOptionManager("category", ({action, value})=>{
            const values = inventoryCategoriesList();
            const current = action==="delete" && String(catSel?.value||"").toLowerCase()===String(value||"").toLowerCase()
              ? (values[0] || "")
              : (catSel?.value || value || values[0] || "");
            refreshInvSelect(catSel, values, current);
          });
        }; }
        if(btnUnit){ btnUnit.onclick=()=>{
          openInventoryOptionManager("unit", ({action, value})=>{
            const values = inventoryUnitsList();
            const current = action==="delete" && String(unitSel?.value||"").toLowerCase()===String(value||"").toLowerCase()
              ? (values[0] || "")
              : (unitSel?.value || value || values[0] || "");
            refreshInvSelect(unitSel, values, current, inventoryUnitLabel);
          });
        }; }
        if(totalI){ totalI.oninput=recalcUnit; }
        if(qtyI){ qtyI.oninput=recalcUnit; }
        if(stI){ stI.onchange=clampPaid; }
        if(paidI){ paidI.oninput=clampPaid; }
        clampPaid();

        $("#save").onclick=()=>{
          const fd=new FormData($("#invForm"));
          const name=(fd.get("name")||"").toString().trim();
          if(!name){ toast("bad","Falta nombre","Obligatorio."); return; }
          const payload={
            id:id||uid("inv"),
            name,
            category:(fd.get("category")||"alimento").toString(),
            unit:(fd.get("unit")||"und").toString().trim()||"und",
            qty:num(fd.get("qty")),
            minQty:num(fd.get("minQty")),
            unitCost:num($("#invUnitCost")?.value),
            supplier:(fd.get("supplier")||"").toString().trim(),
            expiration:(fd.get("expiration")||"").toString(),
            notes:(fd.get("notes")||"").toString().trim()
          };
          if(id) state.inventory=state.inventory.map(x=>x.id===id?payload:x);
          else state.inventory.push(payload);

          // Compra inicial opcional → movimiento + finanzas + cuentas por pagar
          if(!id){
            const reg=$("#invRegPurchase");
            const q=num($("#invQty")?.value);
            const total=num($("#invTotal")?.value);
            if(reg?.checked && total<=0){ openAlert({title:"Falta el total", message:"Si vas a registrar la compra en Finanzas, ingresa el Total compra (COP).", kind:"bad"}); return; }
            const date=(fd.get("pDate")||today()).toString();
            const status=($("#invPayStatus")?.value||"pagado").toString();
            const method=($("#invMethod")?.value||"efectivo").toString();
            const line=($("#invLine")?.value||"general").toString();
            const due=($("#invDue")?.value||"").toString();
            let paidNow=num($("#invPaidNow")?.value);

            if(reg?.checked && q>0){
              // Movimiento de entrada inicial (historial)
              const movId = uid("mov");
          state.stockMovements.push({
            id: movId,
                itemId:payload.id,
                type:"entrada",
                date,
                qty:q,
                unitCost:payload.unitCost||0,
                linkedType:"",
                linkedId:"",
                totalCost: total,
                payStatus: status,
                paidNow: Math.max(0, Math.min(total, paidNow)),
                method,
                supplier: payload.supplier||"",
                dueDate: due,
                notes: ("Compra inicial" + (payload.notes?(" • "+payload.notes):"")).trim()
              });
            }

            if(reg?.checked && total>0){
              // Ajusta pagado según estado
              if(status==="pagado") paidNow = total;
              if(status==="credito") paidNow = 0;
              paidNow = Math.max(0, Math.min(total, paidNow));

              // Gasto en finanzas SOLO por lo pagado hoy (caja)
              if(paidNow>0){
                state.transactions.push({
                  id:uid("tx"),
                  date,
                  type:"gasto",
                  line: line,
                  category:"Inventario / compra",
                  amount: paidNow,
                  method,
                  refType:"inventory",
                  refId: payload.id,
                  notes:`Compra: ${payload.name}`
                });
              }

              // Si queda pendiente, crear cuenta por pagar
              const remain = Math.max(0, total - paidNow);
              if(remain>0){
                state.payables.push({
                  id:uid("pay"),
                  date,
                  line: line,
                  category:"Inventario / compra",
                  supplier: payload.supplier||"",
                  refType:"inventory",
                  refId: payload.id,
                  itemName: payload.name,
                  total,
                  paid: paidNow,
                  dueDate: due,
                  method,
                  status:"abierto",
                  notes:`Compra: ${payload.name}`
                });
              }
            }
          }

          save(); dlg.close(); toast("ok","Guardado","Insumo guardado."); render();
        };
      }
    });
  }

  function openInvMove(itemId, mode, forcedLink){
    const i=get.inv(itemId); if(!i) return;
    openModal({
      title: mode==="entrada"?"Entrada a inventario":"Salida de inventario",
      sub: `${i.name} • ${i.category}`,
      body:`<form id="movForm" class="grid2">
        <div class="f4"><label>Fecha</label><input type="date" name="date" value="${today()}"/></div>
        <div class="f4"><label>Cantidad (${esc(i.unit)})</label><input type="number" step="0.01" name="qty" value="1" min="0"/></div>
        <div class="f4"><label>Costo unit. (opcional)</label><input type="number" step="0.01" name="unitCost" value="${esc(defaultUnitCostForItem(i.id)||0)}"/></div>
        ${mode==="entrada"?`
        <div class="f4"><label>Costo total (opcional)</label><input type="number" step="0.01" name="totalCost" value="0" placeholder="Si lo llenas, calcula costo unit."/></div>
        <div class="f4"><label>Estado de pago</label>
          <select name="payStatus" id="payStatus">
            <option value="pagado">Pagado completo</option>
            <option value="credito">Crédito (pendiente)</option>
            <option value="parcial">Parcial (abonos)</option>
          </select>
        </div>
        <div class="f4"><label>Pagado hoy (COP)</label><input type="number" step="0.01" name="paidNow" id="paidNow" value="0"/></div>
        <div class="f4"><label>Método</label>
          <select name="method" id="method">
            ${payMethodOptions("efectivo")}
          </select>
        </div>
        <div class="f4"><label>Vence (si hay crédito)</label><input type="date" name="dueDate" id="dueDate" value=""/></div>
        `:""}
        <div class="f6"><label>Relacionado con (opcional)</label>
          <select name="linkedType" id="lt">
            <option value="">—</option><option value="sow">Cerda</option><option value="batch">Camada</option><option value="engorde">Engorde</option><option value="animal">Cerdo (engorde)</option>
          </select>
        </div>
        <div class="f6"><label>Seleccionar</label><select name="linkedId" id="lid" disabled><option value="">—</option></select></div>
        <div class="f12"><label>Notas</label><textarea name="notes"></textarea></div>
        ${mode==="entrada"?`<div class="f12"><label style="display:flex;gap:10px;align-items:center;cursor:pointer">
          <input id="asExp" type="checkbox" checked style="width:18px;height:18px"/> Registrar como gasto (cantidad×costo unit.)
        </label></div>`:""}
      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="ok">Aplicar</button>`,
      onMount: ()=>{
        const lt=$("#lt"), lid=$("#lid");
        // Auto cálculo costo unitario cuando se ingresa costo total
        const totalI=$("#movForm input[name=totalCost]");
        const qtyI=$("#movForm input[name=qty]");
        const ucI=$("#movForm input[name=unitCost]");
        const stI=$("#payStatus");
        const paidI=$("#paidNow");
        const dueI=$("#dueDate");
        function clampPaid(){
          const total=num(totalI?.value);
          if(!stI) return;
          if(stI.value==="pagado"){
            if(paidI){ paidI.value=String(Math.max(0,total)); paidI.disabled=true; }
            if(dueI){ dueI.value=""; dueI.disabled=true; }
          } else if(stI.value==="credito"){
            if(paidI){ paidI.value="0"; paidI.disabled=true; }
            if(dueI){ dueI.disabled=false; }
          } else {
            if(paidI){ paidI.disabled=false; const p=num(paidI.value); if(p>total) paidI.value=String(Math.max(0,total)); }
            if(dueI){ dueI.disabled=false; }
          }
        }
        function recalcUC(){
          const q=num(qtyI?.value);
          const total=num(totalI?.value);
          if(total>0 && q>0 && ucI){ ucI.value=String(Math.round((total/q)*100)/100); }
          clampPaid();
        }
        if(totalI) totalI.oninput=recalcUC;
        if(qtyI) qtyI.oninput=recalcUC;
        if(stI) stI.onchange=clampPaid;
        if(paidI) paidI.oninput=clampPaid;
        clampPaid();

        lt.onchange=()=>{
          lid.innerHTML=`<option value="">—</option>`;
          if(!lt.value){ lid.disabled=true; return; }
          lid.disabled=false;
          if(lt.value==="sow"){
            lid.innerHTML+=state.sows.slice().sort((a,b)=>(a.tag||"").localeCompare(b.tag||"")).map(s=>`<option value="${s.id}">${esc(s.tag||s.name||"—")}</option>`).join("");
          } else if(lt.value==="engorde"){
            const pens = (state.pens||[])
              .filter(p=>String(p.type||"").toLowerCase()==="engorde" && penAcceptsBatch(p))
              .slice()
              .sort((a,b)=>(a.name||"").localeCompare(b.name||""));
            lid.innerHTML += `<option value="all">Todo engorde</option>` + pens.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
          } else if(lt.value==="animal"){
            const animals = (state.animals||[])
              .filter(a=>isAnimalActive(a))
              .slice()
              .sort((a,b)=>(String(a.name||"(sin nombre)")).localeCompare(String(b.name||"(sin nombre)")));
            lid.innerHTML += animals.map(a=>{
              const pen = getPen(a.penId);
              const nm = a.name ? a.name : "(sin nombre)";
              return `<option value="${a.id}">${esc(nm)} • ${esc(pen?.name||"")}</option>`;
            }).join("");
          } else {
            lid.innerHTML+=state.batches.slice().sort((a,b)=>(b.birthDate||"").localeCompare(a.birthDate||"")).map(b=>`<option value="${b.id}">${esc(b.id.slice(-8))} • ${esc(get.sow(b.sowId)?.tag||"cerda")}</option>`).join("");
          }
        };

        // Si viene forzado (desde cerda/camada), fija y bloquea la selección sin deshabilitar (para que FormData lo capture)
        if(forcedLink && forcedLink.type && forcedLink.id){
          lt.value = forcedLink.type;
          lt.onchange();
          lid.value = forcedLink.id;
          lt.style.pointerEvents = "none";
          lid.style.pointerEvents = "none";
          lt.style.opacity = ".75";
          lid.style.opacity = ".75";
        }

        $("#ok").onclick=()=>{
          const fd=new FormData($("#movForm"));
          const date=(fd.get("date")||today()).toString();
          const qty=num(fd.get("qty"));
          if(qty<=0){ toast("bad","Cantidad inválida","Debe ser > 0."); return; }
          const unitCostIn=num(fd.get("unitCost"));
          const totalCostIn=num(fd.get("totalCost"));
          let unitCost = unitCostIn || defaultUnitCostForItem(i.id) || 0;

          // Si es entrada y se ingresó costo total, recalcula costo unitario
          if(mode==="entrada" && totalCostIn>0 && qty>0){
            unitCost = Math.round((totalCostIn/qty)*100)/100;
          }

          if(mode==="salida" && unitCost<=0){
            openAlert({title:"Falta costo", message:"Este insumo no tiene costo unitario. Ingresa un costo unitario o registra una compra/entrada para que el sistema calcule el gasto.", kind:"bad"});
            return;
          }
          const before=num(i.qty);
          const prevUC=num(i.unitCost)||0;

          // Para salidas, descuenta solo lo disponible (evita que quede 0 siempre)
          let appliedQty = qty;
          if(mode==="salida"){
            if(before<=0){
              openAlert({title:"Sin stock", message:`No hay stock disponible de ${i.name}. Registra una entrada/compra antes de suministrar.`, kind:"bad"});
              return;
            }
            if(qty>before){
              appliedQty = before;
              toast("warn","Stock insuficiente",`Pediste ${fmtNum(qty,2)} ${i.unit}. Solo había ${fmtNum(before,2)} ${i.unit}. Se descontó ${fmtNum(appliedQty,2)}.`);
            }
          }

          const delta = mode==="entrada" ? appliedQty : -appliedQty;
          const after = Math.max(0, before + delta);
          i.qty = after;

          // En entradas, actualiza costo promedio ponderado
          if(mode==="entrada" && unitCost>0){

state.stockMovements.push({

  }
}

          // Si es salida y está ligada a un cerdo, registrar evento para historial/rendimiento

          if(mode==="entrada" && $("#asExp")?.checked){

            // total de la compra: si hay totalCost úsalo; si no, qty×unitCost
            const total = totalCost>0 ? totalCost : Math.max(0, qty*unitCost);
            if(total>0){
              let paidNow=num(fd.get("paidNow"));
              if(status==="pagado") paidNow = total;
              if(status==="credito") paidNow = 0;
              paidNow = Math.max(0, Math.min(total, paidNow));

    const s=id?get.sale(id):null;
    openModal({
      title:id?"Editar venta":"Nueva venta",
      sub:"Descuenta stock de lechones y gestiona abonos.",
      body:saleForm(s,preset),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,
      onMount: ()=>{
        const sq=$("#sq"), su=$("#su"), st=$("#st"), ss=$("#ss"), sp=$("#sp");
        const sowSel=$("#saleSow");
        const batchSel=$("#saleBatch");
        const allBatches = state.batches.filter(b=>(String(b.origin||"")!=="engorde_manual") && (b.status||"disponible")!=="cerrado" && num(b.countCurrent)>0);

        const rebuildBatches=(keep="")=>{
          if(!batchSel) return;
          const sowId=(sowSel?.value||"");
          const list = sowId ? allBatches.filter(b=>b.sowId===sowId) : allBatches;
          const ops = list
            .slice()
            .sort((a,b)=>(b.birthDate||"").localeCompare(a.birthDate||""))
            .map(b=>{
              const sow=get.sow(b.sowId);
              return `<option value="${b.id}">${esc(b.birthDate||"—")} • ${esc(sow?.tag||"cerda")} • Disp ${esc(b.countCurrent)}</option>`;
            }).join("");
          batchSel.innerHTML = `<option value="">Selecciona</option>` + ops;
          if(keep && list.some(x=>x.id===keep)) batchSel.value = keep;
        };

        const syncFromBatch=()=>{
          const bb=get.batch(batchSel?.value||"");
          if(bb && sowSel) sowSel.value = bb.sowId||"";
        };

        if(sowSel){
          sowSel.onchange=()=>{
            // al cambiar cerda, resetear camada
            rebuildBatches("");
          };
        }
        if(batchSel){
          batchSel.onchange=()=>{
            syncFromBatch();
            // reconstruir manteniendo la misma camada (por si lista estaba sin filtrar)
            rebuildBatches(batchSel.value);
          };
        }

        // Inicial (si viene con batchId)
        if(batchSel?.value){
          syncFromBatch();
        }
        rebuildBatches(batchSel?.value||"");

        const recalc=()=>{
          const t=Math.max(0,num(sq.value)*num(su.value));
          setMoney(st, t);
          if(ss.value==="pagado") setMoney(sp, t);
          if(ss.value==="credito") setMoney(sp, 0);
          const p=num(sp.value);
          if(p>t) setMoney(sp, t);
        };
        sq.oninput=recalc; su.oninput=recalc; ss.onchange=recalc; sp.oninput=recalc; recalc();

        $("#save").onclick=()=>saveSale(id);
      }
    });
  }

  function saveSale(id){
    const fd=new FormData($("#saleForm"));
    const date=(fd.get("date")||"").toString();
    const clientId=(fd.get("clientId")||"").toString();
    const sowId=(fd.get("sowId")||"").toString();
    const batchId=(fd.get("batchId")||"").toString();
    const qty=num(fd.get("qty"));
    const unitPrice=num(fd.get("unitPrice"));
    const total=Math.max(0, qty*unitPrice);
    let paid=Math.max(0, num(fd.get("paidAmount")));
    let status=(fd.get("status")||"credito").toString();
    const paidMethod = normPayMethod(fd.get("paidMethod")) || "efectivo";
    if(!date||!clientId||!batchId||qty<=0){ openAlert({title:"Faltan datos", message:"Debes seleccionar fecha, cliente, cerda, camada y cantidad.", kind:"bad"}); return; }
    const batch=get.batch(batchId); if(!batch){ openAlert({title:"Camada inválida", message:"Selecciona una camada válida.", kind:"bad"}); return; }
    const sowIdFinal = sowId || (batch?.sowId||"");
    if(!sowIdFinal){ openAlert({title:"Faltan datos", message:"Debes seleccionar la cerda.", kind:"bad"}); return; }
    if(batch.sowId && sowIdFinal && batch.sowId!==sowIdFinal){ openAlert({title:"Cerda/Camada no coinciden", message:"Selecciona la camada correcta para esa cerda.", kind:"bad"}); return; }

    if(!id){
      const available=num(batch.countCurrent);
      if(qty>available){ toast("bad","Stock insuficiente",`Disponible ${available}.`); return; }
    } else {
      const old=get.sale(id);
      if(old && (old.batchId!==batchId || old.qty!==qty)){ toast("warn","Restricción v1","Para cambiar camada/cantidad elimina y crea una nueva venta."); return; }
    }

    if(paid>=total){ paid=total; status="pagado"; }
    else if(paid>0) status="parcial";
    else status=(status==="pagado"?"credito":status);

    const payload={id:id||uid("sale"),date,clientId,sowId:sowIdFinal,batchId,qty,unitPrice,total,status,paidAmount:paid,dueDate:(fd.get("dueDate")||"").toString(),notes:(fd.get("notes")||"").toString().trim()};

    if(id){
      const prev = get.sale(id);
      if(!prev){ toast("bad","No encontrada","La venta no existe."); return; }

      const prevBatch = get.batch(prev.batchId||"");
      const newBatch = get.batch(batchId||"");
      if(!newBatch){
        openAlert({title:"Faltan datos", message:"Selecciona una camada válida.", kind:"bad"});
        return;
      }

      // Disponibilidad: si es la misma camada, permite usar el stock + lo que ya había vendido en esta venta
      const available = num(newBatch.countCurrent) + ((prev.batchId===batchId)?num(prev.qty):0);
      if(qty>available){
        openAlert({
          title:"Stock insuficiente",
          message:`Disponible en la camada: ${fmtNum(available)} und. Estás intentando vender: ${fmtNum(qty)}.`,
          kind:"bad"
        });
        return;
      }

      // Si hay pagos registrados, se usa la suma real
      const paidSum = (state.payments||[]).filter(p=>p.saleId===id).reduce((a,p)=>a+num(p.amount),0);
      const paidFinal = paidSum>0 ? paidSum : paid;
      if(paidFinal>total){
        openAlert({
          title:"Abonos superan el total",
          message:`Esta venta tiene abonos por ${fmtCOP(paidFinal)}. El total (${fmtCOP(total)}) no puede ser menor.`,
          kind:"bad"
        });
        return;
      }

      // Restaurar stock de la venta anterior
      if(prevBatch){
        prevBatch.countCurrent = Math.max(0, num(prevBatch.countCurrent) + num(prev.qty));
        if(num(prevBatch.countCurrent)>0 && (prevBatch.status||"") === "cerrado") prevBatch.status = "disponible";
      }

      // Descontar stock en la nueva venta
      newBatch.countCurrent = Math.max(0, num(newBatch.countCurrent) - qty);
      if(newBatch.countCurrent<=0) newBatch.status="cerrado";

      const sowIdFinal = (sowId || newBatch.sowId || "");
      if(!sowIdFinal){
        openAlert({title:"Faltan datos", message:"Selecciona la cerda (o usa una camada ligada a una cerda).", kind:"bad"});
        return;
      }

      const pending = Math.max(0, total - paidFinal);
      const statusFinal = pending<=0 ? "pagado" : (paidFinal>0 ? "parcial" : "credito");

      const payload={
        id, date, clientId,
        sowId: sowIdFinal,
        batchId,
        qty,
        unitPrice,
        total,
        paidAmount: paidFinal,
        status: statusFinal,
        notes
      };

      state.sales = state.sales.map(x=>x.id===id?payload:x);

      // Actualizar tarea de cobro
      state.tasks = (state.tasks||[]).filter(t=>!(t.relatedType==="sale" && t.relatedId===id && (t.title||"").startsWith("Cobro pendiente")));
      if(pending>0){
        state.tasks.push({
          id:uid("tsk"),
          title:`Cobro pendiente — ${get.client(clientId)?.name||"cliente"}`,
          dueDate:addDays(date,7),
          priority:"alta",
          status:"pendiente",
          relatedType:"sale",
          relatedId:id,
          notes:`Saldo: ${fmtCOP(pending)}`
        });
      }

      save(); dlg.close(); toast("ok","Actualizado","Venta actualizada."); render();
      return;
    }

    state.sales.push(payload);
    batch.countCurrent=Math.max(0, num(batch.countCurrent)-qty);
    if(num(batch.countCurrent)===0) batch.status="cerrado";

    if(paid>0){
      state.payments.push({id:uid("pay"),saleId:payload.id,date,amount:paid,method:paidMethod,notes:"Abono inicial"});
      state.transactions.push({id:uid("tx"),date,type:"ingreso",line:"monta",category:"Venta de lechones",amount:paid,method:paidMethod,refType:"sale",refId:payload.id,notes:`Venta ${payload.id.slice(-6)} • ${qty} und`});
    }
    const pending=Math.max(0,total-paid);
    if(pending>0){
      state.tasks.push({id:uid("tsk"),title:`Cobro pendiente — ${get.client(clientId)?.name||"cliente"}`,dueDate:payload.dueDate||addDays(date,7),priority:"alta",status:"pendiente",relatedType:"sale",relatedId:payload.id,notes:`Saldo: ${fmtCOP(pending)}`});
    }

    save(); dlg.close(); toast("ok","Guardado","Venta registrada."); render();
  }

          s.paidAmount=num(s.paidAmount)+amountV;

  // ------- Carne (ventas conectada a Engorde) -------
  // Nota: el stock de carne se toma SOLO de los cerdos que estén en cajones de engorde.

  function engordePensListForMeat(){
    const pens = (state.pens||[]).filter(p=>String(p.type||"").toLowerCase()==="engorde" && penAcceptsBatch(p));
    const by = new Map();
    pens.forEach(p=>by.set(p.id, {pen:p, lots:0, heads:0, batches:[]}));

    (state.batches||[]).forEach(b=>{
      if((b.status||"disponible")==="cerrado") return;
      const cur = Math.max(0, num(b.countCurrent));
      if(cur<=0) return;
      const pid = String(b.penId||"");
      if(!pid) return; // SOLO si está en cajón
      const p = getPen(pid);
      if(!p || String(p.type||"").toLowerCase()!=="engorde") return;
      if(!by.has(pid)) by.set(pid, {pen:p, lots:0, heads:0, batches:[]});
      const x = by.get(pid);
      x.lots += 1;
      x.heads += cur;
      x.batches.push(b);
    });
    // Animales individuales (solo engorde): suman como cabezas del cajón
    (state.animals||[]).forEach(a=>{
      if(!isAnimalActive(a)) return;
      const pid = String(a.penId||"");
      if(!pid) return;
      const p = getPen(pid);
      if(!p || String(p.type||"").toLowerCase()!=="engorde") return;
      if(!by.has(pid)) by.set(pid, {pen:p, lots:0, heads:0, batches:[]});
      const x = by.get(pid);
      x.heads += 1;
      x.animals = (x.animals||0) + 1;
    });



    const arr = [...by.values()].sort((a,b)=>(a.pen?.name||"").localeCompare(b.pen?.name||""));
    arr.forEach(x=>{
      x.batches.sort((a,b)=>(a.weaningDate||a.birthDate||"").localeCompare(b.weaningDate||b.birthDate||""));
    });
    return arr;
  }

  function meatStockFromEngordePens(){
    const pens = engordePensListForMeat();
    const arrobaKg = Math.max(0, num(state.settings?.arrobaKg) || 12.5);
    const defKg = Math.max(0, num(state.settings?.defaultPigKg) || 100);
    const totalHeads = pens.reduce((s,x)=>s + Math.max(0,num(x.heads)), 0);
    const totalKgEst = pens.reduce((s,x)=>{
      const avg = Math.max(0, num(x.pen?.avgKg || defKg));
      return s + Math.max(0,num(x.heads))*avg;
    }, 0);
    return {pens, totalHeads, totalKgEst, arrobaKg, defKg};
  }

  function penHeadsAvailable(penId){
    const pid = String(penId||"");
    if(!pid) return 0;
    const fromBatches = (state.batches||[])
      .filter(b=>String(b.penId||"")===pid && (b.status||"disponible")!=="cerrado")
      .reduce((s,b)=>s + Math.max(0,num(b.countCurrent)), 0);
    const fromAnimals = countAnimalsInPen(pid);
    return fromBatches + fromAnimals;
  }

  function takeHeadsFromPen(penId, heads){
    const pid = String(penId||"");
    const want = Math.max(0, Math.floor(num(heads)));
    const deductions=[];
    if(!pid || want<=0) return {deducted:0, remaining:want, deductions};

    const batches = (state.batches||[])
      .filter(b=>String(b.penId||"")===pid && (b.status||"disponible")!=="cerrado" && Math.max(0,num(b.countCurrent))>0)
      .slice()
      .sort((a,b)=>(a.weaningDate||a.birthDate||"").localeCompare(b.weaningDate||b.birthDate||""));

    let remaining = want;
    for(const b of batches){
      if(remaining<=0) break;
      const avail = Math.max(0, num(b.countCurrent));
      if(avail<=0) continue;
      const take = Math.min(avail, remaining);
      b.countCurrent = avail - take;
      deductions.push({batchId:b.id, heads:take});
      remaining -= take;
    }
    const deducted = want - remaining;

    // Registrar movimiento de engorde (salida)
    if(deducted>0){
      state.engorde = state.engorde || {manual:[], movements:[]};
      state.engorde.movements = state.engorde.movements || [];
      state.engorde.movements.push({
        id:uid("engmov"),
        date: today(),
        type:"salida",
        heads:deducted,
        before: null,
        after: null,
        reason:`Venta carne (cajón ${pid.slice(-6)})`
      });
    }

    return {deducted, remaining, deductions};
  }

  function revertHeadsDeductions(deds){
    (deds||[]).forEach(d=>{
      if(d.animalId){
        // Restaurar cerdo individual
        try{ restoreAnimalFromDeduction(d); }catch(e){}
        return;
      }
      const b = get.batch(d.batchId);
      if(!b) return;
      b.countCurrent = Math.max(0, num(b.countCurrent) + Math.max(0, num(d.heads)));
      if((b.status||"disponible")==="cerrado" && num(b.countCurrent)>0) b.status = "disponible";
    });
  }

  function applyHeadsDeductions(deds, saleId){
    (deds||[]).forEach(d=>{
      if(d.animalId){
        const a = get.animal(d.animalId);
        if(!a) return;
        a.status = "vendido";
        a.soldAt = nowISO();
        a.saleId = String(saleId||"");
        return;
      }
      const b = get.batch(d.batchId);
      if(!b) return;
      const cur = Math.max(0, num(b.countCurrent));
      const take = Math.max(0, num(d.heads));
      b.countCurrent = Math.max(0, cur - take);
      if(b.countCurrent===0) b.status = "cerrado";
    });
  }

    function meatKgFromSale(s){
    const unit = String(s?.unit||"kg").toLowerCase();
    const q = Math.max(0, num(s?.qty));
    const arrobaKg = Math.max(0, num(state.settings?.arrobaKg) || 12.5);
    if(unit==="kg") return q;
    if(unit==="arroba") return q * arrobaKg;
    if(unit==="completo") return Math.max(0, num(s?.kgEq||0));
    return q;
  }

  function meatHeadsFromSale(s){
    const unit = String(s?.unit||"kg").toLowerCase();
    if(unit==="completo") return Math.max(0, Math.floor(num(s?.qty)));
    return Math.max(0, Math.floor(num(s?.headsUsed||0)));
  }

  function meatStats(){
    const rows=(state.meatSales||[]);
    const total = rows.reduce((a,s)=>a+Math.max(0,num(s.total)),0);
    const paid  = rows.reduce((a,s)=>a+Math.max(0,num(s.paidAmount)),0);
    const pending = Math.max(0, total - paid);
    const kgSold = rows.reduce((a,s)=>a + meatKgFromSale(s),0);
    const headsSold = rows.reduce((a,s)=>a + meatHeadsFromSale(s),0);

    const stock = meatStockFromEngordePens();
    return {total, paid, pending, kgSold, headsSold, stockHeads:stock.totalHeads, stockKgEst:stock.totalKgEst};
  }

  function openPenAvgKg(penId){
    const p = getPen(penId); if(!p) return;
    const defKg = Math.max(0, num(state.settings?.defaultPigKg) || 100);
    openModal({
      title:"Peso promedio (cajón de engorde)",
      sub:`Cajón: ${esc(p.name||"—")}`,
      body:`<form id="avgKgForm" class="grid2">
        <div class="f6"><label>Peso promedio por cerdo (kg)</label><input name="avgKg" type="number" step="0.1" min="0" value="${esc(String(Math.max(0,num(p.avgKg||defKg))))}"/></div>
        <div class="f12 muted">Se usa para estimar equivalencia en kg en ventas por <b>completo</b> y para sugerir cabezas en ventas por peso.</div>
      </form>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="ok">Guardar</button>`,
      onMount: ()=>{
        $("#ok").onclick=()=>{
          const fd = new FormData($("#avgKgForm"));
          p.avgKg = Math.max(0, num(fd.get("avgKg")));
          save(); dlg.close(); toast("ok","Guardado","Peso promedio actualizado."); render();
        };
      }
    });
  }

          <td class="mono">${upStr}</td>
          <td class="mono">${fmtCOP(num(s.total))}</td>
          <td class="mono">${fmtCOP(num(s.paidAmount))}</td>

    let contentHtml = `
      <div class="card" style="margin-top:12px">
        <div class="cardHd"><b>Ventas de carne</b></div>
        <div class="wrap">
          <table class="tblMeatSalesOptimized">
            <thead>
              <tr>
                <th>Fecha</th><th>Cliente</th><th>Cajón</th><th>Tipo</th><th>Cantidad</th><th>Precio/u</th><th>Total</th><th>Abonado</th><th>Estado</th><th class="r">Acciones</th>
              </tr>
            </thead>
            <tbody>${salesRows}</tbody>
          </table>
        </div>
      </div>`;

    if(meatViewId!=='sales'){
      const selected = pens.find(x=>x.pen?.id===meatViewId) || null;
      if(selected){
        const p = selected.pen;
        const cap = (p.capacity!=null && num(p.capacity)>0) ? Math.max(0, Math.floor(num(p.capacity))) : 0;
        const occupancy = cap ? `${fmtNum((Math.max(0,num(selected.heads))/cap)*100,0)}%` : '—';

        const penBatches = (state.batches||[])
          .filter(b=>String(b.penId||'')===p.id && (b.status||'disponible')!=='cerrado' && Math.max(0,num(b.countCurrent))>0)
          .slice()
          .sort((a,b)=>(String((get.sow(a.sowId)?.tag||get.sow(a.sowId)?.name||a.id||''))).localeCompare(String((get.sow(b.sowId)?.tag||get.sow(b.sowId)?.name||b.id||''))));

        const penAnimals = animalsInPen(p.id)
          .filter(a=>isAnimalActive(a))
          .slice()
          .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));

        const rows = [];
        let idx = 1;

        penBatches.forEach(b=>{
          const sow = get.sow(b.sowId);
          const sowLabel = sow?.tag || sow?.name || `Lote ${String(b.id||'').slice(-8)}`;
          const heads = Math.max(0, Math.floor(num(b.countCurrent)));
          const inv = invested.batch(b.id);
          const unitCost = heads ? (Math.max(0, num(inv||0)) / heads) : 0;
          const age = b.birthDate ? daysBetween(b.birthDate, today()) : (b.weaningDate ? daysBetween(b.weaningDate, today()) : null);
          const inDate = b.weaningDate || b.birthDate || '';
          const avg = Math.max(0, num(p.avgKg || stock.defKg));
          for(let i=1;i<=heads;i++){
            rows.push(`<tr>
              <td class="mono">${idx++}</td>
              <td><b>${esc(sowLabel)}</b><div class="muted mono">${esc(String(b.id||'').slice(-8))} · #${i}</div></td>
              <td>Lote</td>
              <td class="mono">${esc(inDate||'—')}</td>
              <td class="mono">${age==null?'—':esc(age)+' d'}</td>
              <td class="mono">${fmtNum(avg,1)} kg</td>
              <td><span class="tag">Disponible</span></td>
              <td class="mono">${fmtCOP(unitCost)}</td>
              <td class="r">

        penAnimals.forEach(a=>{
          const weight = Math.max(0, num(a.weightKg));
          const age = a.createdAt ? daysBetween(String(a.createdAt).slice(0,10), today()) : null;
          const cost = animalCost(a.id);
          rows.push(`<tr>
            <td class="mono">${idx++}</td>
            <td><b>${esc(a.name||'(sin nombre)')}</b><div class="muted mono">${esc(String(a.id||'').slice(-8))}</div></td>
            <td>Individual</td>
            <td class="mono">${esc(a.createdAt?String(a.createdAt).slice(0,10):'—')}</td>
            <td class="mono">${age==null?'—':esc(age)+' d'}</td>
            <td class="mono">${weight?fmtNum(weight,1)+' kg':'—'}</td>
            <td>${a.sick?'<span class="tag bad">Enfermo</span>':'<span class="tag ok">Normal</span>'}</td>
            <td class="mono">${fmtCOP(cost)}</td>
            <td class="r">
              <button class="btn" data-msell-pen="${p.id}">Vender</button>
            </td>
          </tr>`);
        });

        const rowsHtml = rows.join('') || `<tr><td colspan="9" class="muted">No hay cerdos en este cajón.</td></tr>`;

        contentHtml = `
          <div class="card" style="margin-top:12px">
            <div class="cardHd engSelectedHd">
              <div><b>${esc(p.name||'Cajón')}</b></div>
              <div class="miniRow" style="gap:8px;align-items:center">
                <span class="tag">Total: ${fmtNum(selected.heads,0)}</span>
                <span class="tag">Lotes: ${fmtNum(selected.lots,0)}</span>
                <span class="tag">Capacidad: ${cap?fmtNum(cap,0):'—'}</span>
                <span class="tag">Ocupación: ${occupancy}</span>
              </div>
            </div>
            <div class="wrap" style="margin-top:8px">
              <table class="tblMeatPenOptimized">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Cerdo</th>
                    <th>Origen</th>
                    <th>Ingreso</th>
                    <th>Edad</th>
                    <th>Peso</th>
                    <th>Estado</th>
                    <th>Costo</th>
                    <th class="r">Acción</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>`;
      }
    }

    const body = `
      <div class="kpis">
        ${kpi('Cerdos en engorde (stock)', fmtNum(st.stockHeads,0)+' cabezas', st.stockHeads>0?'ok':'warn')}
        ${kpi('Stock estimado (kg)', fmtNum(st.stockKgEst,1)+' kg', st.stockKgEst>0?'info':'warn')}
        ${kpi('Kg vendidos (equiv.)', fmtNum(st.kgSold,2)+' kg', 'info')}
        ${kpi('Ingresos (carne)', fmtCOP(st.total), 'ok')}
        ${kpi('Pendiente por cobrar', fmtCOP(st.pending), st.pending>0?'warn':'ok')}
      </div>
      <div class="engPenSwitch card" style="margin-top:20px;padding-top:8px">
        <div class="engPenButtons" style="padding-top:2px">${switchButtons}</div>
      </div>
      ${contentHtml}

    view.innerHTML = shell('Carne', '', actions, body);

    const btnNew = $('#meatNew');
    const btnEng = $('#goEng');
    if(btnEng) btnEng.onclick=()=>navTo('engorde');
    if(btnNew) btnNew.onclick=()=>openMeatSale(null, meatViewId!=='sales' ? {penId:meatViewId} : {});

    view.onclick = (e)=>{
      const switchBtn = e.target.closest('button[data-meat-view]');
      if(switchBtn){
        meatViewId = switchBtn.dataset.meatView || 'sales';
        renderMeat();
        return;
      }
      const sellPenBtn = e.target.closest('button[data-msell-pen]');
      if(sellPenBtn){
        openMeatSale(null,{penId:sellPenBtn.dataset.msellPen});
        return;
      }
      const avgBtn = e.target.closest('button[data-mavg]');
      if(avgBtn){
        openPenAvgKg(avgBtn.dataset.mavg);
        return;
      }
      const editBtn = e.target.closest('button[data-medit]');
      if(editBtn){
        openMeatSale(editBtn.dataset.medit);
        return;
      }
      const delBtn = e.target.closest('button[data-mdel]');
      if(delBtn){
        delMeatSale(delBtn.dataset.mdel);
        return;
      }
      const payBtn = e.target.closest('button[data-mpay]');
      if(payBtn){
        openMeatPayment(payBtn.dataset.mpay);
        return;
      }
    };
  }

  function openMeatSale(id, ctx={}){
    if(!state.clients.length){ openAlert({title:"Faltan datos", message:"Primero crea un cliente.", kind:"bad"}); return; }

    const allPens = (state.pens||[]).filter(p=>String(p.type||"").toLowerCase()==="engorde" && penAcceptsBatch(p));
    if(!allPens.length){ openAlert({title:"Sin cajones", message:"Crea un cajón de engorde primero.", kind:"bad"}); navTo("engorde"); return; }

    const ms = state.meatSales || [];
    let s = id ? ms.find(x=>x.id===id) : null;

    const pens = allPens.filter(p=>penHeadsAvailable(p.id)>0 || (s && String(s.penId||"")===String(p.id)));
    if(!pens.length){ openAlert({title:"Sin cerdos en engorde", message:"No hay cajones de engorde con cerdos disponibles para vender.", kind:"warn"}); navTo("engorde"); return; }

    // default pen (prioridad: ctx.penId, luego primer pen con stock, luego el primero)
    const penWithStock = pens.find(p=>penHeadsAvailable(p.id)>0);
    const defPenId = String((ctx.penId||"")) || String(penWithStock?.id||pens[0].id);

    const arrobaKg = Math.max(0, num(state.settings?.arrobaKg) || 12.5);
    const defKg = Math.max(0, num(state.settings?.defaultPigKg) || 100);

    s = s || {
      id: uid("meat"),
      date: today(),
      clientId: "",
      penId: defPenId,
      unit: "kg", // kg | arroba | completo
      qty: 0,
      unitPrice: 0,
      total: 0,
      headsUsed: 1,
      avgKg: defKg,
      kgEq: 0,
      status: "credito",
      paidAmount: 0,
      dueDate: "",
      notes: "",
      deductions: []
    };

    const hasPays = !!id && (state.meatPayments||[]).some(p=>p.saleId===id);
    s._lockPay = hasPays || num(s.paidAmount)>0;

    openModal({
      title: id? "Editar venta de carne" : "Nueva venta de carne",
      sub: `Stock disponible (cajón): ${fmtNum(penHeadsAvailable(defPenId),0)} cabezas • Arroba: ${fmtNum(arrobaKg,2)} kg`,
      body: meatSaleForm(s, pens),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="ok">Guardar</button>`,
      onMount: ()=>{
        const unitSel=$("#mUnit");
        const qtyI=$("#mQty");
        const upI=$("#mUP");
        const totalI=$("#mTot");
        const stSel=$("#mStatus");
        const paidI=$("#mPaid");
        const penSel=$("#mPen");
        const headsI=$("#mHeads");
        const avgI=$("#mAvg");
        const lblQty=$("#lblQty");
        const lblUP=$("#lblUP");
        const hint=$("#unitHint");
        const eq=$("#mEq");
        const headsWrap=$("#headsWrap");

        const animalWrap = $("#animalPickWrap");
        const animalList = $("#animalPickList");

        const renderAnimalPick = ()=>{
          if(!animalWrap || !animalList) return;
          const penId = String(penSel.value||defPenId);
          const u = String(unitSel.value||"kg");
          if(u!=="completo"){ animalWrap.style.display="none"; animalList.innerHTML=""; return; }
          animalWrap.style.display="block";
          const list = animalsInPen(penId).slice().sort((a,b)=>(String(a.name||"")).localeCompare(String(b.name||"")));
          if(!list.length){
            animalList.innerHTML = `<div class="f12 muted">No hay cerdos individuales en este cajón. Puedes agregarlos en <b>Engorde</b>.</div>`;
            return;
          }
          const pre = (s && Array.isArray(s.animalIds)) ? s.animalIds.map(String) : [];
          animalList.innerHTML = list.map(a=>{
            const nm = a.name ? a.name : "(sin nombre)";
            const w = Math.max(0, num(a.weightKg));
            const checked = pre.includes(String(a.id)) ? "checked" : "";
            return `<label class="chip" style="display:flex;gap:10px;align-items:center;cursor:pointer;padding:8px;border:1px solid var(--bd);border-radius:12px">
              <input type="checkbox" class="anPick" value="${a.id}" ${checked}/>
              <span><b>${esc(nm)}</b> <span class="muted">${w?fmtNum(w,1)+" kg":"—"}</span></span>
            </label>`;
          }).join("");
          // listeners
          animalList.querySelectorAll("input.anPick").forEach(ch=>{
            ch.onchange=()=>{
              const n = animalList.querySelectorAll("input.anPick:checked").length;
              if(n>0){
                qtyI.value = String(n);
                headsI.value = String(n);
              }
              recalc();
            };
          });
        };


        const syncUnitUI=()=>{
          const u=String(unitSel.value||"kg");
          if(u==="kg"){ lblQty.textContent="Cantidad (kg) *"; lblUP.textContent="Precio por kg (COP) *"; hint.textContent=""; headsWrap.style.display="block"; }
          if(u==="arroba"){ lblQty.textContent="Cantidad (arrobas) *"; lblUP.textContent="Precio por arroba (COP) *"; hint.textContent=`1 arroba = ${fmtNum(arrobaKg,2)} kg`; headsWrap.style.display="block"; }
          if(u==="completo"){ lblQty.textContent="Cantidad (cerdos) *"; lblUP.textContent="Precio por cerdo (COP) *"; hint.textContent="Venta por cerdo completo."; headsWrap.style.display="none"; }
        };

        const recalc=()=>{
          const u=String(unitSel.value||"kg");
          const q=Math.max(0, num(qtyI.value));
          const up=Math.max(0, num(upI.value));
          const total=Math.max(0, q*up);
          setMoney(totalI, total);

          // Kg equivalente
          const avg = Math.max(0, num(avgI.value||defKg));
          let kgEq = 0;
          if(u==="kg") kgEq = q;
          else if(u==="arroba") kgEq = q*arrobaKg;
          else if(u==="completo") kgEq = Math.floor(q)*avg;
          eq.textContent = fmtNum(kgEq,2) + " kg";

          // Cabezas sugeridas
          const penId = String(penSel.value||defPenId);
          const pen = getPen(penId);
          const penAvg = Math.max(0, num(pen?.avgKg || avg || defKg));

          if(u==="completo"){
            // en completo, qty = cabezas
            headsI.value = String(Math.max(0, Math.floor(q)));
          } else {
            const cur = Math.max(0, Math.floor(num(headsI.value||0)));
            if(cur<=0){
              const est = penAvg>0 ? Math.max(1, Math.round(kgEq/penAvg)) : 1;
              headsI.value = String(est);
            }
          }

          // Pagos coherentes
          if(!s._lockPay){
            if(stSel.value==="pagado") setMoney(paidI, total);
            if(stSel.value==="credito") setMoney(paidI, 0);
            const p=num(paidI.value);
            if(p>total) setMoney(paidI, total);
          }
        };

        unitSel.onchange=()=>{ syncUnitUI(); renderAnimalPick(); recalc(); };
        penSel.onchange=()=>{ renderAnimalPick(); recalc(); };
        qtyI.oninput=recalc; upI.oninput=recalc; avgI.oninput=recalc;
        if(!s._lockPay){ stSel.onchange=recalc; paidI.oninput=recalc; }

        syncUnitUI();
        renderAnimalPick();
        recalc();

        $("#ok").onclick=()=>saveMeatSale(id);
      }
    });
  }

  function saveMeatSale(editId){
    const fd=new FormData($("#meatSaleForm"));
    const id = editId || (fd.get("id")||uid("meat")).toString();
    const date=(fd.get("date")||"").toString();
    const clientId=(fd.get("clientId")||"").toString();
    const penId=(fd.get("penId")||"").toString();
    const unit=String(fd.get("unit")||"kg").toLowerCase();

    // Cerdos seleccionados (solo aplica a venta "completo")
    let animalIdsPicked = [];
    try{
      animalIdsPicked = Array.from(document.querySelectorAll("#animalPickList input.anPick:checked")).map(x=>x.value);
    }catch(e){}

    let qty=Math.max(0, num(fd.get("qty")));
    const unitPrice=Math.max(0, num(fd.get("unitPrice")));
    const total=Math.max(0, qty*unitPrice);

    let headsUsed=Math.max(0, Math.floor(num(fd.get("headsUsed"))));
    const arrobaKg=Math.max(0, num(state.settings?.arrobaKg) || 12.5);
    const defKg=Math.max(0, num(state.settings?.defaultPigKg) || 100);
    const avgKg=Math.max(0, num(fd.get("avgKg")) || defKg);

    if(unit==="completo"){
      qty = Math.max(0, Math.floor(qty));
      headsUsed = qty;
    }

    let kgEq = 0;
    if(unit==="kg") kgEq = qty;
    else if(unit==="arroba") kgEq = qty * arrobaKg;
    else if(unit==="completo") kgEq = headsUsed * avgKg;

    let status=(fd.get("status")||"credito").toString();
    let paid=num(fd.get("paidAmount"));
    const paidMethod = normPayMethod(fd.get("paidMethod")) || "efectivo";
    const dueDate=(fd.get("dueDate")||"").toString();
    const notes=(fd.get("notes")||"").toString().trim();

    if(!date||!clientId||!penId||qty<=0||unitPrice<0){
      openAlert({title:"Faltan datos", message:"Debes seleccionar fecha, cliente, cajón, tipo de venta, cantidad y precio.", kind:"bad"}); return;
    }

    // Stock disponible
    const available = penHeadsAvailable(penId);
    if(headsUsed<=0){
      openAlert({title:"Falta stock", message:"Debes indicar cuántas cabezas se vendieron (para descontar del cajón).", kind:"bad"}); return;
    }
    if(headsUsed>available){
      openAlert({title:"Stock insuficiente", message:`En ese cajón hay ${fmtNum(available,0)} cabezas. Intentas vender ${fmtNum(headsUsed,0)}.`, kind:"bad"}); return;
    }

    state.meatSales = state.meatSales || [];
    state.meatPayments = state.meatPayments || [];
    state.transactions = state.transactions || [];
    state.tasks = state.tasks || [];

    const existing = (state.meatSales||[]).find(x=>x.id===id) || null;
    const hasPays = (state.meatPayments||[]).some(p=>p.saleId===id);

    // Si ya tiene pagos registrados, no permitimos editar paid/status desde el formulario
    if(existing && hasPays){
      paid = num(existing.paidAmount);
      status = existing.status || status;
      if(total < paid - 0.01){
        openAlert({title:"Total inválido", message:`Esta venta ya tiene abonos por ${fmtCOP(paid)}. El total no puede ser menor.`, kind:"bad"});
        return;
      }
    } else {
      if(paid>total) paid=total;
      if(status==="pagado") paid = total;
      if(status==="credito") paid = 0;
      if(paid>=total) status="pagado";
      else if(paid>0) status="parcial";
      else status = "credito";
    }

    // Revertir deducciones anteriores (si edita)
    if(existing && Array.isArray(existing.deductions) && existing.deductions.length){
      revertHeadsDeductions(existing.deductions);
    }

    // Aplicar deducción nueva (cerdos individuales + lotes)
    // 1) elegir animales (solo engorde)
    const prefer = (unit==="completo") ? animalIdsPicked : [];
    let chosenAnimalIds = takeAnimalsFromPen(penId, headsUsed, prefer);

    // Si el usuario seleccionó animales en "completo", usamos EXACTAMENTE esos (si son válidos)
    if(unit==="completo" && prefer.length){
      // validar que todos estén activos y en el cajón
      const bad = prefer.find(id=>{
        const a=get.animal(id);
        return !a || !isAnimalActive(a) || String(a.penId||"")!==String(penId||"");
      });
      if(bad){
        openAlert({title:"Selección inválida", message:"Hay cerdos seleccionados que ya no están disponibles en ese cajón.", kind:"bad"});
        return;
      }
      chosenAnimalIds = prefer.slice();
      // fuerza qty/headsUsed a la selección
      qty = chosenAnimalIds.length;
      headsUsed = chosenAnimalIds.length;
      kgEq = headsUsed * avgKg;
    }

    // 2) marcar animales como vendidos y preparar deducciones
    const animalDeds = [];
    chosenAnimalIds.forEach(aid=>{
      const a = get.animal(aid);
      if(!a) return;
      animalDeds.push({animalId: a.id, prevStatus: a.status, prevPenId: a.penId, prevSaleId: a.saleId||""});
      a.status = "vendido";
      a.soldAt = nowISO();
      a.saleId = id;
    });

    // 3) descontar faltante desde lotes (batches)
    const remainingHeads = Math.max(0, headsUsed - chosenAnimalIds.length);
    const take = takeHeadsFromPen(penId, remainingHeads);

    if(take.remaining>0){
      // revertir lo tomado (lotes) y los animales marcados
      revertHeadsDeductions(take.deductions);
      animalDeds.forEach(d=>restoreAnimalFromDeduction(d));

      // volver a aplicar la deducción vieja (por seguridad)
      if(existing && Array.isArray(existing.deductions) && existing.deductions.length){
        applyHeadsDeductions(existing.deductions, existing.id);
      }
      openAlert({title:"No fue posible descontar", message:"No se pudo descontar el stock completo desde el cajón.", kind:"bad"});
      return;
    }

    // evento por animal (venta)
    try{
      chosenAnimalIds.forEach(aid=>{
        logAnimalEvent(aid, "venta", {saleId:id, penId, total, unit, qty});
      });
    }catch(e){}

    const allDeds = [...take.deductions, ...animalDeds];

const payload={
      id,
      date, clientId, penId,
      unit,
      qty, unitPrice, total,
      headsUsed,
      avgKg,
      kgEq,
      status,
      paidAmount: paid,
      dueDate,
      notes,
      animalIds: chosenAnimalIds,
      deductions: allDeds
    };

    const idx = state.meatSales.findIndex(x=>x.id===id);
    if(idx>=0) state.meatSales[idx]=payload;
    else state.meatSales.push(payload);

    // Registrar movimiento de engorde (salida total)
    try{
      state.engorde = state.engorde || {manual:[], movements:[]};
      state.engorde.movements = state.engorde.movements || [];
      state.engorde.movements.push({
        id:uid("engmov"),
        date: today(),
        type:"salida",
        heads: Math.max(0, Math.floor(num(headsUsed))),
        before: null,
        after: null,
        reason:`Venta carne (total ${fmtNum(headsUsed,0)} cabeza(s))`
      });
    }catch(e){}

    // Finanzas: ingreso inicial (solo si NO hay pagos previos)
    state.transactions = state.transactions.filter(tx=>!(tx.refType==="meatSale" && tx.refId===id && String(tx.notes||"").startsWith("Venta carne")));
    if(!hasPays && paid>0){
      const label = unit==="kg"?`${fmtNum(qty,2)} kg`:unit==="arroba"?`${fmtNum(qty,2)} arrobas`:`${fmtNum(qty,0)} cerdos`;

      // Registrar abono inicial (detalle) + movimiento en caja
      state.meatPayments.push({id:uid("mpay"),saleId:id,date,amount:paid,method:paidMethod,notes:"Abono inicial"});

      state.transactions.push({
        id:uid("tx"),
        date,
        type:"ingreso",
        line:"engorde",
        category:"Ventas / carne",
        amount:paid,
        method:paidMethod,
        refType:"meatSale",
        refId:id,
        notes:`Venta carne (${label})`
      });
    }

    // Tarea de cobro si queda pendiente
    const pending = Math.max(0, total - paid);
    state.tasks = state.tasks.filter(t=>!(t.relatedType==="meatSale" && t.relatedId===id));
    if(pending>0){
      state.tasks.push({
        id:uid("task"),
        title:`Cobro pendiente carne (${id.slice(-6)})`,
        dueDate: dueDate || addDays(date, 7),
        priority:"media",
        done:false,
        relatedType:"meatSale",
        relatedId:id,
        notes:`Pendiente: ${fmtCOP(pending)} • Cliente: ${(get.client(clientId)?.name||"")}`
      });
    }

    save(); dlg.close(); toast("ok","Venta guardada", pending>0?`Pendiente: ${fmtCOP(pending)}`:"Pagada"); render();
  }

  function delMeatSale(id){
    const s=get.meatSale(id); if(!s) return;
    openModal({
      title:"Eliminar venta de carne",
      sub:`${s.id.slice(-6)} • ${fmtCOP(num(s.total))}`,
      body:`<div class="muted">Se eliminará la venta y se devolverán las cabezas al cajón (según registro).</div>`,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn danger" id="ok">Eliminar</button>`,
      onMount: ()=>{
        $("#ok").onclick=()=>{
          // Revertir deducciones de engorde
          if(Array.isArray(s.deductions) && s.deductions.length){
            revertHeadsDeductions(s.deductions);
          }

          // Eliminar venta
          state.meatSales = (state.meatSales||[]).filter(x=>x.id!==id);

          // Eliminar pagos y transacciones asociadas
          state.meatPayments = (state.meatPayments||[]).filter(p=>p.saleId!==id);
          state.transactions = (state.transactions||[]).filter(tx=>!(tx.refType==="meatSale" && tx.refId===id));

          // Eliminar tarea asociada
          state.tasks = (state.tasks||[]).filter(t=>!(t.relatedType==="meatSale" && t.relatedId===id));

          save(); dlg.close(); toast("ok","Eliminado","Venta y registros asociados eliminados."); render();
        };
      }
    });
  }

      body:`

          <div class="paySummary">

            <div><b>Últimos abonos</b><div class="muted">Historial (reciente)</div></div>

          <div class="wrap"><table>
            <thead><tr><th>Fecha</th><th>Método</th><th>Valor</th><th>Notas</th></tr></thead>

              ${pays.slice(0,6).map(p=>`<tr><td class="mono">${esc(p.date||"—")}</td><td>${esc(p.method||"—")}</td><td class="mono">${fmtCOP(p.amount)}</td><td>${esc(p.notes||"")}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sin abonos aún.</td></tr>`}
