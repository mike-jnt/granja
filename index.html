        const range=$("#payRange");
        const pct=$("#payPct");
        const bar=$("#payProgBar");
        const clamp=$("#payClamp");
        const nowPaid=$("#payNowPaid");
        const nowPend=$("#payNowPend");
        const afterPaid=$("#payAfterPaid");
        const afterPend=$("#payAfterPend");

        const sync = (src)=>{
          pending = Math.max(0, num(s.total) - num(s.paidAmount));
          const maxv = Math.max(0, Math.floor(pending));
          range.max = String(Math.max(1, maxv||1));

          let v = num(amount.value);
          if(src==="range") v = num(range.value);

          const wasOver = v>pending;
          v = Math.max(0, Math.min(v, pending));

          amount.value = moneyFormatStr(v);
          range.value = String(Math.min(v, maxv));

          clamp.style.display = wasOver ? "inline" : "none";

          const paid1 = Math.min(total, paid0 + v);
          const pend1 = Math.max(0, total - paid1);

          nowPaid.textContent = fmtCOP(paid0);
          nowPend.textContent = fmtCOP(pending);
          afterPaid.textContent = fmtCOP(paid1);
          afterPend.textContent = fmtCOP(pend1);

          const pct1 = total>0 ? Math.min(100, Math.round((paid1/total)*100)) : 0;
          pct.textContent = pct1 + "%";
          bar.style.width = pct1 + "%";
        };

        amount.oninput=()=>sync("amount");
        range.oninput=()=>sync("range");
        $$(".chips button[data-set]").forEach(b=>b.onclick=()=>{
          const k=b.dataset.set;
          let v = 0;
          if(k==="25") v = pending*0.25;
          if(k==="50") v = pending*0.50;
          if(k==="all") v = pending;
          amount.value = moneyFormatStr(v);
          sync("amount");
        });

        sync("amount");

        $("#ok").onclick=()=>{
          const fd=new FormData($("#payForm"));
          const date=(fd.get("date")||today()).toString();
          const method=(fd.get("method")||"efectivo").toString();
          let amountV=num(fd.get("amount"));
          if(amountV<=0){ openAlert({title:"Valor inválido", message:"El abono debe ser mayor a 0.", kind:"bad"}); return; }

          const pendNow=Math.max(0,num(s.total)-num(s.paidAmount));
          amountV=Math.min(amountV, pendNow);
          if(amountV<=0){ openAlert({title:"Sin saldo", message:"No hay saldo pendiente para abonar.", kind:"bad"}); return; }

          s.paidAmount=num(s.paidAmount)+amountV;
          const newPending=Math.max(0,num(s.total)-num(s.paidAmount));
          s.status=newPending<=0?"pagado":"parcial";

          state.meatPayments = state.meatPayments || [];
          state.meatPayments.push({id:uid("mpay"),saleId:s.id,date,amount:amountV,method,notes:(fd.get("notes")||"").toString().trim()});
          state.transactions.push({id:uid("tx"),date,type:"ingreso",line:"engorde",category:"Ventas / carne",amount:amountV,method,refType:"meatSale",refId:s.id,notes:`Abono carne ${s.id.slice(-6)} (${label})`});

          // cerrar tarea
          state.tasks = state.tasks || [];
          if(newPending<=0){
            state.tasks = state.tasks.filter(t=>!(t.relatedType==="meatSale" && t.relatedId===s.id));
          }

          save(); dlg.close(); toast("ok","Abono registrado",`Nuevo saldo: ${fmtCOP(newPending)}`); render();
        };
      }
    });
  }



// ------- Informe por línea de producción -------
  function inRange(dateStr, from, to){
    if(!dateStr) return false;
    const d = String(dateStr).slice(0,10);
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  }
  function inferLineFromTx(tx){
    const l = (tx && tx.line) ? String(tx.line) : "";
    if(l) return l;
    const rt = String(tx?.refType||"");
    if(rt==="sale") return "monta";
    if(rt==="meatSale") return "engorde";
    return "general";
  }
  function inferLineFromMov(m){
    const lt = String(m?.linkedType||"");
    const lid = String(m?.linkedId||"");
    if(lt==="sow") return "gestacion";
    if(lt==="engorde") return "engorde";
    if(lt==="batch"){
      const b = get.batch(lid);
      const w = b?.weaningDate ? String(b.weaningDate).slice(0,10) : "";
      const md = m?.date ? String(m.date).slice(0,10) : "";
      // Si hay destete y el movimiento es posterior o igual, lo imputamos a Engorde
      if(w && md && md >= w) return "engorde";
      return "monta";
    }
    return "general";
  }
  function movCostEntrada(m){
    // Preferir totalCost si se registró; si no, qty×unitCost
    const q = Math.abs(num(m?.qty));
    const total = num(m?.totalCost);
    if(total>0) return total;
    return q * Math.max(0, num(m?.unitCost));
  }
  function cashLineReport(from, to){
    const out = {monta:{in:0,out:0}, engorde:{in:0,out:0}, gestacion:{in:0,out:0}, general:{in:0,out:0}};
    (state.transactions||[]).forEach(tx=>{
            if(tx?.nonCash) return;
if(!inRange(tx?.date, from, to)) return;
      const line = inferLineFromTx(tx);
      if(!(line in out)) out[line] = {in:0,out:0};
      if(tx.type==="ingreso") out[line].in += Math.max(0, num(tx.amount));
      if(tx.type==="gasto") out[line].out += Math.max(0, num(tx.amount));
    });
    return out;
  }
  function productionLineReport(from, to){
    const out = {
      monta:{sold:0, qty:0, paid:0, consumed:0},
      engorde:{sold:0, kg:0, paid:0, consumed:0},
      gestacion:{sold:0, paid:0, consumed:0}
    };

    // Ventas de lechones (por fecha de venta)
    (state.sales||[]).forEach(s=>{
      if(!inRange(s?.date, from, to)) return;
      out.monta.sold += Math.max(0, num(s.total));
      out.monta.qty  += Math.max(0, num(s.qty));
    });

    // Ventas de carne (kg)
    (state.meatSales||[]).forEach(s=>{
      if(!inRange(s?.date, from, to)) return;
      out.engorde.sold += Math.max(0, num(s.total));
      out.engorde.kg   += Math.max(0, meatKgFromSale(s));
    });

    // Cobros (caja) imputados por línea usando transacciones
    (state.transactions||[]).forEach(tx=>{
      if(tx?.type!=="ingreso") return;
      if(!inRange(tx?.date, from, to)) return;
      const line = inferLineFromTx(tx);
      if(line==="monta") out.monta.paid += Math.max(0, num(tx.amount));
      else if(line==="engorde") out.engorde.paid += Math.max(0, num(tx.amount));
      else if(line==="gestacion") out.gestacion.paid += Math.max(0, num(tx.amount));
    });

    // Consumo de insumos (salidas de inventario)
    (state.stockMovements||[]).forEach(m=>{
      if(m?.type!=="salida") return;
      if(!inRange(m?.date, from, to)) return;
      const line = inferLineFromMov(m);
      const c = moveCost(m);
      if(line==="monta") out.monta.consumed += c;
      else if(line==="engorde") out.engorde.consumed += c;
      else if(line==="gestacion") out.gestacion.consumed += c;
    });

    return out;
  }

  function openLineDetail(lineId, from, to){
    const labelMap = {
      monta:"Monta / Lechones",
      engorde:"Engorde / Carne",
      gestacion:"Cerdas (gestación)",
      general:"General"
    };
    const line = String(lineId||"general");
    const label = labelMap[line] || line;
    const f = (from||"").toString();
    const t = (to||"").toString();

    const txs = (state.transactions||[])
      .filter(tx=>!tx?.nonCash && inRange(tx?.date, f, t) && inferLineFromTx(tx)===line)
      .slice()
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    const sumTx = (type)=>txs.filter(x=>x.type===type).reduce((s,x)=>s+Math.max(0,num(x.amount)),0);
    const inc = sumTx("ingreso");
    const out = sumTx("gasto");
    const net = inc - out;

    const groupByCategory = (arr, type)=>{
      const m = new Map();
      arr.filter(x=>x.type===type).forEach(x=>{
        const k = (x.category||"(sin categoría)").toString();
        m.set(k, (m.get(k)||0) + Math.max(0,num(x.amount)));
      });
      return [...m.entries()].sort((a,b)=>b[1]-a[1]);
    };

    const incCats = groupByCategory(txs, "ingreso");
    const outCats = groupByCategory(txs, "gasto");

    const sales = line==="monta"
      ? (state.sales||[]).filter(s=>inRange(s?.date, f, t)).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      : [];
    const meatSales = line==="engorde"
      ? (state.meatSales||[]).filter(s=>inRange(s?.date, f, t)).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      : [];

    const sold = line==="monta" ? sales.reduce((s,x)=>s+Math.max(0,num(x.total)),0)
               : line==="engorde" ? meatSales.reduce((s,x)=>s+Math.max(0,num(x.total)),0)
               : 0;

    const soldQty = line==="monta" ? sales.reduce((s,x)=>s+Math.max(0,num(x.qty)),0) : 0;
    const soldKg  = line==="engorde" ? meatSales.reduce((s,x)=>s+Math.max(0, meatKgFromSale(x)),0) : 0;

    const movs = (state.stockMovements||[])
      .filter(m=>m?.type==="salida" && inRange(m?.date, f, t) && inferLineFromMov(m)===line)
      .slice()
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    const consumed = movs.reduce((s,m)=>s+moveCost(m),0);
    const prodNet = (line==="gestacion") ? (0 - consumed) : (sold - consumed);

    const rangeDays = (f && t) ? Math.max(1, daysBetween(f, t) + 1) : 0;
    const costUnit = line==="monta" ? (soldQty>0 ? consumed/soldQty : 0)
                   : line==="engorde" ? (soldKg>0 ? consumed/soldKg : 0)
                   : (rangeDays>0 ? consumed/rangeDays : 0);

    // Consumo por insumo
    const byItem = new Map();
    movs.forEach(m=>{
      const id = String(m?.itemId||"");
      if(!id) return;
      const item = get.inv(id);
      const name = item?.name || "Insumo";
      const unit = item?.unit || "";
      const prev = byItem.get(id) || {name, unit, qty:0, cost:0};
      prev.qty += Math.abs(num(m.qty));
      prev.cost += moveCost(m);
      byItem.set(id, prev);
    });
    const items = [...byItem.values()].sort((a,b)=>b.cost-a.cost);

    const itemRows = items.slice(0,12).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mono">${fmtNum(x.qty,2)}</td><td class="muted">${esc(x.unit)}</td><td class="mono">${fmtCOP(x.cost)}</td></tr>`).join("");

    const txRows = txs.slice(0,60).map(x=>{
      const tag = x.type==="ingreso"?`<span class="tag ok">Ingreso</span>`:`<span class="tag bad">Gasto</span>`;
      return `<tr><td class="mono">${esc(x.date||"—")}</td><td>${tag}</td><td><b>${esc(x.category||"—")}</b><div class="muted">${esc(x.method||"")}</div></td><td class="mono">${fmtCOP(x.amount)}</td><td class="muted">${esc(x.notes||"")}</td></tr>`;
    }).join("");

    const catTable = (title, arr)=>{
      const rows = arr.slice(0,8).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="mono">${fmtCOP(v)}</td></tr>`).join("");
      return `<div class="helpCard" style="margin-top:12px"><div class="helpHd"><b>${esc(title)}</b></div><div class="wrap" style="margin-top:10px"><table><thead><tr><th>Categoría</th><th>Total</th></tr></thead><tbody>${rows||`<tr><td colspan="2" class="muted">Sin datos.</td></tr>`}</tbody></table></div></div>`;
    };

    const salesRows = line==="monta" ? sales.slice(0,40).map(s=>{
      const c = get.client(s.clientId);
      const pend = Math.max(0, num(s.total)-num(s.paidAmount));
      const st = s.status==="pagado"?`<span class="tag ok">Pagado</span>`:s.status==="parcial"?`<span class="tag warn">Parcial</span>`:`<span class="tag bad">Pendiente</span>`;
      return `<tr><td class="mono">${esc(s.date)}</td><td><b>${esc(c?.name||"—")}</b></td><td class="mono">${esc(s.qty)}</td><td class="mono">${fmtCOP(s.total)}</td><td>${st}<div class="muted">Pend: ${fmtCOP(pend)}</div></td></tr>`;
    }).join("") : "";

    const meatRows = line==="engorde" ? meatSales.slice(0,40).map(s=>{
      const pend = Math.max(0, num(s.total)-num(s.paidAmount));
      const st = s.status==="pagado"?`<span class="tag ok">Pagado</span>`:s.status==="parcial"?`<span class="tag warn">Parcial</span>`:`<span class="tag bad">Pendiente</span>`;
      return `<tr><td class="mono">${esc(s.date)}</td><td><b>${esc(get.client(s.clientId)?.name||"—")}</b></td><td class="mono">${fmtNum(num(s.qty),2)}</td><td class="mono">${fmtCOP(s.total)}</td><td>${st}<div class="muted">Pend: ${fmtCOP(pend)}</div></td></tr>`;
    }).join("") : "";

    const payOpen = (state.payables||[])
      .filter(p=>(p.status||"abierto")!=="cerrado" && String(p.line||"general")==line)
      .slice()
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    const payRows = payOpen.slice(0,25).map(p=>{
      const rem = Math.max(0, num(p.total)-num(p.paid));
      return `<tr><td class="mono">${esc(p.date||"—")}</td><td><b>${esc(p.itemName||"Compra")}</b><div class="muted">${esc(p.supplier||"")}</div></td><td class="mono">${fmtCOP(rem)}</td><td class="mono">${esc(p.dueDate||"—")}</td></tr>`;
    }).join("");

    const quickBtns = `
      <div class="miniRow" style="gap:8px;flex-wrap:wrap;margin-top:10px">
        ${line==="monta"?`<button class="btn" id="goSales">Ir a Ventas</button>`:""}
        ${line==="engorde"?`<button class="btn" id="goSales">Ir a Ventas</button> <button class="btn" id="goEng">Ir a Engorde</button>`:""}
        <button class="btn" id="goInv">Ir a Inventario</button>
      </div>
    `;

    openModal({
      title:`Detalle por línea • ${label}`,
      sub:`Rango: ${f||"—"} → ${t||"—"}`,
      body:`
        <div class="kpis" style="margin-bottom:10px">
          <div class="kpi" style="grid-column:span 4"><small>Caja • Ingresos</small><b>${fmtCOP(inc)}</b><div class="muted mono">Transacciones</div></div>
          <div class="kpi" style="grid-column:span 4"><small>Caja • Gastos</small><b>${fmtCOP(out)}</b><div class="muted mono">Transacciones</div></div>
          <div class="kpi" style="grid-column:span 4"><small>Caja • Resultado</small><b>${fmtCOP(net)}</b><div class="muted mono">Ingresos - gastos</div></div>
          <div class="kpi" style="grid-column:span 4"><small>Producción • Resultado</small><b>${fmtCOP(prodNet)}</b><div class="muted mono">Vendido - insumos</div></div>
        </div>

        <div class="helpCard">
          <div class="helpHd">
            <div>
              <b>Producción</b>
              <div class="muted">Vendido: <b class="mono">${fmtCOP(sold)}</b> • Insumos: <b class="mono">${fmtCOP(consumed)}</b> • Costo ${line==="monta"?"/lechón":line==="engorde"?"/kg":"/día"}: <b class="mono">${costUnit>0?fmtCOP(costUnit):"—"}</b></div>
            </div>
            <span class="tag ok">Resultado: <b class="mono">${fmtCOP(prodNet)}</b></span>
          </div>

          ${line==="monta"?`
            <div class="wrap" style="margin-top:10px"><table>
              <thead><tr><th>Fecha</th><th>Cliente</th><th>Cant.</th><th>Total</th><th>Estado</th></tr></thead>
              <tbody>${salesRows||`<tr><td colspan="5" class="muted">Sin ventas en el rango.</td></tr>`}</tbody>
            </table></div>
          `:""}

          ${line==="engorde"?`
            <div class="wrap" style="margin-top:10px"><table>
              <thead><tr><th>Fecha</th><th>Cliente</th><th>Kg</th><th>Total</th><th>Estado</th></tr></thead>
              <tbody>${meatRows||`<tr><td colspan="5" class="muted">Sin ventas en el rango.</td></tr>`}</tbody>
            </table></div>
          `:""}

          <div class="wrap" style="margin-top:10px"><table>
            <thead><tr><th>Insumo (top)</th><th>Cant.</th><th>Und.</th><th>Costo</th></tr></thead>
            <tbody>${itemRows||`<tr><td colspan="4" class="muted">Sin consumos ligados en el rango.</td></tr>`}</tbody>
          </table></div>
        </div>

        ${catTable("Ingresos por categoría", incCats)}
        ${catTable("Gastos por categoría", outCats)}

        <div class="helpCard" style="margin-top:12px">
          <div class="helpHd"><b>Cuentas por pagar pendientes</b><div class="muted">Compras imputadas a esta línea.</div></div>
          <div class="wrap" style="margin-top:10px"><table>
            <thead><tr><th>Fecha</th><th>Compra</th><th>Pendiente</th><th>Vence</th></tr></thead>
            <tbody>${payRows||`<tr><td colspan="4" class="muted">Sin cuentas por pagar.</td></tr>`}</tbody>
          </table></div>
        </div>

        <div class="helpCard" style="margin-top:12px">
          <div class="helpHd"><b>Transacciones (últimas 60)</b><div class="muted">Caja registrada para esta línea en el rango.</div></div>
          <div class="wrap" style="margin-top:10px"><table>
            <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Valor</th><th>Notas</th></tr></thead>
            <tbody>${txRows||`<tr><td colspan="5" class="muted">Sin transacciones.</td></tr>`}</tbody>
          </table></div>
        </div>

        ${quickBtns}
      `,
      footer:`<button class="btn" id="mClose">Cerrar</button>` ,
      onMount: ()=>{
        const b1 = document.getElementById("goSales");
        if(b1) b1.onclick=()=>{ dlg.close(); goTab("sales"); };
        const b3 = document.getElementById("goEng");
        if(b3) b3.onclick=()=>{ dlg.close(); goTab("engorde"); };
        const b4 = document.getElementById("goInv");
        if(b4) b4.onclick=()=>{ dlg.close(); goTab("inv"); };
      }
    });
  }




// ------- Finanzas -------
  function renderFinance(){
    const curM = today().slice(0,7);

    // Periodo: "" = mes actual, "__all__" = todo, "YYYY-MM" = mes
    const monthsAll = getAvailableMonths();
    if(financePeriod && financePeriod!=="__all__" && /^\d{4}-\d{2}$/.test(financePeriod) && !monthsAll.includes(financePeriod)){
      monthsAll.unshift(financePeriod);
    }
    const periodMonth = (financePeriod==="" ? curM : (financePeriod==="__all__" ? null : financePeriod));
    const label = periodMonth ? periodMonth : "Histórico";

    const income = sumTx("ingreso", periodMonth||"");
    const expense = sumTx("gasto", periodMonth||"");
    const payOpen=(state.payables||[]).filter(p=>(p.status||"abierto")!=="cerrado");
    const payPending=payOpen.reduce((s,p)=>s+Math.max(0,num(p.total)-num(p.paid)),0);

    // --- Informe por línea (rango) ---
    if(!lineFrom) lineFrom = curM + "-01";
    if(!lineTo) lineTo = today();

    const cash = cashLineReport(lineFrom, lineTo);
    const prod = productionLineReport(lineFrom, lineTo);

    const lineLabel = (id)=>({
      monta:"Monta / Lechones",
      engorde:"Engorde / Carne",
      gestacion:"Cerdas (gestación)",
      general:"General"
    }[id]||id);

    const cashRows = ["monta","engorde","gestacion","general"].map(id=>{
      const inc = Math.max(0, num(cash[id]?.in));
      const out = Math.max(0, num(cash[id]?.out));
      const net = inc - out;
      const tag = id==="monta"?"info":(id==="engorde"?"ok":(id==="gestacion"?"warn":""));
      const tagHtml = tag ? `<span class="tag ${tag}">${esc(id)}</span>` : `<span class="tag">${esc(id)}</span>`;
      return `<tr>
        <td><b>${esc(lineLabel(id))}</b> ${tagHtml}</td>
        <td class="mono">${fmtCOP(inc)}</td>
        <td class="mono">${fmtCOP(out)}</td>
        <td class="mono">${fmtCOP(net)}</td>
        <td><button class="btn" data-act="lineDetail" data-line="${id}">Detalle</button></td>
      </tr>`;
    }).join("");

    const cashTotIn = Object.values(cash).reduce((a,x)=>a+Math.max(0,num(x?.in)),0);
    const cashTotOut = Object.values(cash).reduce((a,x)=>a+Math.max(0,num(x?.out)),0);

    const prodMNet = Math.max(0, num(prod.monta.sold)) - Math.max(0, num(prod.monta.consumed));
    const prodENet = Math.max(0, num(prod.engorde.sold)) - Math.max(0, num(prod.engorde.consumed));
    const prodGNet = 0 - Math.max(0, num(prod.gestacion.consumed));
    const rangeDays = (lineFrom && lineTo) ? Math.max(1, daysBetween(lineFrom, lineTo) + 1) : 0;
    const montaCostUnit = num(prod.monta.qty) > 0 ? (num(prod.monta.consumed) / num(prod.monta.qty)) : 0;
    const engordeCostKg = num(prod.engorde.kg) > 0 ? (num(prod.engorde.consumed) / num(prod.engorde.kg)) : 0;
    const gestacionCostDay = rangeDays>0 ? (num(prod.gestacion.consumed) / rangeDays) : 0;


    const reportCard = `
      <div class="card" style="margin-top:12px">
        <div class="cardHd">
          <b>Informe por línea de producción</b>
          <div class="muted">Rango: <span class="mono">${esc(lineFrom)}</span> → <span class="mono">${esc(lineTo)}</span></div>
        </div>
        <div class="bd">
          <div class="miniRow" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
            <div style="min-width:220px">
              <label class="muted" style="display:block;margin-bottom:6px">Desde</label>
              <input type="date" id="lineFrom" value="${esc(lineFrom)}"/>
            </div>
            <div style="min-width:220px">
              <label class="muted" style="display:block;margin-bottom:6px">Hasta</label>
              <input type="date" id="lineTo" value="${esc(lineTo)}"/>
            </div>
            <div class="muted" style="flex:1">
              <div><b>Reglas:</b> Insumos ligados a <b>Camada</b> pasan a <b>Engorde</b> si el movimiento es ≥ <b>destete</b>. Insumos ligados a <b>Cerda</b> se imputan a <b>Gestación</b>.</div>
            </div>
          </div>

          <div class="helpCard" style="margin-top:12px">
            <div class="helpHd">
              <div>
                <b>Caja (transacciones)</b>
                <div class="muted">Ingresos/gastos registrados en Finanzas (ventas, pagos, compras y manuales).</div>
              </div>
              <span class="tag info">Total neto: <b class="mono">${fmtCOP(cashTotIn - cashTotOut)}</b></span>
            </div>
            <div class="wrap" style="margin-top:10px"><table>
              <thead><tr><th>Línea</th><th>Ingresos</th><th>Gastos</th><th>Resultado</th><th>Acciones</th></tr></thead>
              <tbody>
                ${cashRows}
                <tr>
                  <td><b>Total</b></td>
                  <td class="mono"><b>${fmtCOP(cashTotIn)}</b></td>
                  <td class="mono"><b>${fmtCOP(cashTotOut)}</b></td>
                  <td class="mono"><b>${fmtCOP(cashTotIn - cashTotOut)}</b></td>
                  <td></td>
                </tr>
              </tbody>
            </table></div>
          </div>

          <div class="helpCard" style="margin-top:12px">
            <div class="helpHd">
              <div>
                <b>Producción (ventas + consumo de insumos)</b>
                <div class="muted">Utilidad estimada = vendido − consumo de insumos (no incluye mano de obra/servicios salvo que los registres como gasto con línea).</div>
              </div>
              <span class="tag ok">Total estimado: <b class="mono">${fmtCOP(prodMNet + prodENet + prodGNet)}</b></span>
            </div>
            <div class="wrap" style="margin-top:10px"><table>
              <thead><tr><th>Línea</th><th>Vendido</th><th>Cobrado</th><th>Consumo insumos</th><th>Resultado estimado</th><th>Acciones</th></tr></thead>
              <tbody>
                <tr>
                  <td><b>Monta / Lechones</b><div class="muted">${fmtNum(num(prod.monta.qty),0)} lechones • Costo/lechón: ${montaCostUnit>0?fmtCOP(montaCostUnit):"—"}</div></td>
                  <td class="mono">${fmtCOP(num(prod.monta.sold))}</td>
                  <td class="mono">${fmtCOP(num(prod.monta.paid))}</td>
                  <td class="mono">${fmtCOP(num(prod.monta.consumed))}</td>
                  <td class="mono">${fmtCOP(prodMNet)}</td>
                  <td><button class="btn" data-act="lineDetail" data-line="monta">Detalle</button></td>
                </tr>
                <tr>
                  <td><b>Engorde / Carne</b><div class="muted">${fmtNum(num(prod.engorde.kg),2)} kg • Costo/kg: ${engordeCostKg>0?fmtCOP(engordeCostKg):"—"}</div></td>
                  <td class="mono">${fmtCOP(num(prod.engorde.sold))}</td>
                  <td class="mono">${fmtCOP(num(prod.engorde.paid))}</td>
                  <td class="mono">${fmtCOP(num(prod.engorde.consumed))}</td>
                  <td class="mono">${fmtCOP(prodENet)}</td>
                  <td><button class="btn" data-act="lineDetail" data-line="engorde">Detalle</button></td>
                </tr>
                <tr>
                  <td><b>Cerdas (gestación)</b><div class="muted">Centro de costo • Costo/día: ${gestacionCostDay>0?fmtCOP(gestacionCostDay):"—"}</div></td>
                  <td class="mono">${fmtCOP(0)}</td>
                  <td class="mono">${fmtCOP(num(prod.gestacion.paid))}</td>
                  <td class="mono">${fmtCOP(num(prod.gestacion.consumed))}</td>
                  <td class="mono">${fmtCOP(prodGNet)}</td>
                  <td><button class="btn" data-act="lineDetail" data-line="gestacion">Detalle</button></td>
                </tr>
              </tbody>
            </table></div>
          </div>
        </div>
      </div>
    `;

    const rows=state.transactions
      .filter(t=>matchQ(t.date,t.type,t.category,t.method,t.notes,t.line) && (financePeriod==="__all__" ? true : monthKey(t.date)===(periodMonth||curM)))
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      .map(t=>{
        const line = inferLineFromTx(t);
        const nonCashTag = t.nonCash ? `<span class="tag info">No caja</span>` : ``;
        const tag = line==="monta"?"info":(line==="engorde"?"ok":(line==="gestacion"?"warn":""));
        return `<tr>
          <td class="mono">${esc(t.date||"—")}</td>
          <td>${t.type==="ingreso"?`<span class="tag ok">Ingreso</span>`:`<span class="tag bad">Gasto</span>`}</td>
          <td>${tag?`<span class="tag ${tag}">${esc(line)}</span>`:`<span class="tag">${esc(line)}</span>`}</td>
          <td><b>${esc(t.category||"—")}</b> ${nonCashTag}<div class="muted">${esc(t.method||"")}</div></td>
          <td class="mono">${esc(fmtCOP(t.amount))}</td>
          <td class="muted">${esc(t.notes||"")}</td>
          <td>${t.nonCash?`<span class="muted">—</span>`:`<button class="btn danger" data-act="del" data-id="${t.id}">Eliminar</button>`}</td>
        </tr>`;
      }).join("");

    const payRows = (state.payables||[])
      .filter(p=>matchQ(p.date,p.supplier,p.itemName,p.notes,p.status,p.dueDate,p.line))
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      .map(p=>{
        const total=num(p.total), paid=num(p.paid);
        const rem=Math.max(0,total-paid);
        const st=(p.status||"abierto");
        const line = p.line ? String(p.line) : "general";
        const tag = line==="monta"?"info":(line==="engorde"?"ok":(line==="gestacion"?"warn":""));
        return `<tr>
          <td class="mono">${esc(p.date||"—")}</td>
          <td>${tag?`<span class="tag ${tag}">${esc(line)}</span>`:`<span class="tag">${esc(line)}</span>`}</td>
          <td><b>${esc(p.itemName||"Compra")}</b><div class="muted">${esc(p.supplier||"")}</div></td>
          <td class="mono">${esc(fmtCOP(total))}</td>
          <td class="mono">${esc(fmtCOP(paid))}</td>
          <td class="mono">${esc(fmtCOP(rem))}</td>
          <td class="mono">${esc(p.dueDate||"—")}</td>
          <td>${st==="cerrado"?`<span class="tag ok">Cerrado</span>`:`<span class="tag warn">Pendiente</span>`}</td>
          <td>${rem>0?`<button class="btn primary" data-act="pay" data-id="${p.id}">Pagar</button>`:`<span class="muted">—</span>`}</td>
        </tr>`;
      }).join("");

    
    // Selector de periodo (mes / todo)
    const monthOptList = monthsAll.filter(x=>x!==curM);
    const monthOps = monthOptList.map(mm=>`<option value="${mm}" ${financePeriod===mm?"selected":""}>${mm}</option>`).join("");
    const periodOptions = `
      <option value="" ${financePeriod===""?"selected":""}>Mes actual (${curM})</option>
      <option value="__all__" ${financePeriod==="__all__"?"selected":""}>Todo el historial</option>
      ${monthOps}
    `;
    const periodBar = `
      <div class="finance-period-wrap">
        <div class="helpCard finance-period-card">
          <div class="helpHd">
            <div>
              <b>Periodo / Histórico</b>
              <div class="muted">Elige un mes o ve todo el historial.</div>
            </div>
            <div class="finance-period-controls">
              <button class="btn" id="finPrevM" type="button" aria-label="Mes anterior">◀</button>
              <select id="finMonthSel">${periodOptions}</select>
              <button class="btn" id="finNextM" type="button" aria-label="Mes siguiente">▶</button>
              <span class="tag info">${financePeriod==="__all__"?"Todo el historial":esc(label)}</span>
            </div>
          </div>
        </div>
      </div>
    `;

    // Tabla de histórico mensual (por año)
    const years = Array.from(new Set(monthsAll.map(x=>String(x).slice(0,4)))).sort((a,b)=>b.localeCompare(a));
    if(!financeHistYear) financeHistYear = curM.slice(0,4);
    if(years.length && !years.includes(financeHistYear)) financeHistYear = years[0] || curM.slice(0,4);
    const yearOps = years.map(y=>`<option value="${y}" ${y===financeHistYear?"selected":""}>${y}</option>`).join("");
    const monthsYear = monthsAll
      .filter(x=>String(x).startsWith(financeHistYear + "-"))
      .sort((a,b)=>String(b).localeCompare(String(a)));

    const histRows = monthsYear.map(mm=>{
      const from = mm + "-01";
      const to = (mm===curM) ? today() : monthEndISO(mm);
      const incM = sumTx("ingreso", mm);
      const expM = sumTx("gasto", mm);
      const netM = incM - expM;

      const prodM = productionLineReport(from, to);

      const pigQty = Math.max(0, num(prodM.monta?.qty));
      const pigSold = Math.max(0, num(prodM.monta?.sold));
      const meatKg = Math.max(0, num(prodM.engorde?.kg));
      const meatSold = Math.max(0, num(prodM.engorde?.sold));

      const ins = Math.max(0, num(prodM.monta?.consumed)) + Math.max(0, num(prodM.engorde?.consumed)) + Math.max(0, num(prodM.gestacion?.consumed));
      const est = (Math.max(0,num(prodM.monta?.sold)) - Math.max(0,num(prodM.monta?.consumed)))
                + (Math.max(0,num(prodM.engorde?.sold)) - Math.max(0,num(prodM.engorde?.consumed)))
                - (Math.max(0,num(prodM.gestacion?.consumed)));

      return `<tr>
        <td class="mono"><b>${esc(mm)}</b><div class="muted">${esc(from)} → ${esc(to)}</div></td>
        <td class="mono">${fmtCOP(incM)}</td>
        <td class="mono">${fmtCOP(expM)}</td>
        <td class="mono">${fmtCOP(netM)}</td>
        <td class="mono">${fmtNum(pigQty,0)} <span class="muted">lech.</span><div class="muted">${fmtCOP(pigSold)}</div></td>
        <td class="mono">${fmtNum(meatKg,2)} <span class="muted">kg</span><div class="muted">${fmtCOP(meatSold)}</div></td>
        <td class="mono">${fmtCOP(ins)}</td>
        <td class="mono">${fmtCOP(est)}</td>
        <td><button class="btn" data-act="openMonth" data-month="${esc(mm)}">Ver</button></td>
      </tr>`;
    }).join("");

    const histCard = `
      <div class="helpCard finance-hist-card" style="margin-top:12px">
        <div class="helpHd">
          <div>
            <b>Histórico mensual</b>
            <div class="muted">Resumen por mes (ingresos, gastos y producción).</div>
          </div>
          <div class="finance-hist-controls">
            <span class="muted">Año</span>
            <select id="histYear">${yearOps}</select>
            <span class="tag info">${monthsYear.length} mes(es)</span>
          </div>
        </div>
        <div class="wrap" style="margin-top:10px"><table>
          <thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Neto</th><th>Lechones</th><th>Carne</th><th>Insumos</th><th>Resultado est.</th><th></th></tr></thead>
          <tbody>${histRows || `<tr><td colspan="9" class="muted">Sin datos para ese año.</td></tr>`}</tbody>
        </table></div>
        <div class="muted" style="margin-top:8px;font-size:12px">Tip: toca “Ver” para filtrar ese mes y ajustar el rango del informe.</div>
      </div>
    `;
view.innerHTML = shell(
      "Finanzas",
      "Ingresos y gastos (ventas e inventario alimentan automáticamente).",
      `<button class="btn primary" id="inc"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-plus" xlink:href="#i-plus"></use></svg><span>Ingreso</span></button>
       <button class="btn" id="exp"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-minus" xlink:href="#i-minus"></use></svg><span>Gasto</span></button>
       <button class="btn" id="csv">Exportar CSV</button>`,
      `${periodBar}
      <div class="kpis" style="margin-bottom:12px">
        <div class="kpi" style="grid-column:span 4"><small>Ingresos (${esc(label)})</small><b>${fmtCOP(income)}</b><div class="muted mono">Ventas + abonos</div></div>
        <div class="kpi" style="grid-column:span 4"><small>Gastos (${esc(label)})</small><b>${fmtCOP(expense)}</b><div class="muted mono">Compras + manual</div></div>
        <div class="kpi" style="grid-column:span 4"><small>Resultado</small><b>${fmtCOP(income-expense)}</b><div class="muted mono">Ingreso - gasto</div></div>
        <div class="kpi" style="grid-column:span 4"><small>CxP pendientes</small><b class="mono">${esc(fmtCOP(payPending))}</b><div class="muted mono">Compras a crédito/parcial</div></div>
      </div>
      ${reportCard}
      ${histCard}
      <div class="wrap" style="margin-top:12px"><table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Línea</th><th>Categoría</th><th>Valor</th><th>Notas</th><th>Acción</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="7" class="muted">Sin transacciones.</td></tr>`}</tbody>
      </table></div>
      <div class="wrap" style="margin-top:12px"><table>
        <thead><tr><th>Fecha</th><th>Línea</th><th>Compra</th><th>Total</th><th>Pagado</th><th>Pendiente</th><th>Vence</th><th>Estado</th><th>Acción</th></tr></thead>
        <tbody>${payRows||`<tr><td colspan="9" class="muted">Sin cuentas por pagar.</td></tr>`}</tbody>
      </table></div>`
    );

    $("#inc").onclick=()=>openTx("ingreso");
    $("#exp").onclick=()=>openTx("gasto");
    $("#csv").onclick=()=>exportTxCSV();
    const ms = $("#finMonthSel");
    if(ms) ms.onchange=()=>{
      financePeriod = (ms.value||"").toString();
      if(financePeriod !== "__all__"){
        const mm = financePeriod==="" ? curM : financePeriod;
        lineFrom = mm + "-01";
        lineTo = (mm===curM) ? today() : monthEndISO(mm);
      }
      render();
    };

    const prevB = $("#finPrevM");
    if(prevB) prevB.onclick=()=>{
      if(financePeriod==="__all__") financePeriod = "";
      const base = (financePeriod==="" ? curM : financePeriod);
      const mm = addMonthsKey(base, -1);
      financePeriod = (mm===curM) ? "" : mm;
      lineFrom = mm + "-01";
      lineTo = (mm===curM) ? today() : monthEndISO(mm);
      render();
    };

    const nextB = $("#finNextM");
    if(nextB) nextB.onclick=()=>{
      if(financePeriod==="__all__") financePeriod = "";
      const base = (financePeriod==="" ? curM : financePeriod);
      let mm = addMonthsKey(base, 1);
      if(mm.localeCompare(curM) > 0){
        mm = curM;
        financePeriod = "";
      }else{
        financePeriod = mm;
      }
      lineFrom = mm + "-01";
      lineTo = (mm===curM) ? today() : monthEndISO(mm);
      render();
    };

    const hy = $("#histYear");
    if(hy) hy.onchange=()=>{ financeHistYear = (hy.value||"").toString(); render(); };



    const lf=$("#lineFrom");
    const lt=$("#lineTo");
    if(lf) lf.onchange=()=>{ lineFrom = (lf.value||"").toString(); render(); };
    if(lt) lt.onchange=()=>{ lineTo = (lt.value||"").toString(); render(); };

    view.onclick=(e)=>{
      const b=e.target.closest("button[data-act]"); if(!b) return;
      if(b.dataset.act==="openMonth"){ const mm=(b.dataset.month||"").toString(); if(mm){ financePeriod = (mm===curM) ? "" : mm; lineFrom = mm + "-01"; lineTo = (mm===curM) ? today() : monthEndISO(mm); } render(); return; }
      if(b.dataset.act==="lineDetail"){ openLineDetail(b.dataset.line, lineFrom, lineTo); return; }
      if(b.dataset.act==="pay"){ openPayablePay(b.dataset.id); return; }
      if(b.dataset.act==="del") { state.transactions=state.transactions.filter(t=>t.id!==b.dataset.id); save(); toast("ok","Eliminada","Transacción eliminada."); render(); }
    };
  }

      <div class="f4"><label>Línea</label>
        <select name="line">
          <option value="general" selected>General</option>
          <option value="monta">Monta / lechones</option>
          <option value="engorde">Engorde / carne</option>
          <option value="gestacion">Cerdas (gestación)</option>
        </select>

  function openTx(type){
    openModal({
      title:type==="ingreso"?"Nuevo ingreso":"Nuevo gasto",
      sub:"Registro manual (aparte de lo automático).",
      body:txForm(type),
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="save">Guardar</button>`,

        $("#save").onclick=()=>{
          const fd=new FormData($("#txForm"));
          const date=(fd.get("date")||today()).toString();
          const tp=(fd.get("type")||type).toString();
          const amount=num(fd.get("amount"));
          if(amount<=0){ toast("bad","Valor inválido","Debe ser > 0."); return; }
          state.transactions.push({id:uid("tx"),date,type:tp,line:(fd.get("line")||"general").toString(),category:(fd.get("category")||"").toString().trim()||"—",amount,method:(fd.get("method")||"efectivo").toString(),refType:"manual",refId:"",notes:(fd.get("notes")||"").toString().trim()});
          save(); dlg.close(); toast("ok","Guardado","Transacción registrada."); render();
        };
      }
    });
  }

  // ------- Cuentas por pagar (compras a crédito/parcial) -------
  function openPayablePay(pid){
    const p=get.payable(pid); if(!p) return;
    const total = num(p.total);
    const paid0 = num(p.paid);
    let remain = Math.max(0, total - paid0);
    if(remain<=0){ toast("ok","Sin saldo","Esta cuenta ya está pagada."); return; }

    const hist = (p.payments||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const pct0 = total>0 ? Math.min(100, Math.round((paid0/total)*100)) : 0;

    openModal({
      title:"Registrar pago",
      sub:`${p.itemName||"Compra"} • Pendiente: ${fmtCOP(remain)}`,
      body:`
        <div class="payTop">
          <div class="paySummary">
            <div class="payKpi"><div class="muted">Total</div><b>${fmtCOP(total)}</b></div>
            <div class="payKpi"><div class="muted">Pagado</div><b class="mono" id="cxpNowPaid">${fmtCOP(paid0)}</b></div>
            <div class="payKpi"><div class="muted">Pendiente</div><b class="mono" id="cxpNowPend">${fmtCOP(remain)}</b></div>
          </div>
          <div class="prog"><div class="bar" id="cxpBar" style="width:${pct0}%"></div></div>
          <div class="muted" style="margin-top:8px">Progreso: <b id="cxpPct">${pct0}%</b></div>
        </div>

        <form id="payF" class="grid2" style="margin-top:12px">
          <div class="f4"><label>Fecha</label><input type="date" name="date" value="${today()}"/></div>
          <div class="f4"><label>Método</label>
            <select name="method">
              ${payMethodOptions("efectivo")}
            </select>
          </div>

          <div class="f12">
            <label>Valor a pagar (COP) *</label>
            <input type="number" id="cxpAmount" name="amount" min="0" step="1" value="${Math.min(remain, total)}"/>
            <input type="range" id="cxpRange" min="0" max="${Math.max(1, Math.floor(remain))}" step="1" value="${Math.min(remain, total)}"/>
            <div class="chips">
              <button class="btn chip" type="button" data-set="25">25%</button>
              <button class="btn chip" type="button" data-set="50">50%</button>
              <button class="btn chip" type="button" data-set="all">Todo</button>
              <span class="muted" id="cxpClamp" style="display:none;margin-left:auto">Se ajustó al pendiente.</span>
            </div>
            <div class="helpLine">
              Después de este pago: <b class="mono" id="cxpAfterPaid">${fmtCOP(Math.min(total, paid0 + Math.min(remain,total)))}</b>
              • Pendiente: <b class="mono" id="cxpAfterPend">${fmtCOP(Math.max(0, total - (paid0 + Math.min(remain,total))))}</b>
            </div>
          </div>

          <div class="f12"><label>Notas</label><textarea name="notes" placeholder="Referencia, observación…"></textarea></div>
        </form>

        <div class="helpCard" style="margin-top:12px">
          <div class="helpHd">
            <div><b>Historial de pagos</b><div class="muted">Esta cuenta</div></div>
            <span class="tag info">${hist.length}</span>
          </div>
          <div class="wrap"><table>
            <thead><tr><th>Fecha</th><th>Método</th><th>Valor</th><th>Notas</th></tr></thead>
            <tbody>
              ${hist.slice(0,6).map(x=>`<tr><td class="mono">${esc(x.date||"—")}</td><td>${esc(x.method||"—")}</td><td class="mono">${fmtCOP(x.amount)}</td><td>${esc(x.notes||"")}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sin pagos aún.</td></tr>`}
            </tbody>
          </table></div>
        </div>
      `,
      footer:`<button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="ok">Registrar pago</button>`,
      onMount: ()=>{
        const amount=$("#cxpAmount");
        const range=$("#cxpRange");
        const pct=$("#cxpPct");
        const bar=$("#cxpBar");
        const clamp=$("#cxpClamp");
        const nowPaid=$("#cxpNowPaid");
        const nowPend=$("#cxpNowPend");
        const afterPaid=$("#cxpAfterPaid");
        const afterPend=$("#cxpAfterPend");

        const round100=(x)=>x;

        const sync=(src)=>{
          remain = Math.max(0, num(p.total) - num(p.paid));
          const maxv = Math.max(0, Math.floor(remain));
          range.max = String(Math.max(1, maxv||1));

          let v = num(amount.value);
          if(src==="range") v = num(range.value);

          const wasOver = v>remain;
          v = Math.max(0, Math.min(v, remain));
          v = round100(v);
          if(v>remain) v = remain;

          amount.value = moneyFormatStr(v);
          range.value = String(Math.min(v, maxv));
          // mantiene el input formateado
          amount.value = moneyFormatStr(v);

          clamp.style.display = wasOver ? "inline" : "none";

          const paid1 = Math.min(total, paid0 + v);
          const pend1 = Math.max(0, total - paid1);

          nowPaid.textContent = fmtCOP(paid0);
          nowPend.textContent = fmtCOP(remain);
          afterPaid.textContent = fmtCOP(paid1);
          afterPend.textContent = fmtCOP(pend1);

          const pct1 = total>0 ? Math.min(100, Math.round((paid1/total)*100)) : 0;
          pct.textContent = pct1 + "%";
          bar.style.width = pct1 + "%";
        };

        amount.oninput=()=>sync("amount");
        range.oninput=()=>sync("range");
        $$(".chips button[data-set]").forEach(b=>b.onclick=()=>{
          const k=b.dataset.set;
          let v=0;
          if(k==="25") v = remain*0.25;
          if(k==="50") v = remain*0.50;
          if(k==="all") v = remain;
          amount.value = moneyFormatStr(round100(v));
          sync("amount");
        });
        sync("amount");

        $("#ok").onclick=()=>{
          const fd=new FormData($("#payF"));
          const date=(fd.get("date")||today()).toString();
          const method=(fd.get("method")||"efectivo").toString();
          let amountV=num(fd.get("amount"));
          if(amountV<=0){ openAlert({title:"Valor inválido", message:"El pago debe ser mayor a 0.", kind:"bad"}); return; }

          const remainNow=Math.max(0, num(p.total)-num(p.paid));
          amountV=Math.min(round100(amountV), remainNow);
          if(amountV<=0){ openAlert({title:"Sin saldo", message:"No hay saldo pendiente en esta cuenta.", kind:"bad"}); return; }

          // registra gasto
          state.transactions.push({
            id:uid("tx"),
            date,
            type:"gasto",
            line: (p.line?String(p.line):"general"),
            category:p.category||"Inventario / compra",
            amount:amountV,
            method,
            refType:"inventory",
            refId:p.refId||"",
            notes:`Pago compra: ${p.itemName||"insumo"}${p.supplier?(" • "+p.supplier):""}`.trim()
          });

          // guarda historial interno de la CxP
          p.payments = p.payments || [];
          p.payments.push({date, amount:amountV, method, notes:(fd.get("notes")||"").toString().trim()});

          // actualiza CxP
          p.paid = num(p.paid) + amountV;
          if(num(p.paid) >= num(p.total) - 0.0001){
            p.paid = num(p.total);
            p.status = "cerrado";
          }else{
            p.status = "abierto";
          }

          save(); dlg.close(); toast("ok","Pago registrado",`Pendiente: ${fmtCOP(Math.max(0,num(p.total)-num(p.paid)))}`); render();
        };
      }
    });
  }



  // ------- Contable -------
  function contableClassLabel(v){
    return ({activo:"Activo",pasivo:"Pasivo",patrimonio:"Patrimonio",ingreso:"Ingreso",gasto:"Gasto"})[String(v||"").toLowerCase()] || "Otro";
  }
  function contableNatureForClass(cls){
    return (String(cls||"").toLowerCase()==="activo" || String(cls||"").toLowerCase()==="gasto") ? "debito" : "credito";
  }
  function contableAccountById(id){
    normalizeAccountingState();
    return (state.accounting.chartAccounts||[]).find(a=>String(a.id)===String(id)) || null;
  }
  function contableChart(){
    normalizeAccountingState();
    return (state.accounting.chartAccounts||[]).slice().sort((a,b)=>String(a.code||"").localeCompare(String(b.code||"")));
  }
  function contableCashAccountId(method){
    const map = {
      acct_cash:"acc_110505",
      acct_bank:"acc_111005",
      acct_nequi:"acc_111010",
      acct_daviplata:"acc_111015",
      acct_wallet:"acc_111020",
      acct_nocash:"acc_143505"
    };
    const mm = state.accounting?.methodMap || {};
    const key = mm[normPayMethod(method)] || "acct_cash";
    return map[key] || "acc_110505";
  }
  function contableExpenseAccount(category, notes=""){
    const s = `${category||""} ${notes||""}`.toLowerCase();
    if(s.includes("alimento") || s.includes("concentrado") || s.includes("nutri")) return "acc_513505";
    if(s.includes("medic") || s.includes("vacuna") || s.includes("sanidad") || s.includes("antib") || s.includes("vitam")) return "acc_513510";
    if(s.includes("insumo") || s.includes("implement") || s.includes("bolsa") || s.includes("guante")) return "acc_513515";
    return "acc_519595";
  }
  function contableIncomeAccount(line, category=""){
    const l = String(line||"").toLowerCase();
    const c = String(category||"").toLowerCase();
    if(l==="monta" || c.includes("lechon")) return "acc_413505";
    if(l==="engorde" || c.includes("carne") || c.includes("engorde")) return "acc_413510";
    return "acc_417595";
  }
  function contablePeriodRange(){
    if(accountingPeriod && accountingPeriod!=="__all__" && /^\d{4}-\d{2}$/.test(accountingPeriod)){
      const curM = today().slice(0,7);
      return {
        from: accountingPeriod + "-01",
        to: accountingPeriod===curM ? today() : monthEndISO(accountingPeriod),
        label: accountingPeriod
      };
    }
    return {from:"", to:today(), label:"Histórico completo"};
  }
  function contableNormKey(s){
    return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  }
  function contablePushEntry(list, entry){
    const lines = (entry.lines||[]).filter(x=>Math.abs(num(x.debit))+Math.abs(num(x.credit))>0.0001).map(x=>({
      accountId:String(x.accountId||""),
      debit:Math.max(0, num(x.debit)),
      credit:Math.max(0, num(x.credit)),
      notes:String(x.notes||"")
    })).filter(x=>x.accountId && (x.debit>0 || x.credit>0));
    const deb = lines.reduce((s,x)=>s+num(x.debit),0);
    const cre = lines.reduce((s,x)=>s+num(x.credit),0);
    if(!lines.length) return;
    if(Math.abs(deb-cre)>0.01) return;
    list.push({
      id:String(entry.id||uid("je")),
      date:String(entry.date||today()),
      source:String(entry.source||"manual"),
      concept:String(entry.concept||"Asiento"),
      sourceId:String(entry.sourceId||""),
      thirdParty:String(entry.thirdParty||""),
      costCenter:String(entry.costCenter||""),
      lines
    });
  }
  function contableBuildJournal(){
    normalizeAccountingState();
    const entries = [];
    const owner = state.accounting?.owner || {};
    const capital = Math.max(0, num(owner.initialCapital));
    if(capital>0){
      contablePushEntry(entries, {
        id:"owner_capital_opening",
        date: owner.openingDate || today(),
        source:"apertura",
        concept:"Capital aportado por propietario",
        thirdParty:"Propietario",
        lines:[
          {accountId:"acc_110505", debit:capital, credit:0},
          {accountId:"acc_310505", debit:0, credit:capital}
        ]
      });
    }

    (state.accounting.entries||[]).forEach(e=>{
      contablePushEntry(entries, {
        id:e.id,
        date:e.date,
        source:"manual",
        concept:e.concept,
        sourceId:e.id,
        thirdParty:e.thirdParty||"",
        costCenter:e.costCenter||"",
        lines:[
          {accountId:e.debitAccountId, debit:e.amount, credit:0, notes:e.notes||""},
          {accountId:e.creditAccountId, debit:0, credit:e.amount, notes:e.notes||""}
        ]
      });
    });

    (state.sales||[]).forEach(s=>{
      const total = Math.max(0, num(s.total));
      if(!s.date || total<=0) return;
      const pays = (state.payments||[]).filter(p=>String(p.saleId||"")===String(s.id||""));
      const sameDay = pays.filter(p=>String(p.date||"")===String(s.date||""));
      const later = pays.filter(p=>String(p.date||"")!==String(s.date||""));
      const byMethod = new Map();
      sameDay.forEach(p=>{
        const accId = contableCashAccountId(p.method);
        byMethod.set(accId, (byMethod.get(accId)||0) + Math.max(0, num(p.amount)));
      });
      const sameDayTotal = Array.from(byMethod.values()).reduce((a,b)=>a+b,0);
      const receivable = Math.max(0, total - sameDayTotal);
      const lines = [];
      byMethod.forEach((amount, accId)=>{ if(amount>0) lines.push({accountId:accId, debit:amount, credit:0}); });
      if(receivable>0) lines.push({accountId:"acc_130505", debit:receivable, credit:0});
      lines.push({accountId:contableIncomeAccount("monta", "lechones"), debit:0, credit:total});
      const client = get.client ? get.client(s.clientId) : null;
      contablePushEntry(entries, {
        id:`sale_${s.id}`,
        date:s.date,
        source:"venta_lechones",
        sourceId:s.id,
        concept:`Venta de lechones ${s.id.slice(-6)}${client?.name ? ` • ${client.name}` : ""}`,
        thirdParty:client?.name||"",
        costCenter:"Lechones",
        lines
      });
      later.forEach((p, idx)=>{
        const amount = Math.max(0, num(p.amount));
        if(amount<=0 || !p.date) return;
        contablePushEntry(entries, {
          id:`sale_pay_${p.id||s.id+'_'+idx}`,
          date:p.date,
          source:"recaudo_lechones",
          sourceId:s.id,
          concept:`Recaudo venta de lechones ${s.id.slice(-6)}`,
          thirdParty:client?.name||"",
          costCenter:"Lechones",
          lines:[
            {accountId:contableCashAccountId(p.method), debit:amount, credit:0},
            {accountId:"acc_130505", debit:0, credit:amount}
          ]
        });
      });
    });

    (state.meatSales||[]).forEach(s=>{
      const total = Math.max(0, num(s.total));
      if(!s.date || total<=0) return;
      const pays = (state.meatPayments||[]).filter(p=>String(p.saleId||"")===String(s.id||""));
      const sameDay = pays.filter(p=>String(p.date||"")===String(s.date||""));
      const later = pays.filter(p=>String(p.date||"")!==String(s.date||""));
      const byMethod = new Map();
      sameDay.forEach(p=>{
        const accId = contableCashAccountId(p.method);
        byMethod.set(accId, (byMethod.get(accId)||0) + Math.max(0, num(p.amount)));
      });
      const sameDayTotal = Array.from(byMethod.values()).reduce((a,b)=>a+b,0);
      const receivable = Math.max(0, total - sameDayTotal);
      const lines = [];
      byMethod.forEach((amount, accId)=>{ if(amount>0) lines.push({accountId:accId, debit:amount, credit:0}); });
      if(receivable>0) lines.push({accountId:"acc_130505", debit:receivable, credit:0});
      lines.push({accountId:contableIncomeAccount("engorde", "carne"), debit:0, credit:total});
      const client = get.client ? get.client(s.clientId) : null;
      contablePushEntry(entries, {
        id:`meat_${s.id}`,
        date:s.date,
        source:"venta_engorde",
        sourceId:s.id,
        concept:`Venta de engorde / carne ${s.id.slice(-6)}${client?.name ? ` • ${client.name}` : ""}`,
        thirdParty:client?.name||"",
        costCenter:"Engorde",
        lines
      });
      later.forEach((p, idx)=>{
        const amount = Math.max(0, num(p.amount));
        if(amount<=0 || !p.date) return;
        contablePushEntry(entries, {
          id:`meat_pay_${p.id||s.id+'_'+idx}`,
          date:p.date,
          source:"recaudo_engorde",
          sourceId:s.id,
          concept:`Recaudo venta de engorde / carne ${s.id.slice(-6)}`,
          thirdParty:client?.name||"",
          costCenter:"Engorde",
          lines:[
            {accountId:contableCashAccountId(p.method), debit:amount, credit:0},
            {accountId:"acc_130505", debit:0, credit:amount}
          ]
        });
      });
    });

    (state.payables||[]).forEach(p=>{
      const total = Math.max(0, num(p.total));
      if(!p.date || total<=0) return;
      const laterPays = (p.payments||[]).slice();
      const laterPaid = laterPays.reduce((s,x)=>s+Math.max(0, num(x.amount)),0);
      const initialCash = Math.max(0, Math.min(total, num(p.paid) - laterPaid));
      const credit = Math.max(0, total - initialCash);
      const supplier = String(p.supplier||"").trim();
      const itemName = String(p.itemName||p.notes||"Compra").trim();
      const lines = [{accountId:"acc_143505", debit:total, credit:0}];
      if(initialCash>0) lines.push({accountId:contableCashAccountId(p.method), debit:0, credit:initialCash});
      if(credit>0) lines.push({accountId:"acc_220505", debit:0, credit:credit});
      contablePushEntry(entries, {
        id:`payable_${p.id}`,
        date:p.date,
        source:"compra_credito",
        sourceId:p.id,
        concept:`Compra inventario ${itemName}`,
        thirdParty:supplier,
        costCenter:p.line==="engorde" ? "Engorde" : (p.line==="monta" ? "Lechones" : "Inventario"),
        lines
      });
      laterPays.forEach((pay, idx)=>{
        const amount = Math.max(0, num(pay.amount));
        if(amount<=0 || !pay.date) return;
        contablePushEntry(entries, {
          id:`payable_pay_${pay.id||p.id+'_'+idx}`,
          date:pay.date,
          source:"pago_proveedor",
          sourceId:p.id,
          concept:`Pago a proveedor ${itemName}`,
          thirdParty:supplier,
          costCenter:p.line==="engorde" ? "Engorde" : (p.line==="monta" ? "Lechones" : "Inventario"),
          lines:[
            {accountId:"acc_220505", debit:amount, credit:0},
            {accountId:contableCashAccountId(pay.method||p.method), debit:0, credit:amount}
          ]
        });
      });
    });

    const payablePurchaseKeys = new Set((state.payables||[]).map(p=>`${String(p.date||"")}|${contableNormKey(p.itemName||p.notes||"")}`));
    (state.transactions||[]).forEach(tx=>{
      const date = String(tx.date||"");
      const amount = Math.max(0, num(tx.amount));
      if(!date || amount<=0) return;
      const refType = String(tx.refType||"");
      const notes = String(tx.notes||"");
      const cat = String(tx.category||"");

      if(refType==="manual"){
        const isCapital = contableNormKey(cat + " " + notes).includes("capital") || contableNormKey(cat + " " + notes).includes("aporte");
        const debitAcc = tx.type==="gasto" ? contableExpenseAccount(cat, notes) : contableCashAccountId(tx.method);
        const creditAcc = tx.type==="gasto" ? contableCashAccountId(tx.method) : (isCapital ? "acc_310505" : contableIncomeAccount(tx.line, cat));
        contablePushEntry(entries, {
          id:`tx_${tx.id}`,
          date,
          source:"mov_manual",
          sourceId:tx.id,
          concept:notes || cat || (tx.type==="gasto"?"Gasto manual":"Ingreso manual"),
          costCenter: tx.line==="engorde" ? "Engorde" : (tx.line==="monta" ? "Lechones" : "General"),
          lines: tx.type==="gasto"
            ? [{accountId:debitAcc, debit:amount, credit:0},{accountId:creditAcc, debit:0, credit:amount}]
            : [{accountId:debitAcc, debit:amount, credit:0},{accountId:creditAcc, debit:0, credit:amount}]
        });
        return;
      }

      if(refType==="mov" && tx.type==="gasto"){
        contablePushEntry(entries, {
          id:`mov_${tx.id}`,
          date,
          source:"consumo_inventario",
          sourceId:tx.id,
          concept:notes || "Consumo de inventario",
          costCenter: tx.line==="engorde" ? "Engorde" : (tx.line==="monta" ? "Lechones" : "General"),
          lines:[
            {accountId:contableExpenseAccount(cat, notes), debit:amount, credit:0},
            {accountId:"acc_143505", debit:0, credit:amount}
          ]
        });
        return;
      }

      if(refType==="inventory" && tx.type==="gasto" && /^Compra:/i.test(notes)){
        const k = `${date}|${contableNormKey(notes.replace(/^Compra:/i, ""))}`;
        if(payablePurchaseKeys.has(k)) return;
        contablePushEntry(entries, {
          id:`invbuy_${tx.id}`,
          date,
          source:"compra_inventario",
          sourceId:tx.id,
          concept:notes || "Compra de inventario",
          costCenter: tx.line==="engorde" ? "Engorde" : (tx.line==="monta" ? "Lechones" : "Inventario"),
          lines:[
            {accountId:"acc_143505", debit:amount, credit:0},
            {accountId:contableCashAccountId(tx.method), debit:0, credit:amount}
          ]
        });
        return;
      }

      if(refType==="sale" || refType==="meatSale") return;
      if(refType==="inventory" && /^Pago compra:/i.test(notes)) return;

      if(tx.type==="ingreso"){
        contablePushEntry(entries, {
          id:`othin_${tx.id}`,
          date,
          source:"otros_ingresos",
          sourceId:tx.id,
          concept:notes || cat || "Ingreso",
          costCenter: tx.line==="engorde" ? "Engorde" : (tx.line==="monta" ? "Lechones" : "General"),
          lines:[
            {accountId:contableCashAccountId(tx.method), debit:amount, credit:0},
            {accountId:contableIncomeAccount(tx.line, cat), debit:0, credit:amount}
          ]
        });
      }else if(tx.type==="gasto"){
        contablePushEntry(entries, {
          id:`othex_${tx.id}`,
          date,
          source:"otros_gastos",
          sourceId:tx.id,
          concept:notes || cat || "Gasto",
          costCenter: tx.line==="engorde" ? "Engorde" : (tx.line==="monta" ? "Lechones" : "General"),
          lines:[
            {accountId:contableExpenseAccount(cat, notes), debit:amount, credit:0},
            {accountId:contableCashAccountId(tx.method), debit:0, credit:amount}
          ]
        });
      }
    });

    entries.sort((a,b)=> String(a.date||"").localeCompare(String(b.date||"")) || String(a.id||"").localeCompare(String(b.id||"")));
    return entries;
  }
  function contableFilterEntries(entries, from="", to=""){
    return (entries||[]).filter(e=>{
      const d = String(e.date||"");
      if(from && d<from) return false;
      if(to && d>to) return false;
      return true;
    });
  }
  function contableLedgerSnapshot(to=""){
    const chart = contableChart();
    const map = new Map(chart.map(a=>[a.id, {account:a, debit:0, credit:0}]));
    contableBuildJournal().forEach(entry=>{
      const d = String(entry.date||"");
      if(to && d>to) return;
      (entry.lines||[]).forEach(line=>{
        if(!map.has(line.accountId)){
          map.set(line.accountId, {account:{id:line.accountId, code:line.accountId, name:line.accountId, class:"otro", nature:"debito"}, debit:0, credit:0});
        }
        const row = map.get(line.accountId);
        row.debit += Math.max(0, num(line.debit));
        row.credit += Math.max(0, num(line.credit));
      });
    });
    return Array.from(map.values());
  }
  function contableTrialBalance(from="", to=""){
    const base = contableLedgerSnapshot(to);
    const periodMap = new Map(base.map(r=>[r.account.id,{debitMov:0,creditMov:0}]));
    contableFilterEntries(contableBuildJournal(), from, to).forEach(entry=>{
      (entry.lines||[]).forEach(line=>{
        const row = periodMap.get(line.accountId) || {debitMov:0,creditMov:0};
        row.debitMov += Math.max(0, num(line.debit));
        row.creditMov += Math.max(0, num(line.credit));
        periodMap.set(line.accountId,row);
      });
    });
    return base.map(r=>{
      const acc = r.account;
      const nature = String(acc.nature||contableNatureForClass(acc.class));
      const net = nature==="debito" ? (r.debit-r.credit) : (r.credit-r.debit);
      return {
        account:acc,
        debitMov:periodMap.get(acc.id)?.debitMov||0,
        creditMov:periodMap.get(acc.id)?.creditMov||0,
        debit:r.debit,
        credit:r.credit,
        balance:net,
        balanceSide:net>=0 ? nature : (nature==="debito"?"credito":"debito")
      };
    }).sort((a,b)=>String(a.account.code||"").localeCompare(String(b.account.code||"")));
  }
  function contableResults(from="", to=""){
    const rows = new Map();
    contableFilterEntries(contableBuildJournal(), from, to).forEach(entry=>{
      (entry.lines||[]).forEach(line=>{
        const acc = contableAccountById(line.accountId);
        if(!acc || !["ingreso","gasto"].includes(String(acc.class||""))) return;
        if(!rows.has(acc.id)) rows.set(acc.id, {account:acc, debit:0, credit:0});
        const r = rows.get(acc.id);
        r.debit += Math.max(0, num(line.debit));
        r.credit += Math.max(0, num(line.credit));
      });
    });
    const list = Array.from(rows.values()).map(r=>({
      account:r.account,
      amount:String(r.account.class)==="ingreso" ? Math.max(0, r.credit-r.debit) : Math.max(0, r.debit-r.credit)
    })).filter(r=>r.amount>0.0001).sort((a,b)=>String(a.account.code||"").localeCompare(String(b.account.code||"")));
    const income = list.filter(r=>r.account.class==="ingreso");
    const expense = list.filter(r=>r.account.class==="gasto");
    const totalIncome = income.reduce((s,r)=>s+r.amount,0);
    const totalExpense = expense.reduce((s,r)=>s+r.amount,0);
    return {income, expense, totalIncome, totalExpense, net: totalIncome-totalExpense};
  }
  function contableBalanceSheet(to=""){
    const trial = contableTrialBalance("", to);
    const assets = [], liabilities = [], equity = [];
    let currentResult = 0;
    trial.forEach(r=>{
      const cls = String(r.account.class||"");
      const val = Math.max(0, r.balance);
      if(val<=0.0001) return;
      if(cls==="activo") assets.push({...r, amount:val});
      else if(cls==="pasivo") liabilities.push({...r, amount:val});
      else if(cls==="patrimonio") equity.push({...r, amount:val});
      else if(cls==="ingreso") currentResult += val;
      else if(cls==="gasto") currentResult -= val;
    });
    if(Math.abs(currentResult)>0.0001){
      equity.push({account:{id:"virtual_profit", code:"360599", name:"Resultado acumulado", class:"patrimonio", nature:"credito"}, amount:currentResult});
    }
    const totalAssets = assets.reduce((s,r)=>s+r.amount,0);
    const totalLiabilities = liabilities.reduce((s,r)=>s+r.amount,0);
    const totalEquity = equity.reduce((s,r)=>s+r.amount,0);
    return {assets, liabilities, equity, totalAssets, totalLiabilities, totalEquity};
  }

  function delContableAccount(id){
    const acc = contableAccountById(id);

          }
          const idx = (state.accounting.entries||[]).findIndex(x=>String(x.id)===String(payload.id));
          if(idx>=0) state.accounting.entries[idx] = payload;
          else state.accounting.entries.push(payload);
          if(payload.thirdParty && !state.accounting.thirdParties.includes(payload.thirdParty)) state.accounting.thirdParties.push(payload.thirdParty);
          if(payload.costCenter && !state.accounting.costCenters.includes(payload.costCenter)) state.accounting.costCenters.push(payload.costCenter);
          normalizeAccountingState();
          save(); dlg.close(); toast("ok","Guardado","Asiento manual registrado."); render();
        };
      }
    });
  }

  function renderContable(){
    normalizeAccountingState();
    const months = getAvailableMonths();
    if(accountingPeriod && accountingPeriod!=="__all__" && /^\d{4}-\d{2}$/.test(accountingPeriod) && !months.includes(accountingPeriod)) months.unshift(accountingPeriod);
    const range = contablePeriodRange();
    const subnav = [
      ["summary","Resumen"],
      ["journal","Libro diario"],
      ["trial","Balance de prueba"],
      ["results","Resultados"],
      ["balance","Balance general"],
      ["accounts","Plan de cuentas"],
      ["portfolio","Cartera / proveedores"]
    ].map(([id,label])=>`<button class="btn ${accountingView===id?'primary':''}" data-conta-view="${id}">${label}</button>`).join("");
    const periodSel = `<select id="contaPeriodSel"><option value="__all__" ${accountingPeriod==="__all__"?'selected':''}>Todo el histórico</option>${months.map(m=>`<option value="${m}" ${accountingPeriod===m?'selected':''}>${m}</option>`).join("")}</select>`;
    let body = "";
    if(accountingView==="summary") body = renderContableSummary(range);
    else if(accountingView==="journal") body = renderContableJournal(range);
    else if(accountingView==="trial") body = renderContableTrial(range);
    else if(accountingView==="results") body = renderContableResults(range);
    else if(accountingView==="balance") body = renderContableBalance(range);
    else if(accountingView==="accounts") body = renderContableAccounts();
    else body = renderContablePortfolio();

    view.innerHTML = shell(
      "Contable",
      "Módulo útil para contador: plan de cuentas, asientos, libro diario, balance de prueba, estado de resultados, balance general y control de cartera.",
      `<div class="contaToolbar">
        <button class="btn" id="contaNewEntry">Nuevo asiento</button>
        <button class="btn" id="contaNewAccount">Nueva cuenta</button>
        <button class="btn" id="contaOwnerBtn">Capital inicial</button>
        <span class="contaBadge">Periodo</span>${periodSel}
      </div>`,
      `<div class="contaSubnav">${subnav}</div>${body}`
    );

    const psel = $("#contaPeriodSel");
    if(psel) psel.onchange = ()=>{ accountingPeriod = psel.value || "__all__"; renderContable(); };
    const ne = $("#contaNewEntry"); if(ne) ne.onclick = ()=>openContableEntry();
    const na = $("#contaNewAccount"); if(na) na.onclick = ()=>openContableAccount();
    const ob = $("#contaOwnerBtn"); if(ob) ob.onclick = ()=>openContableOwner();

    view.onclick = (e)=>{
      const btn = e.target.closest("button");
      if(!btn) return;
      if(btn.dataset.contaView){ accountingView = btn.dataset.contaView; renderContable(); return; }
      if(btn.dataset.contaQuick==="entry"){ openContableEntry(); return; }
      if(btn.dataset.contaQuick==="account"){ openContableAccount(); return; }
      if(btn.dataset.contaQuick==="owner"){ openContableOwner(); return; }
      if(btn.dataset.contaEditAccount){ openContableAccount(btn.dataset.contaEditAccount); return; }
      if(btn.dataset.contaDelAccount){ delContableAccount(btn.dataset.contaDelAccount); return; }
      if(btn.dataset.contaEditEntry){ openContableEntry(btn.dataset.contaEditEntry); return; }
      if(btn.dataset.contaDelEntry){ delContableEntry(btn.dataset.contaDelEntry); return; }
    };
  }

      .filter(t=>matchQ(t.title,t.dueDate,t.priority,t.status,t.notes))
      .sort((a,b)=>(a.status||"").localeCompare(b.status||"") || (a.dueDate||"").localeCompare(b.dueDate||""));

    const taskGroups=[
      {
        key:"general",
        label:"Alertas generales",
        sub:"Destete, cobros, chequeos, tareas manuales y otras alertas existentes.",
        filter:(t)=>!(t && t.autoKind==="sanitary_protocol")
      },
      {
        key:"gestation",
        label:"Cerdas gestantes",
        sub:"Protocolos y alertas sanitarias de gestación.",
        filter:(t)=>!!(t && t.autoKind==="sanitary_protocol" && t.protocolGroup==="gestation")
      },
      {
        key:"lactation",
        label:"Cerdas en lactancia",
        sub:"Protocolos y alertas sanitarias post-parto.",
        filter:(t)=>!!(t && t.autoKind==="sanitary_protocol" && t.protocolGroup==="lactation")
      },
      {
        key:"piglets",
        label:"Lechones",
        sub:"Vacunas, procedimientos y alertas sanitarias de lechones.",
        filter:(t)=>!!(t && t.autoKind==="sanitary_protocol" && t.protocolGroup==="piglets")
      }
    ];

    const taskRow=(t)=>{
      const dueIn=t.dueDate?daysBetween(now,t.dueDate):null;
      const st=t.status||"pendiente";
      const tag=st==="hecha"?`<span class="tag ok">Hecha</span>`:(dueIn!==null&&dueIn<0?`<span class="tag bad">Vencida</span>`:`<span class="tag warn">Pendiente</span>`);
      return `<tr>
        <td>${tag} <span class="tag">${esc(t.priority||"media")}</span></td>
        <td><b>${esc(t.title)}</b><div class="muted">${esc(t.notes||"")}</div></td>
        <td class="mono">${esc(t.dueDate||"—")}<div class="muted">${dueIn!==null?(dueIn>=0?`${dueIn} días`:`${Math.abs(dueIn)} días tarde`):""}</div></td>
        <td class="mono">${esc(t.relatedType||"—")} ${t.relatedId?esc(t.relatedId.slice(-6)):""}</td>
        <td>
          ${st!=="hecha"?`<button class="btn" data-act="done" data-id="${t.id}">Hecha</button>`:`<button class="btn" data-act="undo" data-id="${t.id}">Reabrir</button>`}
          <button class="btn danger" data-act="del" data-id="${t.id}">Eliminar</button>
        </td>
      </tr>`;
    };

    const counts={};
    taskGroups.forEach(g=>counts[g.key]=allTasks.filter(g.filter).length);
    const currentGroup=(window.__taskGroupOpen && taskGroups.some(g=>g.key===window.__taskGroupOpen)) ? window.__taskGroupOpen : "";

    function renderGroupTable(key){
      const group=taskGroups.find(g=>g.key===key);
      if(!group) return "";
      const rows=allTasks.filter(group.filter).map(taskRow).join("");
      return `<div class="helpCard" style="margin-top:14px">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px">
          <div>
            <div class="title" style="margin-bottom:4px">${esc(group.label)}</div>
            <div class="muted">${esc(group.sub)}</div>
          </div>
          <button class="btn" data-close-task-group="${group.key}">✕ Cerrar</button>
        </div>
        <div class="wrap"><table>
          <thead><tr><th>Estado</th><th>Tarea</th><th>Vence</th><th>Relacionado</th><th>Acciones</th></tr></thead>
          <tbody>${rows||`<tr><td colspan="5" class="muted">Sin tareas en este grupo.</td></tr>`}</tbody>
        </table></div>
      </div>`;
    }

    const groupButtons = taskGroups.map(g=>{
      const active = currentGroup===g.key ? "primary" : "";
      return `<button class="btn ${active}" data-task-group="${g.key}">${esc(g.label)} <span class="tag">${counts[g.key]||0}</span></button>`;
    }).join("");

    const tableBlock = currentGroup
      ? renderGroupTable(currentGroup)
      : `<div class="helpCard" style="margin-top:14px"><div class="muted">Presiona uno de los botones para abrir la tabla correspondiente.</div></div>`;

    view.innerHTML = shell(
      "Tareas",
      "Agenda destete, chequeos, vacunación, cobros y alertas sanitarias automáticas para gestación, lactancia y lechones.",
      `<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:flex-end"><button class="btn primary" id="add"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-plus" xlink:href="#i-plus"></use></svg><span>Nueva tarea</span></button></div>`,
      `<div class="helpCard">
        <div class="title" style="margin-bottom:8px">Tablas de tareas</div>
        <div class="muted" style="margin-bottom:10px">Abre cada tabla por botón: alertas generales, cerdas gestantes, cerdas en lactancia o lechones.</div>
        <div class="row" style="gap:10px;flex-wrap:wrap">${groupButtons}</div>
      </div>
      ${tableBlock}`
    );
    $("#add").onclick=()=>openTask();
    view.onclick=(e)=>{
      const groupBtn=e.target.closest("button[data-task-group]");
      if(groupBtn){
        const key=groupBtn.dataset.taskGroup||"";
        window.__taskGroupOpen = window.__taskGroupOpen===key ? "" : key;
        render();
        return;
      }
      const closeBtn=e.target.closest("button[data-close-task-group]");
      if(closeBtn){
        window.__taskGroupOpen="";
        render();
        return;
      }
      const b=e.target.closest("button[data-act]"); if(!b) return;
      const id=b.dataset.id, act=b.dataset.act;
      if(act==="del"){ state.tasks=state.tasks.filter(t=>t.id!==id); save(); toast("ok","Eliminada","Tarea eliminada."); render(); }
      if(act==="done"||act==="undo"){
        const t=state.tasks.find(x=>x.id===id); if(!t) return;
        t.status = act==="done" ? "hecha" : "pendiente";
        save(); toast("ok","Listo", act==="done"?"Marcada como hecha.":"Reabierta."); render();
      }
    };
  }

  async function cropToSquareDataUrl(file, outSize=256, quality=0.86){
    const srcDataUrl = await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload=()=>resolve(String(r.result||""));
      r.onerror=()=>reject(r.error||new Error("read-error"));
      r.readAsDataURL(file);
    });

    const img = await new Promise((resolve,reject)=>{
      const i = new Image();
      i.onload=()=>resolve(i);
      i.onerror=()=>reject(new Error("img-load-error"));
      i.src = srcDataUrl;
    });

    const w = img.naturalWidth || img.width || 0;
    const h = img.naturalHeight || img.height || 0;
    if(!w || !h) throw new Error("invalid-image");

    const side = Math.min(w,h);
    const sx = Math.floor((w - side)/2);
    const sy = Math.floor((h - side)/2);

    const canvas = document.createElement("canvas");
    canvas.width = outSize; canvas.height = outSize;
    const ctx = canvas.getContext("2d");
    if(!ctx) throw new Error("no-canvas");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, sx, sy, side, side, 0, 0, outSize, outSize);

    // Prefer WebP (mejor compresión). Si no soporta, usa PNG (mantiene transparencia).
    try{
      const webp = canvas.toDataURL("image/webp", Math.max(0.5, Math.min(0.95, quality)));
      if(String(webp).startsWith("data:image/webp")) return webp;
    }catch(e){}
    try{
      return canvas.toDataURL("image/png");
    }catch(e){}
    return canvas.toDataURL("image/jpeg", Math.max(0.5, Math.min(0.95, quality)));
  }

  function download(name, content, mime){
    const blob=new Blob([content],{type:mime||"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function exportJSON(){
    download(`granja_respaldo_${today()}.json`, JSON.stringify(state,null,2), "application/json");
    toast("ok","Exportado","Respaldo descargado.");
  }
  function importJSON(e){
    const file=e.target.files && e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{ state=Object.assign(defaults(), JSON.parse(r.result)); save(); toast("ok","Importado","Base restaurada."); current="dashboard"; renderNav(); render(); } catch { toast("bad","Error","JSON inválido."); } };
    r.readAsText(file);
  }

  function toCSV(rows){ return rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"); }

  function exportSalesCSV(){
    const rows=[["date","client","batch","qty","unitPrice","total","status","paidAmount","pending","dueDate","notes"]];
    state.sales.forEach(s=>{
      const c=get.client(s.clientId);
      const pending=Math.max(0,num(s.total)-num(s.paidAmount));
      rows.push([s.date,c?.name||"",s.batchId?s.batchId.slice(-8):"",s.qty,s.unitPrice,s.total,s.status,s.paidAmount,pending,s.dueDate,s.notes]);
    });
    download(`ventas_${today()}.csv`, toCSV(rows), "text/csv");
    toast("ok","Exportado","CSV de ventas descargado.");
  }
  function exportInvCSV(){
    const rows=[["name","category","qty","unit","minQty","unitCost","supplier","expiration","notes"]];
    state.inventory.forEach(i=>rows.push([i.name,i.category,i.qty,i.unit,i.minQty,i.unitCost,i.supplier,i.expiration,i.notes]));
    download(`inventario_${today()}.csv`, toCSV(rows), "text/csv");
    toast("ok","Exportado","CSV de inventario descargado.");
  }
  function exportTxCSV(){
    const rows=[["date","type","line","category","amount","method","notes"]];
    state.transactions.forEach(t=>rows.push([t.date,t.type,(t.line||""),t.category,t.amount,t.method,t.notes]));
    download(`finanzas_${today()}.csv`, toCSV(rows), "text/csv");
    toast("ok","Exportado","CSV de finanzas descargado.");
  }
